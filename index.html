<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<title>Тренажёр: Архитектор, 6 уровень</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#1b1f24;--muted:#5f6b7a;--line:#d8dee6;--accent:#1f4e79;--accent2:#2f6fb0;--btn:#2f6fb0;
  --ok:#1e7d34;--okbg:#e5f4e8;--bad:#b42318;--badbg:#fdeceb;--warn:#8a5a00;--warnbg:#fff4d6;--sel:#e3edf8;--skip:#7a8594}
@media (prefers-color-scheme:dark){:root{--bg:#12161b;--card:#1b2128;--text:#e7ebf0;--muted:#9aa6b4;--line:#2e3742;
  --accent:#7fb2e5;--accent2:#6aa6e0;--btn:#2a5f99;--ok:#5cc777;--okbg:#14301c;--bad:#ff7b6e;--badbg:#3a1714;--warn:#f0c15a;--warnbg:#3a2e10;--sel:#1f3046;--skip:#8a96a6}
  img.qimg,.optimg img{background:#fff;border-radius:6px}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:10px 12px 100px}
header.top{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){header.top{background:#0d2238}}
header.top .in{max-width:760px;margin:0 auto;padding:6px 8px 6px 12px;display:flex;align-items:center;gap:8px;min-height:56px}
header.top .t{flex:1;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .timer{font-variant-numeric:tabular-nums;font-size:15px;opacity:.95}
header.top .timer.over{color:#ffd0cb;font-weight:700}
header.top button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;min-height:44px;padding:0 14px;font:inherit;font-size:15px;cursor:pointer}
header.top #helpBtn{width:44px;padding:0;border-radius:50%;font-weight:700;font-size:18px}
.progress{height:4px;background:rgba(255,255,255,.25)}
.progress>i{display:block;height:100%;background:#fff;width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
h2{font-size:19px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:14px}
.lead{font-size:14px;color:var(--muted);margin:4px 2px 0}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);margin-bottom:6px}
.qtext{font-size:18px;font-weight:500;margin:0 0 6px;overflow-wrap:anywhere}
.instr{font-size:14px;color:var(--accent2);margin:4px 0 10px;font-weight:600}
img.qimg{display:block;max-width:100%;height:auto;margin:10px auto 4px;cursor:zoom-in;border:1px solid var(--line);border-radius:8px}
.hint-zoom{font-size:13px;color:var(--muted);text-align:center;margin:0 0 6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--text);
  border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;cursor:pointer;overflow-wrap:anywhere;position:relative}
.opt .mk{flex:0 0 26px;height:26px;border:2px solid var(--muted);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-top:-1px}
.opt.multi .mk{border-radius:6px}
.opt.on{border-color:var(--accent2);background:var(--sel)}
.opt.on .mk{background:var(--accent2);border-color:var(--accent2);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .mk{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .mk{border-color:var(--bad);background:var(--bad);color:#fff}
.opt.miss{border-style:dashed}
.opt:disabled{cursor:default;opacity:1;color:var(--text)}
.optgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
@media (min-width:560px){.optgrid{grid-template-columns:repeat(3,1fr)}}
.optimg{flex-direction:column;align-items:center;text-align:center}
.optimg img{width:100%;height:120px;object-fit:contain}
.optimg .cap{font-weight:600}
.optimg .zbtn{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center}
.seqnum{flex:0 0 28px;height:28px;border-radius:8px;border:2px dashed var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700}
.opt.on .seqnum{border-style:solid;border-color:var(--accent2);background:var(--accent2);color:#fff}
.opt.ok .seqnum{border-style:solid;border-color:var(--ok);background:var(--ok);color:#fff}
.opt.bad .seqnum{border-style:solid;border-color:var(--bad);background:var(--bad);color:#fff}
.coltitle{font-size:13px;color:var(--muted);font-weight:700;margin:12px 0 2px;text-transform:uppercase;letter-spacing:.03em}
.mrow{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.mrow .l{margin-bottom:8px;font-size:15px;overflow-wrap:anywhere}
.mrow select{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text)}
.mrow.ok{border-color:var(--ok);background:var(--okbg)}
.mrow.bad{border-color:var(--bad);background:var(--badbg)}
.rlist{margin:6px 0 4px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:15px}
.rlist div{margin:3px 0;overflow-wrap:anywhere}
.rlist b{display:inline-block;min-width:22px}
input.open{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text)}
input.open.ok{border-color:var(--ok);background:var(--okbg)}
input.open.bad{border-color:var(--bad);background:var(--badbg)}
.counter{font-size:14px;color:var(--muted);margin-top:8px}
.counter.alert{color:var(--bad);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--btn);color:#fff;min-height:48px;text-align:center}
.btn.sec{background:transparent;color:var(--accent2);border:1.5px solid var(--accent2)}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.full{width:100%}
.btn.mt{margin-top:10px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent2);text-decoration:underline;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:4;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.bar .in .btn{flex:1;padding:12px 8px}
.bar .in .btn.nav{flex:0 0 60px;font-size:20px}
.fb{border-radius:12px;padding:12px;margin-top:12px;font-size:15px;scroll-margin-top:72px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.fb .h{font-weight:700;font-size:16px;margin-bottom:4px}
.fb .ans{margin:6px 0 0;padding:0;list-style:none}
.fb .ans li{margin:2px 0;padding:2px 0;overflow-wrap:anywhere}
.fn{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent2);background:var(--card);border-radius:0 10px 10px 0;font-size:14px;overflow-wrap:anywhere}
.fn .fh{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-bottom:2px}
.fn .fd{font-weight:600}
.fn .fq{margin-top:6px;font-style:italic;color:var(--muted)}
.fn a{color:var(--accent2);white-space:nowrap}
.selfok{margin-top:10px;font-size:14px}
.bq{border-top:1px solid var(--line);padding:14px 0}
.bq:first-child{border-top:0;padding-top:4px}
.bq .qtext{font-size:16px}
.ans{margin:8px 0 0;padding:0;list-style:none}
.ans li{padding:6px 10px;border-radius:8px;margin:4px 0;font-size:15px;overflow-wrap:anywhere}
.ans li.r{background:var(--okbg);border:1px solid var(--ok);font-weight:600}
.ans li.r::before{content:"✓ ";color:var(--ok)}
.expl{margin-top:8px;font-size:15px}
.search{position:sticky;top:60px;z-index:3;background:var(--bg);padding:8px 0 6px}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 4px}
.chips button{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.chips button.on{border-color:var(--accent2);background:var(--sel);font-weight:600}
.warn{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 4px;padding:4px;background:var(--bg);border-radius:12px}
.seg button{border:0;border-radius:9px;padding:10px 6px;font:inherit;font-size:15px;font-weight:600;background:transparent;color:var(--muted);cursor:pointer;min-height:44px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hint{font-size:14px;color:var(--muted);margin:4px 2px 10px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 .btn{flex:1 1 140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:8px}
.grid button{height:42px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;cursor:pointer;padding:0}
.grid button.ans{background:var(--sel);border-color:var(--accent2)}
.grid button.ok{background:var(--okbg);border-color:var(--ok)}
.grid button.bad{background:var(--badbg);border-color:var(--bad)}
.grid button.cur{outline:3px solid var(--accent2);outline-offset:1px}
details.navp summary{cursor:pointer;color:var(--accent2);font-weight:600;font-size:15px;padding:6px 0}
.score{text-align:center}
.score .big{font-size:52px;font-weight:800;line-height:1.1}
.score .verdict{display:inline-block;margin-top:6px;padding:6px 14px;border-radius:20px;font-weight:700}
.score .verdict.ok{background:var(--okbg);color:var(--ok)}
.score .verdict.bad{background:var(--badbg);color:var(--bad)}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-child{border-top:0}
.rev .hd{display:flex;gap:8px;align-items:baseline;cursor:pointer;background:none;border:0;padding:0;width:100%;text-align:left;font:inherit;color:var(--text)}
.rev .hd .st{font-weight:800;flex:0 0 20px}
.rev .hd .st.ok{color:var(--ok)}.rev .hd .st.bad{color:var(--bad)}.rev .hd .st.skip{color:var(--skip)}
.rev .hd .tx{flex:1;font-size:15px;overflow-wrap:anywhere}
.rev .hd .arr{color:var(--muted);font-size:13px}
.rev .body{margin-top:8px;font-size:15px}
.rev .body .row{margin:6px 0;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.tabs button{flex:1 1 auto;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 8px;font:inherit;font-size:14px;cursor:pointer;min-height:44px}
.tabs button.on{border-color:var(--accent2);background:var(--sel);font-weight:600}
.hist{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.zoom{position:fixed;inset:0;background:#000;z-index:20;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom img{display:block;background:#fff;max-width:none;width:200%;margin:60px 0 50px}
@media (min-width:760px){.zoom img{width:auto;margin:60px auto 50px}}
.zoom .x{position:fixed;top:10px;right:10px;background:#000;color:#fff;border:2px solid #fff;border-radius:50%;width:48px;height:48px;font-size:26px;line-height:1;z-index:21;cursor:pointer}
.zoom .zh{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(0,0,0,.8);color:#fff;font-size:14px;text-align:center;z-index:21}
.help h2{margin-top:18px}
.help h2:first-child{margin-top:0}
.help p,.help li{font-size:15px}
.help ul{padding-left:20px;margin:6px 0}
.help li{margin:4px 0}
.help .chip{display:inline-block;padding:1px 8px;border-radius:8px;border:1.5px solid var(--line);font-size:13px;font-weight:600}
.help .chip.ans{background:var(--sel);border-color:var(--accent2)}
.help .chip.ok{background:var(--okbg);border-color:var(--ok)}
.help .chip.bad{background:var(--badbg);border-color:var(--bad)}
a{color:var(--accent2)}
</style>
</head>

const BANK = [{"id": 1, "text": "Как называется система пропорционирования, разработанная Ле Корбюзье, базирующаяся на средневзвешенных объемах антропологического тела и «золотого ряда» (в золотом ряду каждая следующая цифра рассчитывается посредством сложения двух предшествующих чисел)?", "instruction": "", "options": ["модулор", "фикеллура", "помериум", "мегарон", "метопа"], "type": "single", "answer": [1], "source": "Большая советская энциклопедия, статья «Модулор»; Ле Корбюзье, «Модулор» (Le Modulor, 1948/1951)", "quote": "Модулор... система пропорций, предложенная в 1940-х гг. французским архитектором Ле Корбюзье и его сотрудниками. М. основывается на размерах и пропорциях человеческого тела..., на золотом сечении и рядах Фибоначчи чисел.", "url": "https://www.booksite.ru/fulltext/1/001/008/077/426.htm", "explanation": "Модулор — система пропорций Ле Корбюзье, построенная на размерах человека (рост 183 см) и на золотом сечении / ряде Фибоначчи. Остальные слова — термины античной архитектуры и керамики.", "confidence": "high", "note": ""}, {"id": 2, "text": "Что не вправе делать архитектор?", "instruction": "Выберите три правильных варианта ответа", "options": ["принимать на себя обязательства ответственного представителя заказчика (застройщика) при заключении договора подряда на строительство", "разглашать информацию о намерениях заказчика (застройщика) по реализации архитектурного проекта", "соблюдать нормативные требования по обеспечению пожарной безопасности при проектировании объекта", "соблюдать порядок осуществления градостроительной деятельности", "соблюдать требования в области проектирования и строительства", "участвовать в конкурсе на архитектурный проект, являясь членом жюри данного конкурса", "учитывать при проектировании экологические нормы и правила"], "type": "multi", "count": 3, "answer": [1, 2, 6], "source": "Федеральный закон от 17.11.1995 № 169-ФЗ «Об архитектурной деятельности в РФ», ст. 13 ч. 2 и 3", "quote": "Архитектор не вправе разглашать информацию о намерениях заказчика (застройщика) по реализации архитектурного проекта без его согласия... не вправе принимать на себя обязательства ответственного представителя заказчика... не вправе участвовать в конкурсе на архитектурный проект, являясь членом жюри", "url": "https://pravo.ppt.ru/fz/169-fz-2494", "explanation": "Запреты для архитектора прямо перечислены в ст. 13 закона об архитектурной деятельности. Остальные варианты — это его обязанности (соблюдать нормы), а не запреты.", "confidence": "high", "note": "В варианте 1 опущено условие закона: запрет действует «при наличии личной заинтересованности в прибылях подрядной организации, участвующей в торгах подряда». Составитель всё равно считает этот вариант верным."}, {"id": 3, "text": "Какую ответственность несут граждане, должностные лица или юридические лица за осуществление строительства зданий и сооружений, в том числе жилых зданий, а также объектов индивидуального строительства без разрешения?", "instruction": "Выберите один вариант ответа.", "options": ["административную", "гражданскую", "дисциплинарную", "материальную", "уголовную"], "type": "single", "answer": [1], "source": "Кодекс РФ об административных правонарушениях, ст. 9.5 ч. 1", "quote": "1. Строительство, реконструкция объектов капитального строительства без разрешения на строительство... влекут наложение административного штрафа на граждан...; на должностных лиц...; на юридических лиц...", "url": "https://rulaws.ru/koap/Razdel-II/Glava-9/Statya-9.5/", "explanation": "Стройка без разрешения — административное правонарушение по ст. 9.5 КоАП. Штраф предусмотрен для граждан, должностных и юридических лиц.", "confidence": "high", "note": ""}, {"id": 4, "text": "Как называются линии в соответствии с Градостроительным кодексом Российской Федерации, которые обозначают границы территорий общего пользования и подлежат установлению, изменению или отмене в документации по планировке территории?", "instruction": "", "options": ["зеленые линии границ природоохранной зоны", "красные линии", "черные линии", "линии отвода территорий под застройку", "линии границ зон градостроительного регулирования"], "type": "single", "answer": [2], "source": "Градостроительный кодекс РФ, ст. 1 п. 11", "quote": "11) красные линии - линии, которые обозначают границы территорий общего пользования и подлежат установлению, изменению или отмене в документации по планировке территории;", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/cdec16ec747f11f3a7a39c7303d03373e0ef91c4/", "explanation": "Формулировка вопроса дословно повторяет определение красных линий из ст. 1 ГрК РФ.", "confidence": "high", "note": ""}, {"id": 5, "text": "Какой законодательный акт устанавливает, кем могут выполняться инженерные изыскания?", "instruction": "Выберите один вариант ответа.", "options": ["Градостроительный кодекс Российской Федерации", "Кодекс Российской Федерации об административных правонарушениях", "Свод правил СП 47.13330.2012 Инженерные изыскания для строительства. Основные положения. Актуализированная редакция СНиП 11-02-96", "Свод правил СП 48.13330.2011 Организация строительства. Актуализированная редакция СНиП 12-01-2004", "Федеральный закон «О техническом регулировании» от 27.12.2002 № 184-ФЗ"], "type": "single", "answer": [1], "source": "Градостроительный кодекс РФ, ст. 47 ч. 2", "quote": "Работы по договорам о выполнении инженерных изысканий... должны выполняться только индивидуальными предпринимателями или юридическими лицами, которые являются членами саморегулируемых организаций в области инженерных изысканий, если иное не предусмотрено настоящей статьей.", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/f651879e0acd4680a6fdc29f983536624055cbcc/", "explanation": "Кто вправе выполнять инженерные изыскания (члены СРО — ИП и юрлица), устанавливает ст. 47 ГрК РФ. СП 47 и СП 48 — технические документы, а не законы. КоАП и 184-ФЗ этот вопрос не регулируют.", "confidence": "high", "note": ""}, {"id": 6, "text": "Укажите в каких городах возможно размещение встроенных и встроенно-пристроенных помещений общественного назначения выше второго этажа?", "instruction": "Выберите два варианта правильных ответов", "options": ["в крупнейших", "в крупных", "в средних", "в малых"], "type": "multi", "count": 2, "answer": [1, 2], "source": "СП 54.13330.2022, п. 4.12 (ранее СП 54.13330.2011 / СНиП 31-01-2003, п. 4.10)", "quote": "В крупных и крупнейших городах (по СП 42.13330) возможно размещение встроенных и встроенно-пристроенных помещений общественного назначения выше второго этажа при условии соблюдения для жилых помещений требований СанПиН 1.2.3685.", "url": "https://fkr-spb.ru/upload/iblock/e62/7vxc9o7pegu5vnd1xegbtxzg4ffdhry5.pdf", "explanation": "Обычно общественные помещения в жилом доме размещают не выше второго этажа. Выше разрешено только в крупных и крупнейших городах.", "confidence": "high", "note": "В СП 54.13330.2011 (п. 4.10) было уже: «в крупных и крупнейших городах — в третьем этаже». Ответ от редакции не зависит."}, {"id": 7, "text": "Где в жилых зданиях не допускается размещать спортивные площадки для отдыха взрослых, площадки для сушки белья и чистки одежды или солярий?", "instruction": "Выберите один вариант ответа.", "options": ["в соединительных элементах между жилыми зданиями", "на внеквартирных террасах и верандах", "на кровлях встроенно-пристроенных помещений общественного назначения", "на межэтажной площадке", "на эксплуатируемой кровле многоквартирных зданий", "при входной зоне"], "type": "single", "answer": [4], "source": "СП 54.13330.2011, п. 4.16 (в действующем СП 54.13330.2022 — пп. 4.23, 6.4.23)", "quote": "4.16 На эксплуатируемой кровле многоквартирных зданий, кровлях встроенно-пристроенных помещений общественного назначения, а также при входной зоне, на внеквартирных террасах и верандах, в соединительных элементах между жилыми зданиями... допускается размещать... площадки для сушки белья...", "url": "https://stroy-exspert.com/upload/medialibrary/kontrol-kratnosti-vozdukhoobmena/%D0%A1%D0%9F%2054.13330.2011%20%D0%97%D0%B4%D0%B0%D0%BD%D0%B8%D1%8F%20%D0%B6%D0%B8%D0%BB%D1%8B%D0%B5%20%D0%BC%D0%BD%D0%BE%D0%B3%D0%BE%D0%BA%D0%B2%D0%B0%D1%80%D1%82%D0%B8%D1%80%D0%BD%D1%8B%D0%B5.pdf", "explanation": "СП 54 перечисляет, где такие площадки разрешены: эксплуатируемая кровля, кровля встроенно-пристроенных помещений, входная зона, внеквартирные террасы и веранды, переходы между зданиями. Межэтажной площадки (лестничной) в этом списке нет.", "confidence": "medium", "note": "Прямого запрета в норме нет: СП 54.13330 перечисляет, где такие площадки допускается размещать (эксплуатируемая кровля, террасы, кровли встроенных помещений, соединительные элементы и т. п.). Межэтажная площадка — единственный вариант, которого в этом перечне нет."}, {"id": 8, "text": "Что называется «проектной документацией»?", "instruction": "", "options": ["документация, содержащая материалы в текстовой и графической формах и (или) в форме информационной модели и определяющая архитектурные, функционально-технологические, конструктивные и инженерно-технические решения для обеспечения строительства, реконструкции объектов капитального строительства, их частей, капитального ремонта", "комплекс документов, раскрывающих архитектурный замысел проекта и содержащих обоснование необходимости его реализации на данной территории, состоящий из текстовых и графических материалов, необходимых для возведения данного объекта, реконструкции и/или технического перевооружения", "совокупность текстовых и графических документов, обеспечивающих график выполнения проектных, общестроительных и монтажных работ объекта капитального строительства, обеспечения строительства оборудованием, изделиями и материалами и/или изготовления строительных изделий", "совокупность текстовых и графических документов, обеспечивающих реализацию принятых и утвержденных технических решений объекта капитального строительства, необходимых для производства строительных и монтажных работ, обеспечения строительства оборудованием, изделиями и материалами и/или изготовления строительных изделий", "текстовые и графические материалы, отражающие фактическое исполнение проектных решений и фактическое положение объектов капитального строительства и их элементов в процессе строительства, реконструкции, капитального ремонта объектов капитального строительства по мере завершения определенных в проектной документации работ"], "type": "single", "answer": [1], "source": "Градостроительный кодекс РФ, ст. 48 ч. 2", "quote": "2. Проектная документация представляет собой документацию, содержащую материалы в текстовой и графической формах и (или) в форме информационной модели и определяющую архитектурные, функционально-технологические, конструктивные и инженерно-технические решения для обеспечения строительства...", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/b884020ea7453099ba8bc9ca021b84982cadea7d/", "explanation": "Вариант 1 дословно повторяет определение проектной документации из ст. 48 ГрК РФ. Вариант 4 — это рабочая документация, вариант 5 — исполнительная.", "confidence": "high", "note": ""}, {"id": 9, "text": "Какие данные не относятся к содержанию графической части раздела 3 «Архитектурные решения»?", "instruction": "Выберите 2 варианта правильных ответов.", "options": ["конструктивное решение", "отображение фасадов зданий и сооружений", "поэтажные планы зданий с приведением экспликации помещений", "продольный и поперечный разрезы зданий", "сводный план сетей инженерно-технического обеспечения", "цветовое решение фасадов (при необходимости)"], "type": "multi", "count": 2, "answer": [1, 5], "source": "Постановление Правительства РФ от 16.02.2008 № 87, п. 13 (графическая часть раздела 3), п. 12 «о» (раздел 2), п. 14 (раздел 4)", "quote": "13. Раздел 3 «Объемно-планировочные и архитектурные решения»... в графической части и) отображение фасадов; к) цветовое решение фасадов (при необходимости); л) поэтажные планы зданий и сооружений с приведением экспликации помещений...; л(2)) чертежи характерных разрезов зданий...", "url": "https://www.consultant.ru/document/cons_doc_LAW_75048/cae383069aa05e04750eb0df525a6c535460cc1a/", "explanation": "Конструктивные решения относятся к разделу 4 «Конструктивные решения». Сводный план сетей инженерно-технического обеспечения входит в раздел 2 «Схема планировочной организации земельного участка». Фасады, цветовое решение, планы и разрезы — графика архитектурного раздела.", "confidence": "medium", "note": "В редакции ПП 87 до 01.09.2022 графическая часть раздела 3 включала только фасады, цветовое решение, поэтажные планы и иные материалы, а разрезы были в разделе 4. По той редакции «не относящихся» вариантов три, что противоречит «выберите 2». В действующей редакции (ПП № 963 от 27.05.2022) разрезы в разделе 3 есть (пп. «л(2)», для производственных объектов), но раздел называется «Объемно-планировочные и архитектурные решения». Составитель, по-видимому, считает разрезы частью раздела АР."}, {"id": 10, "text": "Изданием какого документа производится назначение руководителя и специалистов, ответственных за проведение авторского надзора?", "instruction": "", "options": ["заявки от главного архитектора", "приказа Администрации населенного пункта", "приказа проектной организации", "распоряжения главного архитектора", "распоряжения начальника проектного отдела"], "type": "single", "answer": [3], "source": "СП 11-110-99 «Авторский надзор за строительством зданий и сооружений», п. 4.4; СП 246.1325800.2016, п. 6.2", "quote": "4.4 Назначение руководителя и специалистов, ответственных за проведение авторского надзора, производится приказом организации и доводится до сведения заказчика... (СП 246.1325800.2016, п. 6.2: «...назначаются организационно-распорядительным документом (приказом) руководителя проектной организации»)", "url": "https://files.stroyinf.ru/Data2/1/4293755/4293755715.htm", "explanation": "Группу авторского надзора и её руководителя назначает приказом проектная организация, которая разработала документацию. Об этом сообщают заказчику.", "confidence": "high", "note": "Формулировка вопроса взята из СП 11-110-99. Сейчас действует СП 246.1325800 в новых редакциях (2023, а с 04.07.2026 — 2026), их текст по этому пункту я не сверял. Редакция 2016 года говорит о том же: приказ руководителя проектной организации."}, {"id": 11, "text": "Если отсутствуют утвержденные границы территории объекта культурного наследия, расположенного в границах населенного пункта, то на каком расстоянии от линии внешней стены памятника либо от линии общего контура ансамбля, образуемого соединением внешних точек наиболее удаленных элементов ансамбля, включая парковую территорию, устанавливаются границы защитной зоны такого объекта (в соответствии с Федеральным законом «Об объектах культурного наследия (памятниках истории и культуры) народов Российской Федерации» от 25.06.2002 № 73-ФЗ)?", "instruction": "", "options": ["100 м", "200 м", "300 м", "400 м", "500 м"], "type": "single", "answer": [2], "source": "Федеральный закон от 25.06.2002 № 73-ФЗ, ст. 34.1 ч. 4", "quote": "4. В случае отсутствия утвержденных границ территории объекта культурного наследия, расположенного в границах населенного пункта, границы защитной зоны такого объекта устанавливаются на расстоянии 200 метров от линии внешней стены памятника либо от линии общего контура ансамбля...", "url": "https://www.consultant.ru/document/cons_doc_LAW_37318/f8f2eca6ba8522da15e1e300e16c09439c9eb45c/", "explanation": "Если границы территории памятника не утверждены, защитная зона в населённом пункте — 200 м, вне населённого пункта — 300 м. При утверждённых границах — 100 м (150 м для ансамбля).", "confidence": "high", "note": ""}, {"id": 12, "text": "На какие виды в зависимости от функционального назначения и характерных признаков подразделяются объекты капитального строительства (в соответствии с Постановлением Правительства Российской Федерации от 16.02.2008 № 87 «О составе разделов проектной документации и требованиях к их содержанию»)?", "instruction": "Выберите три правильных варианта ответов.", "options": ["линейные объекты (трубопроводы, автомобильные и железные дороги, линии электропередачи", "общественно значимые архитектурные объекты (здания, сооружения и градостроительные комплексы, имеющие социальную, культурную или градостроительную ценность", "объекты культурного наследия объекты (недвижимого имущества (включая объекты археологического наследия) и иные объекты с исторически связанными с ними территориями)", "объекты непроизводственного назначения (здания, строения, сооружения жилищного фонда, социально-культурного и коммунально-бытового назначения, а также иные объекты капитального строительства непроизводственного назначения)", "объекты производственного назначения (здания, строения, сооружения производственного назначения, в том числе объекты обороны и безопасности), за исключением линейных объектов", "объекты сельскохозяйственного назначения (здания, строения складов, животноводческих ферм, птицефабрик)", "подземные объекты (здания, сооружения строения)"], "type": "multi", "count": 3, "answer": [1, 4, 5], "source": "Постановление Правительства РФ от 16.02.2008 № 87, п. 2", "quote": "...подразделяются на следующие виды: а) объекты производственного назначения...; б) объекты непроизводственного назначения...; в) линейные объекты (трубопроводы, автомобильные и железные дороги, линии электропередачи и др.).", "url": "https://www.consultant.ru/document/cons_doc_LAW_75048/0b4a18f4c37afd1449df12a8ea0515cc4dfc5667/", "explanation": "ПП № 87 делит объекты на три вида: производственного назначения, непроизводственного назначения и линейные. Остальные варианты такой классификации в постановлении нет.", "confidence": "high", "note": "В тексте вариантов есть опечатки (незакрытые скобки), на ответ они не влияют."}, {"id": 13, "text": "Какой раздел проектной документации содержит сводный план сетей инженерно-технического обеспечения и ситуационный план размещения объекта?", "instruction": "", "options": ["пояснительная записка", "проект организации строительства", "разбивочный план", "сведения об инженерном оборудовании, о сетях инженерно-технического обеспечения, перечень инженерно-технических мероприятий, содержание технологических решений", "схема планировочной организации земельного участка"], "type": "single", "answer": [5], "source": "Постановление Правительства РФ от 16.02.2008 № 87, п. 12 пп. «о», «п»", "quote": "12. Раздел 2 «Схема планировочной организации земельного участка» содержит: ... о) сводный план сетей инженерно-технического обеспечения...; п) ситуационный план размещения объекта капитального строительства в границах земельного участка...", "url": "https://www.consultant.ru/document/cons_doc_LAW_75048/cae383069aa05e04750eb0df525a6c535460cc1a/", "explanation": "Сводный план инженерных сетей и ситуационный план входят в графическую часть раздела 2 «Схема планировочной организации земельного участка» (СПОЗУ).", "confidence": "high", "note": ""}, {"id": 14, "text": "Какой раздел проектной документации должен содержать описание архитектурных решений, обеспечивающих естественное освещение помещений с постоянным пребыванием людей?", "instruction": "", "options": ["архитектурные решения", "мероприятия по обеспечению соблюдения требований энергетической эффективности и требований оснащенности зданий, строений и сооружений приборами учета используемых энергетических ресурсов", "общие положения", "перечень мероприятий по охране окружающей среды", "план благоустройства территории"], "type": "single", "answer": [1], "source": "Постановление Правительства РФ от 16.02.2008 № 87, п. 13 пп. «д»", "quote": "13. Раздел 3 «Объемно-планировочные и архитектурные решения» содержит: в текстовой части ... д) описание архитектурных решений, обеспечивающих естественное освещение помещений с постоянным пребыванием людей;", "url": "https://www.consultant.ru/document/cons_doc_LAW_75048/cae383069aa05e04750eb0df525a6c535460cc1a/", "explanation": "Описание решений по естественному освещению входит в текстовую часть архитектурного раздела (раздел 3).", "confidence": "high", "note": "С 01.09.2022 раздел 3 называется «Объемно-планировочные и архитектурные решения» (раньше — «Архитектурные решения»). Ответ от этого не меняется."}, {"id": 15, "text": "Фамилию какого должностного лица следует указывать на титульном листе тома рабочей документации (в соответствии с ГОСТ Р 21.1101-2013 Система проектной документации для строительства (СПДС). Основные требования к проектной и рабочей документации (с Поправкой)?", "instruction": "Выберите два правильных варианта ответа.", "options": ["руководителя проектной организации", "руководителя проектной группы", "представителя заказчика", "начальника отдела", "главного инженера", "главного архитектора"], "type": "multi", "count": 2, "answer": [5, 6], "source": "ГОСТ Р 21.1101-2013, п. 8.7 и рисунок Р.2 (приложение Р)", "quote": "Титульные листы рабочих документов оформляют подписью лица, ответственного за подготовку рабочей документации, — главного инженера (архитектора) проекта.", "url": "https://lidermsk.ru/media/documents/51/5178ccfc46ab0aabea54d5013456a331.pdf", "explanation": "По ГОСТ Р 21.1101-2013 титульный лист рабочей документации подписывает лицо, ответственное за её подготовку: главный инженер проекта или главный архитектор проекта. Под ним указывают его фамилию.", "confidence": "medium", "note": "В вариантах нет слова «проекта» («главного инженера», «главного архитектора»). Поэтому возможно другое прочтение: 1 и 5 (руководитель или главный инженер организации + ГИП). Но по тому же п. 8.7 это правило для томов проектной, а не рабочей документации. Действующий ГОСТ Р 21.101-2020 (п. 8.1.4) регулирует подписи только на титульных листах проектной документации: руководитель или главный инженер организации и лицо, ответственное за подготовку ПД."}, {"id": 16, "text": "Что из приведенного ниже не относится к прилагаемым документам, разрабатываемым в дополнение к рабочим чертежам основного комплекта, в соответствии с ГОСТ Р 21.1101–2013 «Система проектной документации для строительства. Основные требования к проектной и рабочей документации»?", "instruction": "Выберите один вариант ответа.", "options": ["локальная смета", "опросные листы и габаритные чертежи, выполняемые в соответствии с данными изготовителей (поставщиков) оборудования", "рабочая документация на строительные изделия", "разрешительная документация и проект производства работ", "спецификация оборудования, изделий и материалов, выполняемая в соответствии с ГОСТ 21.110", "эскизные чертежи общих видов нетиповых изделий, выполняемые в соответствии с ГОСТ 21.114"], "type": "single", "answer": [4], "source": "ГОСТ Р 21.1101-2013, п. 4.2.6 (то же — ГОСТ Р 21.101-2020, п. 4.2.6)", "quote": "4.2.6 К прилагаемым документам относят: рабочую документацию на строительные изделия; эскизные чертежи общих видов нетиповых изделий...; спецификацию оборудования, изделий и материалов...; опросные листы и габаритные чертежи...; локальную смету; другие документы, предусмотренные... стандартами СПДС.", "url": "https://lidermsk.ru/media/documents/51/5178ccfc46ab0aabea54d5013456a331.pdf", "explanation": "В перечне прилагаемых документов нет разрешительной документации и проекта производства работ. ППР разрабатывает строительная организация, а не проектировщик.", "confidence": "high", "note": "В ГОСТ Р 21.101-2020 к перечню добавлены «расчеты». Ответ не меняется."}, {"id": 17, "text": "Проектную документацию комплектуют по отдельным разделам и подразделам. Какое высказывание из приведенных ниже является верным в соответствии с ГОСТ Р 21.1101– 2013 «Система проектной документации для строительства. Основные требования к проектной и рабочей документации»?", "instruction": "Выберите один вариант ответа.", "options": ["при большом объеме (в бумажной форме) раздела или подраздела, а также при привлечении субподрядчиков – разделять его на части, а части в случае необходимости – на книги", "при большом объеме (в бумажной форме) раздела или подраздела, а также при привлечении субподрядчиков допускается разделять его на книги, а книги в случае необходимости – на части", "при большом объеме (в бумажной форме) раздела или подраздела – разделять его на книги, а книги в случае необходимости – на части", "при большом объеме (в бумажной форме) раздела или подраздела – разделять его на тома, а тома – на книги", "при большом объеме (в бумажной форме) раздела или подраздела – разделять его на тома, а тома – на части"], "type": "single", "answer": [1], "source": "ГОСТ Р 21.1101-2013, п. 4.1.1 (в ГОСТ Р 21.101-2020 — п. 4.1.3)", "quote": "При большом объеме (в бумажной форме) раздела или подраздела, а также, при необходимости, в других случаях (например, при привлечении субподрядчиков) допускается разделять его на части, а части, в случае необходимости, на книги.", "url": "https://lidermsk.ru/media/documents/51/5178ccfc46ab0aabea54d5013456a331.pdf", "explanation": "Раздел проектной документации делят на части, а части при необходимости — на книги, а не наоборот. Повод — большой объём или привлечение субподрядчиков.", "confidence": "high", "note": "В верном варианте 1 опущено слово «допускается». Вариант 2 его содержит, но порядок «книги → части» в нём перепутан."}, {"id": 18, "text": "Какие выходы из указанных ниже относятся к аварийным?", "instruction": "Выберите два правильных варианта ответа", "options": ["выход в холл, имеющий выход непосредственно на лестничную клетку или на лестницу 3-го типа", "выход на балкон или лоджию с глухим простенком не менее 1,2 м от торца балкона (лоджии) до оконного проема (остекленной двери) или не менее 1,6 м между остекленными проемами, выходящими на балкон (лоджию)", "выход на переход шириной не менее 0,6 м, ведущий в смежную секцию здания класса Ф1.3 или в смежный пожарный отсек", "выход на эксплуатируемую кровлю или на специально оборудованный участок кровли, ведущий на лестницу 3-го типа", "выход через дверь, коридор, лестничную клетку, тамбур в безопасную зону", "выход через дверь, коридор, рекреационную площадку в безопасную зону"], "type": "multi", "count": 2, "answer": [2, 3], "source": "СП 1.13130.2009, пп. 5.4.9, 5.4.11; СНиП 21-01-97*, п. 6.20; действующий СП 1.13130.2020, п. 4.2.4 «а», «б»", "quote": "выход должен вести на балкон или лоджию с глухим простенком не менее 1,2 метра от торца балкона (лоджии) до оконного проема...; выход должен вести на переход шириной не менее 0,6 метра, ведущий в смежную секцию здания класса Ф1.3 или в смежный пожарный отсек", "url": "https://meganorm.ru/Data2/1/4293830/4293830689.pdf", "explanation": "Аварийные выходы — это выход на балкон или лоджию с глухим простенком и выход на переход в соседнюю секцию или пожарный отсек. Выходы в холл, на лестничную клетку, на кровлю к лестнице 3-го типа и в безопасную зону — эвакуационные.", "confidence": "high", "note": "В действующем СП 1.13130.2020 (п. 4.2.4 «б») формулировка изменена: «выход на открытый наружный переход (галерею) шириной не менее 0,6 м, ведущий в смежную пожарную секцию или в смежный пожарный отсек». Суть та же."}, {"id": 19, "text": "Что не является фактором, устанавливающим степень огнестойкости зданий, сооружений, строений и пожарных отсеков в соответствии с Федеральным законом «Технический регламент о требованиях пожарной безопасности» от 22.07.2008 № 123-ФЗ?", "instruction": "Выберите один вариант ответа.", "options": ["класс функциональной пожарной опасности", "площадь пожарного отсека", "пожарная опасность происходящих в зданиях или сооружениях технологических процессов", "степень участия строительных конструкций в развитии пожара", "этажность"], "type": "single", "answer": [4], "source": "Федеральный закон от 22.07.2008 № 123-ФЗ, ст. 87 ч. 1", "quote": "1. Степень огнестойкости зданий, сооружений и пожарных отсеков должна устанавливаться в зависимости от их этажности, класса функциональной пожарной опасности, площади пожарного отсека и пожарной опасности происходящих в них технологических процессов.", "url": "https://www.consultant.ru/document/cons_doc_LAW_78699/fe6f2e75d44b06464b0f0475d61eba4f72f58ba7/", "explanation": "Закон называет четыре фактора: этажность, класс функциональной пожарной опасности, площадь пожарного отсека и пожарную опасность техпроцессов. «Степень участия конструкций в развитии пожара» — признак класса конструктивной пожарной опасности, а не фактор выбора степени огнестойкости.", "confidence": "high", "note": ""}, {"id": 20, "text": "Какой уровень или какая отметка из нижеперечисленных являются планировочной отметкой земли?", "instruction": "", "options": ["отметка глубины котлована", "средняя планировочная отметка земли на участке застройки", "уровень земли на границе отмостки здания", "уровень земли на границе с фундаментом здания", "уровень подошвы фундамента"], "type": "single", "answer": [3], "source": "СП 54.13330.2022, п. 3.1.22 (ранее СП 54.13330.2011, приложение Б, п. 2.8)", "quote": "3.1.22 отметка уровня земли планировочная: Геодезическая отметка уровня поверхности земли на границе с отмосткой здания. (СП 54.13330.2011: «Уровень земли на границе земли и отмостки здания»)", "url": "https://fkr-spb.ru/upload/iblock/e62/7vxc9o7pegu5vnd1xegbtxzg4ffdhry5.pdf", "explanation": "Планировочная отметка земли — уровень земли у границы отмостки здания. От неё отсчитывают, например, подземные и цокольные этажи.", "confidence": "high", "note": ""}, {"id": 21, "text": "При какой высоте и общей площади квартир на этаже в жилых зданиях секционного типа следует предусматривать выход лестничную клетку типа H1?", "instruction": "Выберите один вариант ответа.", "options": ["высота более 12 м и общая площадь до 500 м2", "высота более 25 м и общая площадь до 300 м2", "высота более 25 м и общая площадь до 500 м2", "высота более 28 м и общая площадь до 500 м2", "высота более 28 м и общая площадь до 700 м2"], "type": "single", "answer": [4], "source": "СП 1.13130.2009, пп. 4.4.12, 5.4.2, 5.4.8; действующий СП 1.13130.2020, пп. 4.4.18, 6.1.1", "quote": "4.4.12 В зданиях высотой более 28 м... следует предусматривать незадымляемые лестничные клетки, как правило, типа Н1. 5.4.2 Не менее двух эвакуационных выходов должны иметь этаж здания при общей площади квартир на этаже, а для зданий секционного типа — на этаже секции — более 500 м2", "url": "https://meganorm.ru/Data2/1/4293830/4293830689.pdf", "explanation": "Секция жилого дома с площадью квартир на этаже до 500 м² может иметь одну лестничную клетку. Если здание выше 28 м, эта лестница должна быть незадымляемой типа Н1.", "confidence": "medium", "note": "Одного пункта с дословно такой формулировкой нет: ответ складывается из порога высоты 28 м (тип Н1) и порога площади 500 м² (одна лестница на секцию). Те же числа (более 28 м, до 500 м², Н1) есть в п. 5.4.8 СП 1.13130.2009 / п. 7.2.6 СП 54.13330.2011, но там речь о зданиях коридорного (галерейного) типа. В действующем СП 1.13130.2020 (п. 6.1.1) при 500–550 м² тоже допускается один выход, а п. 6.1.3 позволяет вместо Н1 лестничную клетку Н2."}, {"id": 22, "text": "Какой орган выдает допуск к работам, которые оказывают влияние на безопасность объектов капитального строительства (в соответствии с Градостроительным кодексом Российской Федерации)?", "instruction": "Выберите один вариант ответа.", "options": ["Администрация населенного пункта", "Министерство строительства и жилищно-коммунального хозяйства Российской Федерации", "Органы экспертизы", "Отделение Союза архитекторов России", "Саморегулируемая организация строителей"], "type": "single", "answer": [5], "source": "Градостроительный кодекс РФ, ст. 55.8 ч. 1 (редакция до 01.07.2017)", "quote": "...индивидуальный предприниматель или юридическое лицо вправе выполнять работы, которые оказывают влияние на безопасность объектов капитального строительства, при наличии выданного саморегулируемой организацией свидетельства о допуске к таким работам.", "url": "https://rulaws.ru/amp/acts/Pismo-Minregiona-Rossii-ot-29.12.2011-N-36265-DSh_08/", "explanation": "Допуск к работам, влияющим на безопасность объектов, выдавала саморегулируемая организация (СРО). Госорганы, экспертиза и Союз архитекторов его не выдавали.", "confidence": "medium", "note": "Вопрос по старой редакции ГрК. С 01.07.2017 (372-ФЗ от 03.07.2016) свидетельства о допуске отменены: теперь право выполнять такие работы даёт само членство в СРО (ст. 55.8 ч. 1 действующей редакции). Ответ «СРО» остаётся единственным подходящим. Цитата старой редакции взята из письма Минрегиона от 29.12.2011 № 36265-ДШ/08."}, {"id": 23, "text": "Что обозначают кружки с нумерацией на приведенных плане и поперечных разрезах здания?", "instruction": "Выберите один вариант ответа.", "options": ["нумерацию узлов", "обозначение строительных изделий", "позиции (марки) элементов конструкций", "схему компоновки чертежей на листах", "схему последовательности выполнения чертежей"], "type": "single", "image": "q23.png", "answer": [1], "source": "ГОСТ Р 21.101-2020, пп. 5.5.3–5.5.4 (ранее ГОСТ Р 21.1101-2013, пп. 5.5.3–5.5.4)", "quote": "5.5.4 На изображении (плане, фасаде или разрезе), откуда выносят узел, соответствующее место отмечают замкнутой сплошной тонкой линией (окружностью, овалом или прямоугольником со скругленными углами) с нанесением на полке линии-выноски обозначения узла арабской цифрой...", "url": "https://meganorm.ru/Data2/1/4293720/4293720404.htm", "explanation": "Окружность на плане или разрезе с номером на полке линии-выноски — обозначение места выносного элемента (узла). На рисунке показана схема расположения узлов 1–19.", "confidence": "high", "note": ""}, {"id": 24, "text": "Какой законодательный акт из нижеперечисленных обеспечивает на обязательной основе соблюдение требований Федерального закона «Технический регламент о безопасности зданий и сооружений»?", "instruction": "Выберите один вариант ответа.", "options": ["Градостроительный кодекс Российской Федерации от 29.12.2004 № 190-ФЗ (ред. от 24.04.2020)", "Кодекс Российской Федерации об административных правонарушениях от 30.12.2001 № 195-ФЗ (ред. от 24.04.2020)", "Постановление Правительства Российской Федерации от 16.02.2008 № 87 (ред. от 28.04.2020) «О составе разделов проектной документации и требованиях к их содержанию»", "Постановление Правительства Российской Федерации от 26.12.2014 № 1521 «Об утверждении перечня национальных стандартов и сводов правил (частей таких стандартов и сводов правил)»", "Стандарт ИСО 9000-1-94.А 1"], "type": "single", "answer": [4], "source": "Постановление Правительства РФ от 26.12.2014 № 1521 (название); 384-ФЗ, ст. 6 (ред. до 653-ФЗ)", "quote": "«Об утверждении перечня национальных стандартов и сводов правил (частей таких стандартов и сводов правил), в результате применения которых на обязательной основе обеспечивается соблюдение требований Федерального закона «Технический регламент о безопасности зданий и сооружений»»", "url": "https://www.consultant.ru/document/cons_doc_LAW_95720/cb3b9a501034c3917ed4b116fc729b3d8daca56c/", "explanation": "Перечень стандартов и СП, применение которых обязательно для соблюдения 384-ФЗ, утверждало постановление Правительства № 1521. Вопрос почти дословно повторяет его название.", "confidence": "medium", "note": "ПП № 1521 утратило силу: его заменило ПП № 985 от 04.07.2020, затем ПП № 815 от 28.05.2021. Кроме того, ст. 6 384-ФЗ изложена в новой редакции (653-ФЗ от 25.12.2023): обязательные требования теперь применяются через реестр по градостроительному законодательству. Постановление — не «законодательный акт», это неточность вопроса."}, {"id": 25, "text": "Укажите годы возникновения архитектурного стиля конструктивизм", "instruction": "", "options": ["с конца 1970-х годов", "1890-е – 1910-е годы", "1920-е годы – начало 1930-х годов", "с конца 1980-х годов", "1950-е – 1970-е годы"], "type": "single", "answer": [3], "source": "Большая советская энциклопедия, статья «Конструктивизм»; С. О. Хан-Магомедов, «Архитектура советского авангарда»", "quote": "Конструктивизм, направление в советском искусстве 1920-х гг. (в архитектуре, оформительском и театрально-декорационном искусствах...). Первая организация конструктивистов... возникла в Инхуке в 1921. ...ОСА... журнал «Современная архитектура» (1926—30).", "url": "https://www.booksite.ru/fulltext/1/001/008/064/045.htm", "explanation": "Конструктивизм — советское архитектурное направление 1920-х — начала 1930-х годов (братья Веснины, М. Гинзбург, ОСА). В 1930-х его сменил неоклассицизм («сталинский ампир»).", "confidence": "high", "note": ""}, {"id": 26, "text": "Что обозначает указанный фрагмент чертежа в соответствии с ГОСТ Р 21.1101-2013 Система проектной документации для строительства (СПДС). Основные требования к проектной и рабочей документации (с Поправкой)?", "instruction": "Выберите один вариант ответа.", "options": ["замечание экспертизы по указанной обводкой части чертежа", "изменение обведенной части чертежа", "исправление ошибки в обведенной части чертежа", "несоответствие фрагмента плана требованиям заказчика", "разработка детализации обведенной части чертежа"], "type": "single", "image": "q26.png", "answer": [2], "source": "ГОСТ Р 21.1101-2013, п. 7.3.10, 7.3.12, 7.3.14 (рис. 16); действующий ГОСТ Р 21.101-2020, прил. М, п. М.2", "quote": "7.3.10 При изменении изображения (части изображения) его обводят сплошной тонкой линией, образующей замкнутый контур, и крестообразно перечеркивают сплошными тонкими линиями в соответствии с рисунком 16.", "url": "https://meganorm.ru/Data2/1/4293777/4293777893.htm", "explanation": "Часть чертежа, обведённая замкнутым контуром и перечёркнутая крест-накрест, с номером изменения в параллелограмме (3.6) и ссылкой «См. лист 15» — это обозначение изменения этой части чертежа; новое изображение размещено на листе 15.", "confidence": "high", "note": "В ГОСТ Р 21.101-2020 (заменил 21.1101-2013) правило то же (прил. М, п. М.2–М.4)."}, {"id": 27, "text": "Кто из должностных лиц утверждает разрешение на внесение изменений в проектную документацию в соответствии с ГОСТ Р 21.1101-2013 Система проектной документации для строительства (СПДС). Основные требования к проектной и рабочей документации (с Поправкой)?", "instruction": "Выберите один вариант ответа.", "options": ["генеральный проектировщик", "заказчик или его представитель", "орган негосударственной и государственной экспертизы", "руководитель организации-разработчика документа или другое уполномоченное руководителем должностное лицо", "согласующие органы исполнительной власти"], "type": "single", "answer": [4], "source": "ГОСТ Р 21.1101-2013, п. 7.2.2; ГОСТ Р 21.101-2020, п. 7.2.2", "quote": "7.2.2 Разрешение утверждает руководитель организации - разработчика документа или другое уполномоченное им должностное лицо.", "url": "https://meganorm.ru/Data2/1/4293777/4293777893.htm", "explanation": "Разрешение на внесение изменений утверждает руководитель организации, которая разработала документ, или уполномоченное им лицо; заказчик и экспертиза его не утверждают.", "confidence": "high", "note": "В действующем ГОСТ Р 21.101-2020 формулировка п. 7.2.2 та же."}, {"id": 28, "text": "Что является предметом контроля авторского надзора (в соответствии с СП 246.1325800.2016 Положение об авторском надзоре за строительством зданий и сооружений)?", "instruction": "Выберите один вариант ответа.", "options": ["соблюдение в процессе строительства требований проектной документации и подготовленной на ее основе рабочей документации", "соблюдение в ходе строительства графика выполнения работ", "соблюдение в ходе строительства качества скрытых работ, которые влияют на безопасность и (или) долговечность объекта капитального строительства", "соблюдение требований безопасности проведения строительно-монтажных работ", "соблюдение требований экологической безопасности на строительной площадке"], "type": "single", "answer": [1], "source": "СП 246.1325800.2016, п. 3.1; действующий СП 246.1325800.2023, п. 3.1, 4.1", "quote": "3.1 авторский надзор: Контроль лица, осуществившего подготовку проектной документации, за соблюдением в процессе строительства требований проектной документации и подготовленной на её основе рабочей документации.", "url": "https://meganorm.ru/Data2/1/4293755/4293755715.htm", "explanation": "Авторский надзор проверяет, соблюдаются ли при строительстве требования проектной и рабочей документации. График, техника безопасности и экология — это не его предмет.", "confidence": "high", "note": "СП 246.1325800.2016 заменён СП 246.1325800.2023 (с 10.02.2024). Там п. 4.1: «Предметом авторского надзора является соблюдение ... требований утвержденной проектной документации» — рабочая документация не упомянута, но ответ тот же."}, {"id": 29, "text": "Кто из должностных лиц принимает решение о целесообразности (нецелесообразности) устранения «малозначительного дефекта» (в соответствии с СП 246.1325800.2016 Положение об авторском надзоре за строительством зданий и сооружений)?", "instruction": "Выберите один вариант ответа.", "options": ["главный архитектор", "заказчик", "застройщик", "исполнитель", "руководитель рабочей группы"], "type": "single", "answer": [2], "source": "СП 246.1325800.2016, п. 7.2, перечисление е); определение — п. 3.12", "quote": "Малозначительный дефект - решение о целесообразности (нецелесообразности) его устранения принимает заказчик на основании оценки затрат на его устранение.", "url": "https://meganorm.ru/Data2/1/4293755/4293755715.htm", "explanation": "По СП 246.1325800.2016 критический дефект устраняют с остановкой работ, значительный — до начала следующих работ, а устранять ли малозначительный, решает заказчик, оценив затраты.", "confidence": "medium", "note": "Вопрос ссылается на СП 246.1325800.2016, ответ по нему однозначный. В действующем СП 246.1325800.2023 (с 10.02.2024) деления дефектов на критические, значительные и малозначительные и этого правила уже нет."}, {"id": 30, "text": "Каковы максимальные значения продольного и поперечного уклонов путей движения для проезда инвалидов на креслах-колясках в соответствии с требованиями СП 59.13330.2012 Свод правил. Доступность зданий и сооружений для маломобильных групп населения. Актуализированная редакция СНиП 35-01-2001?", "instruction": "Выберите один вариант ответа.", "options": ["продольный уклон 2% и поперечный 5%", "продольный уклон 5% и поперечный 2%", "продольный уклон 8% и поперечный 2%", "продольный уклон 8% и поперечный 5%", "продольный уклон 12% и поперечный 5%", "продольный уклон 12% и поперечный 8%"], "type": "single", "answer": [2], "source": "СП 59.13330.2012, п. 4.1.7; действующий СП 59.13330.2020, п. 5.1.7", "quote": "Продольный уклон путей движения, по которому возможен проезд инвалидов на креслах-колясках, не должен превышать 5 %, поперечный - 2 %.", "url": "https://meganorm.ru/Data2/1/4293797/4293797484.htm", "explanation": "По СП 59.13330.2012 на пути, где проезжают кресла-коляски, продольный уклон — не больше 5 %, поперечный — не больше 2 %.", "confidence": "high", "note": "В СП 59.13330.2020 п. 5.1.7 нормы уточнены: продольный уклон не более 1:20 (5 %), а в климатических районах I и II — не более 4 % (1:25); поперечный — от 0,5 до 2 %. Верхние пределы 5 % и 2 % остались прежними. В СП 59.13330.2020 п. 5.1.7 уточнено: продольный уклон не более 5% (1:20), а в климатических районах I и II — не более 4% (1:25); поперечный — от 0,5 до 2%. Задание дублирует № 30."}, {"id": 31, "text": "Какое оборудование необходимо установить в здании для обеспечения доступа инвалидов на креслах-колясках на этажи выше или ниже этажа основного входа в здание (первого этажа)?", "instruction": "Выберите 3 правильных варианта ответа.", "options": ["аппарели", "пассажирский конвейер", "пассажирский лифт", "подъемная платформа", "траволатор", "эскалатор", "лестницеходы"], "type": "multi", "count": 3, "answer": [3, 4, 7], "source": "СП 59.13330.2012, п. 5.2.17 (лифты и подъёмные платформы); СП 136.13330.2012, п. 9.1 и рис. В.34 (мобильные лестничные подъёмники: ступенькоход, гусеничный подъёмник)", "quote": "5.2.17 Здания следует оборудовать пассажирскими лифтами или подъемными платформами для обеспечения доступа инвалидов на креслах-колясках на этажи выше или ниже этажа основного входа в здание (первого этажа).", "url": "https://meganorm.ru/Data2/1/4293797/4293797484.htm", "explanation": "Норма прямо называет пассажирские лифты и подъёмные платформы. Третий ответ — лестницеходы: это мобильные устройства, которые поднимают и спускают человека на кресле-коляске по лестнице. Эскалаторы и траволаторы (пассажирские конвейеры) для колясок не предназначены.", "confidence": "low", "note": "СП 59 называет только два вида оборудования: лифт и подъёмную платформу (так же в СНиП 35-01-2001, п. 3.34, СП 59.13330.2016, п. 6.2.13, и СП 59.13330.2020, п. 6.2.13). Третий ответ выбран по логике. «Пассажирский конвейер» и «траволатор» — одно и то же, поэтому вряд ли кто-то из них правильный. «Аппарели» — второй возможный вариант: по СП 59.13330.2012 (прил. Б, Б.2) аппарель — накладная конструкция на марш для проезда коляски. Но это конструкция, а не оборудование, и с СП 59.13330.2016 их запрещено применять для инвалидов вместо пандусов. Термина «лестницеход» в СП 59 нет."}, {"id": 32, "text": "На какие здания и сооружения не распространяются требования СП 59.13330.2012 Свод правил. Доступность зданий и сооружений для маломобильных групп населения. Актуализированная редакция СНиП 35-01-2001?", "instruction": "Выберите один вариант ответа.", "options": ["жилые многоэтажные здания", "жилые одноквартирные дома", "общественные здания", "объекты транспортной инфраструктуры", "производственные здания", "реконструируемые здания"], "type": "single", "answer": [2], "source": "СП 59.13330.2012, п. 1.4; действующий СП 59.13330.2020, п. 1.3", "quote": "1.4 Требования нормативного документа не распространяются на проектирование жилых одноквартирных домов.", "url": "https://meganorm.ru/Data2/1/4293797/4293797484.htm", "explanation": "Требования доступности для маломобильных групп по СП 59.13330.2012 не распространяются на жилые одноквартирные дома. Многоквартирные, общественные, производственные и реконструируемые здания под них подпадают.", "confidence": "high", "note": "В СП 59.13330.2016 и 2020 уточнено: «жилых одноквартирных домов, находящихся в частной собственности»."}, {"id": 33, "text": "Какой выход является эвакуационным?", "instruction": "Выберите один вариант ответа.", "options": ["ворота для железнодорожного подвижного состава", "выход, в проеме которого установлены турникеты", "выход, в проеме которого установлены вращающиеся двери", "выход, в проеме которого установлены подъемно-опускные двери или ворота", "выход, в проеме которого установлены распашные двери", "выход, в проеме которого установлены раздвижные двери или ворота"], "type": "single", "answer": [5], "source": "СП 1.13130.2020, п. 4.2.3", "quote": "4.2.3 Выходы не являются эвакуационными, если в их проемах установлены: раздвижные двери и ворота...; подъемно-опускные двери и ворота...; ...ворота для железнодорожного подвижного состава и автомобильного транспорта; вращающиеся двери; турникеты...", "url": "https://meganorm.ru/Data2/1/4293722/4293722520.htm", "explanation": "Выходы с раздвижными, подъёмно-опускными и вращающимися дверями, турникетами и воротами для поездов эвакуационными не считаются. Остаётся выход с обычными распашными дверями.", "confidence": "high", "note": ""}, {"id": 34, "text": "Для каких зданий регламентируется продолжительность инсоляции?", "instruction": "Выберите три правильных варианта ответа.", "options": ["библиотеки", "детские дошкольные учреждения", "жилые здания", "музейно-выставочные комплексы", "предприятия торговли", "санаторно-оздоровительные и курортные учреждения", "физкультурно-оздоровительные центры"], "type": "multi", "count": 3, "answer": [2, 3, 6], "source": "СанПиН 2.2.1/2.1.1.1076-01, п. 2.3", "quote": "Продолжительность инсоляции регламентируется в: - жилых зданиях; - детских дошкольных учреждениях; - учебных учреждениях...; - лечебно-профилактических, санаторно-оздоровительных и курортных учреждениях; - учреждениях социального обеспечения...", "url": "https://meganorm.ru/Data2/1/4294846/4294846958.htm", "explanation": "Продолжительность инсоляции нормируется для жилья, детских садов, школ, больниц, санаториев и учреждений соцобеспечения. Для музеев, библиотек, магазинов и фитнес-центров она не нормируется. Выставочные залы музеев и книгохранилища, наоборот, прямо названы помещениями, где инсоляция не требуется.", "confidence": "high", "note": "СанПиН 2.2.1/2.1.1.1076-01 утратил силу 01.03.2021. Сейчас нормы инсоляции — в СанПиН 1.2.3685-21, раздел V (табл. 5.59 — общественные здания, табл. 5.60 — территории). Полный текст действующих таблиц сверить не удалось."}, {"id": 35, "text": "Какими мероприятиями невозможно обеспечить выполнение требований по достаточной продолжительности инсоляции в целях создания безопасных условий проживания независимо от его срока?", "instruction": "Выберите один вариант ответа.", "options": ["благоустройством прилегающей территории", "грамотной установкой инженерного оборудования в здании", "мерами конструктивного характера", "мерами планировочного характера", "ориентацией помещений по сторонам света"], "type": "single", "answer": [2], "source": "Федеральный закон № 384-ФЗ, ст. 22, ч. 1–2", "quote": "2. Выполнение требований, предусмотренных частью 1 настоящей статьи, должно быть обеспечено мерами по ориентации жилых помещений по сторонам света, а также мерами конструктивного и планировочного характера, в том числе по благоустройству прилегающей территории.", "url": "https://www.consultant.ru/document/cons_doc_LAW_95720/b8d103c4f19bdb0439f7a3a6f412b882758b4bdf/", "explanation": "Закон перечисляет способы обеспечить инсоляцию: ориентацию по сторонам света, конструктивные и планировочные меры, благоустройство территории. Инженерного оборудования в этом списке нет — солнце им не заменишь.", "confidence": "high", "note": ""}, {"id": 36, "text": "Какой документ ведется при осуществлении авторского надзора за строительством зданий и сооружений?", "instruction": "Выберите один вариант ответа.", "options": ["акт приемки работ", "ведомость авторского надзора", "журнал авторского надзора", "журнал выполненных работ", "сводная таблица авторского надзора"], "type": "single", "answer": [3], "source": "СП 246.1325800.2016, п. 6.5 (форма — прил. Е); действующий СП 246.1325800.2023, п. 5.1 д), 6.11 (форма — прил. Б)", "quote": "6.5 При осуществление авторского надзора за строительством зданий и сооружений ведётся журнал авторского надзора по формам, приведенным в приложении Е.", "url": "https://meganorm.ru/Data2/1/4293755/4293755715.htm", "explanation": "Результаты авторского надзора — найденные нарушения и их устранение — записывают в журнал авторского надзора.", "confidence": "high", "note": "В СП 246.1325800.2023 требование то же: п. 6.11 «При осуществлении авторского надзора ведется журнал авторского надзора по форме, приведенной в приложении Б»."}, {"id": 37, "text": "Какие бывают большепролетные здания и сооружения по функциональному назначению и эксплуатационным условиям?", "instruction": "Выберите пять вариантов правильных ответов).", "options": ["жилые комплексы", "зрелищные здания", "многофункциональные здания", "рынки", "спортивные здания и сооружения", "торговые комплексы"], "type": "multi", "count": 5, "answer": [2, 3, 4, 5, 6], "source": "СП 304.1325800.2017, п. 4.1", "quote": "4.1 Гражданские большепролетные здания и сооружения по функциональному назначению и эксплуатационным условиям подразделяют: на административные; общественные; торговые комплексы; зрелищные здания; спортивные здания и сооружения; рынки; ...; многофункциональные здания.", "url": "https://meganorm.ru/Data2/1/4293741/4293741086.htm", "explanation": "СП 304.1325800.2017 относит к большепролётным зданиям зрелищные, спортивные, торговые комплексы, рынки и многофункциональные здания. Жилых комплексов в этом перечне нет.", "confidence": "high", "note": "В инструкции «выберите пять вариантов правильных ответов)» лишняя скобка. Формулировка вопроса дословно совпадает с п. 4.1 СП."}, {"id": 38, "text": "Значения каких характеристик ограждающих конструкций и принятых конструктивных решений не определяются в проектной документации здания или сооружения для создания благоприятных санитарно-гигиенических условий в помещениях?", "instruction": "Выберите два правильных варианта ответа.", "options": ["разность температуры на внутренней и наружной поверхностях ограждения", "разность температуры на внутренней поверхности ограждающих строительных конструкций и температуры воздуха внутри здания или сооружения во время отопительного периода", "сопротивление воздухопроницанию ограждающих строительных конструкций", "сопротивление паропроницанию ограждающих строительных конструкций", "сопротивление теплопередаче междуэтажного перекрытия", "сопротивление теплопередаче ограждающих строительных конструкций здания или сооружения", "теплоусвоение поверхности полов", "теплоустойчивость ограждающих строительных конструкций в теплый период года и помещений здания или сооружения в холодный период года"], "type": "multi", "count": 2, "answer": [1, 5], "source": "Федеральный закон № 384-ФЗ, ст. 29, ч. 1", "quote": "...должны быть определены значения характеристик ограждающих конструкций...: 1) сопротивление теплопередаче...; 2) разность температуры на внутренней поверхности... и температуры воздуха внутри...; 3) теплоустойчивость...; 4) ...; 5) ...; 6) теплоусвоение поверхности полов.", "url": "https://www.consultant.ru/document/cons_doc_LAW_95720/185452822dbcdc88ad2546e3553fec202008b01d/", "explanation": "Закон перечисляет шесть характеристик, которые надо определить в проекте. Разности температур внутренней и наружной поверхностей и сопротивления теплопередаче междуэтажного перекрытия среди них нет.", "confidence": "high", "note": ""}, {"id": 39, "text": "В зависимости от каких характеристик здания, сооружения или пожарного отсека устанавливается степень огнестойкости здания, сооружения или пожарного отсека?", "instruction": "Выберите четыре правильных варианта ответа.", "options": ["класс функциональной пожарной опасности", "количество пожарных отсеков", "этажность", "конструктивное решение здания", "материал ограждающих конструкций", "площадь пожарного отсека", "пожарная опасность происходящих в помещениях технологических процессов"], "type": "multi", "count": 4, "answer": [1, 3, 6, 7], "source": "Федеральный закон № 123-ФЗ, ст. 87, ч. 1", "quote": "1. Степень огнестойкости зданий, сооружений и пожарных отсеков должна устанавливаться в зависимости от их этажности, класса функциональной пожарной опасности, площади пожарного отсека и пожарной опасности происходящих в них технологических процессов.", "url": "https://www.consultant.ru/document/cons_doc_LAW_78699/fe6f2e75d44b06464b0f0475d61eba4f72f58ba7/", "explanation": "Степень огнестойкости зависит от четырёх факторов: этажности, класса функциональной пожарной опасности, площади пожарного отсека и пожарной опасности технологических процессов.", "confidence": "high", "note": ""}, {"id": 40, "text": "Какие характеристики определяют функциональные качества зданий, обеспечивающие их нормальную эксплуатацию?", "instruction": "Выберите пять правильных варианта ответа.", "options": ["жесткость здания", "надежность здания", "оборудование", "организация внутреннего пространства", "параметры микроклимата в помещении", "пожарная безопасность", "световой режим", "условия видимости"], "type": "multi", "count": 5, "answer": [3, 4, 5, 7, 8], "source": "Учебник: Тишков В.А., Рыскулова М.Н. «Архитектура. Общий курс». — Н. Новгород: ННГАСУ, 2010, п. 2.1.1 «Факторы, от которых зависит качество жизненной среды»", "quote": "Качество среды зависит от ряда факторов... пространство, необходимое для деятельности человека, размещения оборудования...; состояние воздушной среды (микроклимат)...; звуковой режим...; световой режим...; инсоляция...; видимость и зрительное восприятие...", "url": "https://bibl.nngasu.ru/electronicresources/uch-metod/architecture/4842.pdf", "explanation": "Функциональные качества здания — это то, насколько удобно в нём выполнять своё дело: устройство внутреннего пространства, оборудование, микроклимат, освещённость и видимость. Жёсткость, надёжность и пожарная безопасность — технические качества, а не функциональные.", "confidence": "low", "note": "Нормы на этот вопрос нет — это учебниковый вопрос. Точную фразу «функциональные качества зданий, обеспечивающие их нормальную эксплуатацию» найти не удалось. Ответ опирается на деление требований к зданию на функциональные и технические (надёжность, прочность, огнестойкость) и на перечень факторов среды в учебнике ННГАСУ. Нормы нет, точного первоисточника формулировки «функциональные качества..., обеспечивающие нормальную эксплуатацию» найти не удалось. Ответ по разделению функциональных и технических требований в учебнике ННГАСУ. Там пожарные требования названы «техническими (и отчасти функциональными)». Если составитель считает пожарную безопасность функциональной, спорным становится вариант 3 «оборудование»."}, {"id": 41, "text": "Какие возможности должны обеспечивать средства программного обеспечения, реализующие просмотр информационной модели?", "instruction": "Выберите два правильных варианта ответа.", "options": ["применение цветовой идентификации элементов и групп элементов по функциональному значению", "изменение геометрических параметров", "внесение замечаний и комментарий", "обеспечение совместного доступа к информационной модели", "просмотр истории изменений 3D графики информационной модели"], "type": "multi", "count": 2, "answer": [1, 2], "source": "СП 333.1325800.2020, п. 4.4", "quote": "4.4 Средства программного обеспечения, реализующие просмотр ЦИМ, должны обеспечивать возможность применения цветовой идентификации элементов и групп элементов по функциональному назначению, а также возможность измерения геометрических параметров.", "url": "https://meganorm.ru/mega_doc/norm/pravila/0/sp_333_1325800_2020_svod_pravil_informatsionnoe.html", "explanation": "Программа для просмотра информационной модели по СП 333 должна уметь раскрашивать элементы по назначению и измерять геометрические параметры (длины, размеры).", "confidence": "medium", "note": "В задании вариант 2 звучит как «изменение геометрических параметров», а в норме — «измерение». Почти наверняка это опечатка составителя: в варианте 1 тоже неточность — «по функциональному значению» вместо «назначению». Требования про замечания и комментарии в п. 4.4 нет. В СП 333.1325800.2017 этого пункта нет совсем."}, {"id": 42, "text": "Для каких видов помещений в разделе проектной документации «Объемно-планировочные и архитектурные решения» объектов капитального строительства производственного и непроизводственного назначения приводится описание решений по отделке?", "instruction": "Выберите четыре варианта правильных ответов", "options": ["основного назначения.", "вспомогательного назначения.", "обслуживающего назначения.", "технического назначения.", "специального назначения."], "type": "multi", "count": 4, "answer": [1, 2, 3, 4], "source": "Положение о составе разделов проектной документации (Постановление Правительства РФ № 87), п. 13, подп. «г»", "quote": "г) описание и обоснование решений по отделке помещений основного, вспомогательного, обслуживающего и технического назначения;", "url": "https://sudact.ru/law/postanovlenie-pravitelstva-rf-ot-16022008-n-87/", "explanation": "В разделе «Объемно-планировочные и архитектурные решения» описывают отделку помещений основного, вспомогательного, обслуживающего и технического назначения. Помещений «специального назначения» в этом перечне нет.", "confidence": "high", "note": ""}, {"id": 43, "text": "На восприятие каких нагрузок не рассчитываются конструкции здания?", "instruction": "Выберите один вариант ответа.", "options": ["ветровых нагрузок для данного района строительства", "временных равномерно распределенных и сосредоточенных нагрузок на перекрытия", "постоянных нагрузок от собственного веса несущих конструкций", "постоянных нагрузок от собственного веса ограждающих конструкций", "снеговых нагрузок для данного района строительства", "температурных деформаций"], "type": "single", "answer": [6], "source": "СНиП 31-01-2003 «Здания жилые многоквартирные», п. 6.2; ср. действующий СП 54.13330.2022, п. 6.1.3", "quote": "6.2 Конструкции и основания здания должны быть рассчитаны на восприятие постоянных нагрузок от собственного веса несущих и ограждающих конструкций; временных равномерно распределенных и сосредоточенных нагрузок на перекрытия; снеговых и ветровых нагрузок для данного района строительства.", "url": "https://meganorm.ru/Data2/1/4294844/4294844888.htm", "explanation": "Конструкции рассчитывают на постоянные нагрузки (собственный вес несущих и ограждающих конструкций), временные нагрузки на перекрытия, снеговые и ветровые нагрузки. Температурные деформации в этом перечне нагрузок не названы.", "confidence": "medium", "note": "Вопрос построен на перечне из СНиП 31-01-2003, п. 6.2. В действующем СП 54.13330.2022, п. 6.1.3, в перечень добавлены «кратковременные снеговые, ветровые и температурные климатические нагрузки». 384-ФЗ, ст. 16, ч. 3, тоже требует учитывать климатические воздействия и усилия от деформаций. Так что с точки зрения инженера вопрос спорный, но составитель ждёт ответ «температурных деформаций»."}, {"id": 44, "text": "Какой вертикальный размер соответствует термину «высота здания»?", "instruction": "Выберите два правильных варианта ответа.", "options": ["вертикальный размер, измеряемый от проектной отметки земли до верхней отметки парапета или карниза кровли", "вертикальный размер, измеряемый от проектной отметки земли до верхней отметки антенны, установленной на крыше", "вертикальный размер, измеряемый от проектной отметки земли до верхней отметки кровли здания", "вертикальный размер, измеряемый от проектной отметки земли до верхней отметки чердачного перекрытия", "вертикальный размер, измеряемый от проектной отметки земли до верхней отметки конька кровли, верха фронтона; купола; шпиля; башни", "вертикальный размер, измеряемый от проектной отметки земли до нижней отметки карниза здания"], "type": "multi", "count": 2, "answer": [1, 5], "source": "СП 118.13330.2012, п. 3.5; действующий СП 118.13330.2022, прил. А, п. А.12", "quote": "3.5 высота здания: Вертикальный размер, измеряемый от проектной отметки земли до верхней отметки самого высокого конструктивного элемента здания (парапет кровли; карниз, конек кровли, верх фронтона; купол; шпиль; башня).", "url": "https://meganorm.ru/mega_doc/norm/perechen/2/sp_118_13330_2012_svod_pravil_obshchestvennye_zdaniya_i.html", "explanation": "Высоту здания меряют от проектной отметки земли до верха самого высокого конструктивного элемента: парапета или карниза, конька, фронтона, купола, шпиля, башни. Антенны на крыше не учитывают.", "confidence": "high", "note": "В норме это одно определение, составитель разбил его на два варианта (1 и 5). В СП 118.13330.2022 (прил. А, п. А.12) оно сохранено как «высота общественного здания (архитектурная)»."}, {"id": 45, "text": "Какой уклон маршей лестниц назначается в надземных этажах общественных зданий, предназначенных для посетителей?", "instruction": "Выберите один вариант ответа.", "options": ["1:1", "1:1,5", "1:2", "2:1", "2:1,5"], "type": "single", "answer": [3], "source": "СП 118.13330.2022, п. 5.8; СП 1.13130.2020, п. 7.1.1", "quote": "5.8 Уклон маршей следует принимать: - для лестниц, предназначенных для посетителей, в надземных этажах - 1:2;", "url": "https://meganorm.ru/mega_doc/norm/perechen/0/sp_118_13330_2022_svod_pravil_obshchestvennye_zdaniya_i.html", "explanation": "В общественных зданиях лестницы для посетителей в надземных этажах делают с уклоном 1:2. Уклон 1:1,5 допускается для подвалов, чердаков и лестниц не для посетителей.", "confidence": "high", "note": ""}, {"id": 46, "text": "Какое требование не предъявляется к тепловой оболочке здания в соответствии с СП 50.13330.2012 Тепловая защита зданий. Актуализированная редакция СНиП 23-02-2003?", "instruction": "Выберите один вариант ответа.", "options": ["требование к влажностному состоянию ограждающих конструкций", "требование к недопущению конденсации влаги на внутренней поверхности ограждающих конструкций в холодный период года", "требование к недопущению конденсации влаги на внутренней поверхности светопрозрачного заполнения (стеклопакетов, стекла) с вертикальным остеклением в холодный период года", "требование к ограничению минимальной температуры на внутренней поверхности ограждающих конструкций в холодный период года", "требование к приведенному сопротивлению теплопередаче ограждающих конструкций здания", "требование к удельной теплозащитной характеристике здания"], "type": "single", "answer": [3], "source": "СП 50.13330.2012 (с Изм. № 1), п. 4.2; действующий СП 50.13330.2024, п. 4.2", "quote": "...ограничению минимальной температуры и недопущению конденсации влаги на внутренней поверхности ограждающих конструкций в холодный период года, за исключением светопрозрачного заполнения (стеклопакетов, стекла) с вертикальным остеклением (с углом наклона заполнений к горизонту 45° и более);", "url": "https://meganorm.ru/mega_doc/norm/metodika/1/sp_50_13330_2012_svod_pravil_teplovaya_zashchita_zdaniy.html", "explanation": "Требование не допускать конденсат на внутренней поверхности прямо не распространяется на стеклопакеты и стекло с вертикальным остеклением. Остальные требования из вариантов в своде правил есть.", "confidence": "high", "note": "Исключение для вертикального остекления в такой формулировке введено Изменением № 1 (2018) к СП 50.13330.2012. В действующем СП 50.13330.2024, п. 4.2, текст тот же."}, {"id": 47, "text": "Установите последовательность комплектации проектной документации для строительства, включаемой в том в соответствии с ГОСТ Р 21.1101—2013 «Система проектной документации. Основные требования к проектной и рабочей документации».", "instruction": "Ответ запишите в порядке комплектации текстовых и графических мат
