  const exam = t.kind === "exam";
  const nav = `<div class="small muted">${exam ? `Режим: ${MODE_NAME[t.mode]}${t.mode === "end" ? " (как на экзамене)" : ""}` : "Все задания подряд · ответ сразу"}</div>
    <details class="navp" ${S.navOpen ? "open" : ""}><summary>${exam ? "Все задания теста" : "Перейти к заданию"}</summary><div class="grid">${t.ids.map((x, i) => `<button class="${qStatus(t, x)} ${i === t.cur ? "cur" : ""}" data-go="${i}" aria-label="Задание ${i + 1}">${exam ? i + 1 : byId[x].id}</button>`).join("")}</div></details>
    <button class="btn ghost full mt" id="finish2">${exam ? "Завершить тест" : "Показать итог"}</button>`;
  $("app").innerHTML = `<div class="card">${body}</div><div class="card">${nav}</div>`;

  // кнопки внизу
  const last = t.cur === N - 1;
  const needCheck = t.mode === "instant" && !locked;
  let main;
  if (needCheck) main = `<button class="btn" id="check" ${isAnswered(q, v) ? "" : "disabled"}>Ответить</button>`;
  else if (last) main = `<button class="btn" id="finish">${exam ? "Завершить тест" : "Показать итог"}</button>`;
  else main = `<button class="btn" id="next">Дальше</button>`;
  setBar(`<button class="btn ghost nav" id="prev" ${t.cur === 0 ? "disabled" : ""} aria-label="Предыдущее задание">←</button>${main}<button class="btn ghost nav" id="skip" ${last ? "disabled" : ""} aria-label="Следующее задание">→</button>`);

  if (scroll === "top") window.scrollTo(0, 0);
  else if (scroll === "fb"){
    const fb = document.querySelector(".fb");
    if (fb) window.scrollTo({top: Math.max(0, fb.getBoundingClientRect().top + window.scrollY - 140), behavior: "smooth"});
  } else window.scrollTo(0, y);

  // обработчики
  const setV = nv => { t.ans[id] = nv; save(); };
  document.querySelectorAll(".opt[data-n]").forEach(b => b.onclick = () => {
    const n = +b.dataset.n;
    if (q.type === "single"){ setV([n]); showQ("keep"); return; }
    let sel = (t.ans[id] || []).slice();
    if (q.type === "multi"){
      if (sel.includes(n)) sel = sel.filter(x => x !== n);
      else if (q.count !== "many" && sel.length >= q.count){
        const c = $("counter");
        if (c){ c.textContent = `Уже выбрано ${q.count} — сначала снимите лишний вариант`; c.classList.add("alert"); }
        return;
      } else sel.push(n);
    } else {
      const p = sel.indexOf(n);
      if (p >= 0) sel.splice(p); else sel.push(n);
    }
    setV(sel); showQ("keep");
  });
  bindZoom($("app"));
  document.querySelectorAll("select[data-k]").forEach(s => s.onchange = () => {
    const sel = Object.assign({}, t.ans[id] || {}); if (s.value) sel[s.dataset.k] = s.value; else delete sel[s.dataset.k];
    setV(sel);
    const c = $("check"); if (c) c.disabled = !isAnswered(q, sel);
    const cn = $("counter"); if (cn) cn.textContent = `Заполнено ${Object.keys(sel).length} из ${q.left.length}`;
    document.querySelectorAll(".grid button")[t.cur].className = qStatus(t, id) + " cur";
  });
  const oi = $("openIn");
  if (oi){
    oi.oninput = () => { setV(oi.value); const c = $("check"); if (c) c.disabled = !isAnswered(q, oi.value); };
    oi.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); const c = $("check") || $("next") || $("finish"); if (c && !c.disabled) c.click(); } };
  }
  if ($("selfOk")) $("selfOk").onclick = () => { setSelf(t, id, true); showQ("keep"); };
  if ($("selfUndo")) $("selfUndo").onclick = () => { setSelf(t, id, false); showQ("keep"); };
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { t.cur = +b.dataset.go; save(); showQ("top"); });
  document.querySelector("details.navp").ontoggle = e => { S.navOpen = e.target.open; save(); };
  const go = d => { t.cur = Math.max(0, Math.min(N - 1, t.cur + d)); save(); showQ("top"); };
  $("prev").onclick = () => go(-1);
  $("skip").onclick = () => go(1);
  if ($("next")) $("next").onclick = () => go(1);
  if ($("check")) $("check").onclick = () => { t.chk[id] = true; recordOnce(t, id); save(); showQ("fb"); };
  if ($("finish")) $("finish").onclick = finish;
  $("finish2").onclick = finish;
}

function footnote(q){
  if (!q.source) return "";
  return `<div class="fn"><div class="fh">Источник</div><div class="fd">${esc(q.source)}${q.url ? ` · <a href="${esc(q.url)}" target="_blank" rel="noopener">текст нормы ↗</a>` : ""}</div>${q.quote ? `<div class="fq">«${esc(q.quote)}»</div>` : ""}</div>`;
}
const warnHtml = q => q.confidence && q.confidence !== "high" ? `<div class="warn">⚠ Ответ спорный${q.note ? ": " + esc(q.note) : ""}</div>` : "";

// правильный ответ списком (для разбора и банка)
function rightAnswerHtml(q){
  if (q.type === "open") return `<ul class="ans"><li class="r">${esc(q.answer[0])}</li>${q.answer.length > 1 ? `<li class="small muted">Тоже засчитывается: ${esc(q.answer.slice(1).join("; "))}</li>` : ""}</ul>`;
  if (q.type === "match") return `<ul class="ans">${q.left.map((l, i) => { const L = q.answer[i + 1]; return `<li class="r">${i + 1}) ${esc(l.length > 90 ? l.slice(0, 88) + "…" : l)} → ${L}) ${esc(q.right[LET.indexOf(L)] || "")}</li>`; }).join("")}</ul>`;
  if (q.type === "sequence") return `<ul class="ans">${q.answer.map((n, i) => `<li class="r">${i + 1}. ${esc(q.options[n - 1])}</li>`).join("")}</ul>`;
  if (q.option_images) return `<div class="optgrid">${q.options.map((o, i) => `<div class="opt optimg ${q.answer.includes(i + 1) ? "ok" : ""}"><img src="${IMG[q.option_images[i]]}" alt="" data-zoom="${q.option_images[i]}" style="cursor:zoom-in"><span class="cap">${esc(o)}${q.answer.includes(i + 1) ? " ✓" : ""}</span></div>`).join("")}</div>`;
  return (q.accept_any ? `<div class="small muted" style="margin-top:6px">Засчитывается любой из отмеченных вариантов</div>` : "") + `<ul class="ans">${q.options.map((o, i) => `<li class="${q.answer.includes(i + 1) ? "r" : ""}">${i + 1}) ${esc(o)}</li>`).join("")}</ul>`;
}

// блок «Верно/Неверно» после ответа; live — с кнопками самопроверки открытого ответа
function feedback(q, v, selfOk, live, revId){
  const ok = isCorrect(q, v, selfOk), self = q.type === "open" && selfOk && !isCorrect(q, v, false);
  let right;
  if (q.type === "open") right = `<b>${esc(q.answer[0])}</b>${q.answer.length > 1 ? `<div class="small">Тоже засчитывается: ${esc(q.answer.slice(1).join("; "))}</div>` : ""}`;
  else if (q.type === "match") right = `<ul class="ans">${q.left.map((_, i) => `<li>${i + 1} – ${q.answer[i + 1]}) ${esc(q.right[LET.indexOf(q.answer[i + 1])] || "")}</li>`).join("")}</ul>`;
  else if (q.type === "sequence") right = `<ul class="ans">${q.answer.map((n, i) => `<li>${i + 1}. ${esc(q.options[n - 1])}</li>`).join("")}</ul>`;
  else right = `<ul class="ans">${q.answer.map(n => `<li>${q.option_images ? "Рисунок " + n : n + ") " + esc(q.options[n - 1])}</li>`).join("")}</ul>`;
  const label = q.accept_any ? "Засчитывается любой из вариантов" : (q.type === "sequence" ? "Правильный порядок" : "Правильный ответ");
  let h = `<div class="fb ${ok ? "ok" : "bad"}"><div class="h">${self ? "Засчитано вами" : (ok ? "Верно" : (isAnswered(q, v) ? "Неверно" : "Без ответа"))}</div>`;
  if (!ok || self || q.type !== "single" || q.accept_any) h += `<div><b>${label}:</b> ${right}</div>`;
  if (q.explanation) h += `<div style="margin-top:6px">${esc(q.explanation)}</div>`;
  h += footnote(q) + warnHtml(q);
  if (q.type === "open" && isAnswered(q, v) && !isCorrect(q, v, false)){
    if (live) h += self ? `<div class="selfok">Ваш ответ засчитан как верный. <button class="linkbtn" id="selfUndo">Отменить</button></div>` : `<button class="btn sec full mt" id="selfOk">Мой ответ тоже верный — засчитать</button>`;
    else h += self ? `<div class="selfok">Ваш ответ засчитан как верный. <button class="linkbtn" data-undo="${revId}">Отменить</button></div>` : `<button class="btn sec full mt" data-self="${revId}">Мой ответ тоже верный — засчитать</button>`;
  }
  return h + `</div>`;
}

function finish(){
  const t = cur();
  const left = t.ids.filter(id => !isAnswered(byId[id], t.ans[id])).length;
  if (left && !confirm(`Без ответа осталось заданий: ${left}. ${t.kind === "all" ? "Показать итог?" : "Завершить тест?"}`)) return;
  stopTimer();
  t.done = true; t.finished = Date.now();
  t.ids.forEach(id => { if (isAnswered(byId[id], t.ans[id])) recordOnce(t, id); });  // без ответа — вопрос ещё вернётся
  const score = t.ids.filter(id => isCorrect(byId[id], t.ans[id], t.self[id])).length;
  if (t.kind === "exam") S.history = (S.history || []).concat([{at: t.finished, score}]).slice(-30);
  save(); results();
}

// ---------- результат ----------
function results(filter){
  screen = () => results(filter);
  enter();
  stopTimer();
  const t = cur(), N = t.ids.length, exam = t.kind !== "all";
  const res = t.ids.map((id, i) => {
    const q = byId[id], v = t.ans[id];
    return {i, id, q, st: isCorrect(q, v, t.self[id]) ? "ok" : (isAnswered(q, v) ? "bad" : "skip")};
  });
  const score = res.filter(r => r.st === "ok").length, nBad = res.filter(r => r.st === "bad").length, nSkip = res.filter(r => r.st === "skip").length;
  filter = filter || (nBad ? "bad" : (nSkip ? "skip" : "all"));
  const pass = score >= (exam ? PASS : Math.ceil(N * .75));
  const mins = Math.round((t.elapsed || 0) / 60000);
  $("title").textContent = exam ? "Результат теста" : "Итог: все задания"; $("homeBtn").hidden = false; $("prog").style.width = "100%";
  const list = res.filter(r => filter === "all" || r.st === filter);
  const mark = {ok: "✓", bad: "✗", skip: "–"};
  $("app").innerHTML = `
  <div class="card score">
    <div class="big" style="color:${pass ? "var(--ok)" : "var(--bad)"}">${score} из ${N}</div>
    ${exam ? `<div class="verdict ${pass ? "ok" : "bad"}">${pass ? "Сдал" : "Не сдал"}</div>
    <p class="muted small">Порог — ${PASS} баллов (75&nbsp;%). Балл ставится только за полностью верный ответ.${t.mode === "end" ? ` Время: ${mins}&nbsp;мин из ${MINUTES}.` : ""}</p>`
    : `<p class="muted small">Верно ${Math.round(score / N * 100)}&nbsp;% заданий банка. На экзамене нужно 75&nbsp;%.</p>`}
  </div>
  <div class="card">
    <h2>Разбор</h2>
    <div class="tabs">
      <button data-f="bad" class="${filter === "bad" ? "on" : ""}">Ошибки: ${nBad}</button>
      ${nSkip ? `<button data-f="skip" class="${filter === "skip" ? "on" : ""}">Без ответа: ${nSkip}</button>` : ""}
      <button data-f="all" class="${filter === "all" ? "on" : ""}">Все: ${N}</button>
    </div>
    <div>${list.length ? list.map(r => `
      <div class="rev"><button class="hd" data-open="${r.id}" aria-expanded="false"><span class="st ${r.st}">${mark[r.st]}</span><span class="tx"><b>${exam ? r.i + 1 + "." : ""}</b> <span class="pv">${esc(r.q.text.length > 120 ? r.q.text.slice(0, 118) + "…" : r.q.text)}</span> <span class="muted small">(№&nbsp;${r.q.id})</span></span><span class="arr">▾</span></button>
      <div class="body" id="rb${r.id}" hidden>
        <div class="row"><b>Вопрос:</b> ${esc(r.q.text)}</div>
        ${r.q.image ? imgBlock(r.q.image) : ""}
        <div class="row"><b>Ваш ответ:</b> ${esc(answerText(r.q, t.ans[r.id]))}</div>
        ${feedback(r.q, t.ans[r.id], t.self[r.id], false, r.id)}
      </div></div>`).join("") : `<p class="muted">${filter === "bad" ? "Ошибок нет." : "Пусто."}</p>`}</div>
  </div>
  <button class="btn full" id="again">${exam ? "Новый тест" : "Пройти все задания заново"}</button>`;
  setBar("");
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => results(b.dataset.f));
  document.querySelectorAll("[data-open]").forEach(h => h.onclick = () => {
    const b = $("rb" + h.dataset.open), open = b.hidden;
    b.hidden = !open; h.setAttribute("aria-expanded", open);
    h.querySelector(".arr").textContent = open ? "▴" : "▾";
    h.querySelector(".pv").style.display = open ? "none" : "";
  });
  bindZoom($("app"));
  document.querySelectorAll("[data-self]").forEach(b => b.onclick = () => { setSelf(t, +b.dataset.self, true); results(filter); });
  document.querySelectorAll("[data-undo]").forEach(b => b.onclick = () => { setSelf(t, +b.dataset.undo, false); results(filter); });
  $("again").onclick = () => { if (exam) S.t = newExam(); else S.all = newAll(); save(); showQ("top"); };
  window.scrollTo(0, 0);
}

// ---------- банк ответов ----------
// поиск по началу слов без окончаний: «инсоляция» находит «инсоляции»
const stem = w => w.length >= 6 ? w.slice(0, -2) : (w.length >= 4 ? w.slice(0, -1) : w);
const words = s => " " + norm(s).replace(/[^а-яa-z0-9]+/g, " ") + " ";
const HAY = {}; BANK.forEach(q => HAY[q.id] = words([q.text, ...(q.options || []), ...(q.left || []), ...(q.right || []), ...(q.type === "open" ? q.answer : [])].join(" ")));

function bankView(){
  screen = bankView;
  enter();
  stopTimer(); setBar("");
  $("homeBtn").hidden = false; $("prog").style.width = "0";
  $("title").textContent = "Банк ответов";
  let f = "all", query = "";
  const kinds = [["all", "Все"], ["disp", `Спорные (${N_DISP})`], ["choice", "Выбор"], ["sequence", "Порядок"], ["match", "Соответствие"], ["open", "Открытые"]];
  $("app").innerHTML = `
  <div class="search"><input id="bs" type="search" placeholder="Слово из вопроса или номер, например: инсоляц" autocomplete="off" enterkeyhint="search"></div>
  <div class="chips" id="chips"></div>
  <div class="card" id="blist"></div>`;
  const draw = () => {
    $("chips").innerHTML = kinds.map(([k, n]) => `<button data-bf="${k}" class="${f === k ? "on" : ""}">${n}</button>`).join("");
    document.querySelectorAll("[data-bf]").forEach(b => b.onclick = () => { f = b.dataset.bf; draw(); });
    const raw = query.trim(), num = /^№?\s*\d+$/.test(raw) ? +raw.replace(/\D/g, "") : null;
    const qw = num == null ? norm(raw).replace(/[^а-яa-z0-9]+/g, " ").split(" ").filter(Boolean).map(stem) : [];
    const list = BANK.filter(q => {
      if (f === "disp" && q.confidence === "high") return false;
      if (["choice", "sequence", "match", "open"].includes(f) && kindOf(q) !== f) return false;
      if (num != null) return q.id === num;
      return qw.every(w => HAY[q.id].includes(" " + w));
    });
    $("blist").innerHTML = `<div class="small muted" style="margin-bottom:6px">Найдено: ${list.length} из ${BANK.length}</div>` + (list.map(q => `
      <div class="bq" id="bq${q.id}">
        <div class="qmeta"><span>№&nbsp;${q.id}</span><span>${TYPE_NAME[q.type]}</span></div>
        <p class="qtext">${esc(q.text)}</p>
        ${q.image ? imgBlock(q.image) : ""}
        ${q.type === "match" ? `<div class="rlist">${q.right.map((r, i) => `<div><b>${LET[i]})</b> ${esc(r)}</div>`).join("")}</div>` : ""}
        ${rightAnswerHtml(q)}
        ${q.explanation ? `<div class="expl">${esc(q.explanation)}</div>` : ""}
        ${footnote(q)}
        ${warnHtml(q)}
      </div>`).join("") || `<p class="muted">Ничего не найдено.</p><button class="btn sec full" id="bReset">Сбросить поиск и фильтр</button>`);
    bindZoom($("blist"));
    if ($("bReset")) $("bReset").onclick = () => { f = "all"; query = ""; $("bs").value = ""; draw(); };
  };
  draw();
  $("bs").oninput = e => { query = e.target.value; draw(); };
  window.scrollTo(0, 0);
}

// ---------- помощь ----------
function helpView(){

  enter();
  stopTimer(); setBar("");

  $("title").textContent = "Помощь";
  $("app").innerHTML = `
  <div class="card help">
    <h2>Что это</h2>

        <ul>

    <p>Пометка <b>«⚠ Ответ спорный»</b> значит, что норму поменяли после того, как писали вопрос, что вопрос сформулирован неоднозначно или что ответ взят из учебника, а не из нормы. Такие ответы лучше перепроверить. Полный список — на странице <a href="review.html">«Спорные ответы»</a>.</p>

    <h2>Без интернета и на главном экране</h2>

  </div>
  <button class="btn full" id="helpBack">Вернуться</button>`;

  window.scrollTo(0, 0);
}

$("helpBtn").onclick = () => { if ($("title").textContent !== "Помощь") helpView(); };
$("homeBtn").onclick = () => home();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(); });
home();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
