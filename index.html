"], "type": "single", "answer": [1], "source": "Градостроительный кодекс РФ, ст. 57.3, ч. 3, п. 15", "quote": "«15) о возможности подключения (технологического присоединения) объектов капитального строительства к сетям инженерно-технического обеспечения (за исключением сетей электроснабжения), определяемая с учетом программ комплексного развития систем коммунальной инфраструктуры...»", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/fb76ce1fdb5356574b298a9dcdafcfc8fc6c937b/", "explanation": "Информацию о возможности подключения к сетям (кроме электросетей) с учётом программ развития коммунальной инфраструктуры указывают в градостроительном плане земельного участка (ГПЗУ).", "confidence": "high", "note": ""}, {"id": 101, "text": "В каких из перечисленных документах содержится информация о красных линиях?", "instruction": "Выберите два варианта правильных ответов", "options": ["градостроительный план земельного участка.", "проект планировки территории.", "правила землепользования и застройки.", "проект межевания территории.", "градостроительный регламент"], "type": "multi", "count": 2, "answer": [1, 2], "source": "Градостроительный кодекс РФ, ст. 57.3 ч. 3 п. 17; ст. 42 ч. 3 п. 1 «а»; ст. 43 ч. 6 п. 2", "quote": "В градостроительном плане земельного участка содержится информация: … 17) о красных линиях (ст. 57.3). Основная часть проекта планировки территории включает в себя: 1) чертеж или чертежи планировки территории, на которых отображаются: а) красные линии (ст. 42)", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/fb76ce1fdb5356574b298a9dcdafcfc8fc6c937b/", "explanation": "Красные линии устанавливаются в проекте планировки территории, а градостроительный план участка обязательно содержит информацию о них. В правилах землепользования и застройки и в градостроительном регламенте красных линий нет.", "confidence": "low", "note": "По ГрК красные линии содержатся сразу в трёх документах из списка: ГПЗУ (ст. 57.3 ч. 3 п. 17), проект планировки (ст. 42 ч. 3 п. 1 «а») и проект межевания (ст. 43 ч. 6 п. 2: «красные линии, утвержденные в составе проекта планировки территории, или … утверждаемые, изменяемые проектом межевания»). Нужно выбрать два, поэтому ответ угадан по логике составителя: формулировка «содержится информация» взята из ст. 57.3 о ГПЗУ (как и в заданиях 102–103), а основной документ, где устанавливают красные линии, — проект планировки. Вариант «ГПЗУ + проект межевания» или «проект планировки + проект межевания» тоже может оказаться в ключе."}, {"id": 102, "text": "В каких из перечисленных документах содержится информация о видах разрешенного использования земельного участка?", "instruction": "Выберите три варианта правильных ответов", "options": ["правила землепользования и застройки.", "градостроительный план земельного участка.", "проект межевания территории.", "разрешение на строительство.", "технические условия"], "type": "multi", "count": 3, "answer": [1, 2, 3], "source": "Градостроительный кодекс РФ, ст. 30 ч. 2 и ч. 6 п. 1; ст. 57.3 ч. 3 п. 5; ст. 43 ч. 5 п. 3", "quote": "В градостроительном регламенте … указываются: 1) виды разрешенного использования (ст. 30); в ГПЗУ содержится информация: 5) об основных, условно разрешенных и вспомогательных видах разрешенного использования (ст. 57.3); проект межевания: 3) виды разрешенного использования земельных участков (ст. 43)", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/fb76ce1fdb5356574b298a9dcdafcfc8fc6c937b/", "explanation": "Виды разрешенного использования устанавливает градостроительный регламент в составе правил землепользования и застройки. Их переносят в градостроительный план участка, а для образуемых участков указывают в проекте межевания. В разрешении на строительство и технических условиях таких сведений нет.", "confidence": "high", "note": "Проверено по форме разрешения на строительство (приказ Минстроя от 03.06.2022 № 446/пр): там указаны только реквизиты ГПЗУ, ППТ и ПМТ, а самих видов разрешенного использования нет."}, {"id": 103, "text": "В каких из перечисленных документов содержится информация о предельных параметрах разрешенного строительства?", "instruction": "Выберите три варианта правильных ответов", "options": ["правила землепользования и застройки.", "градостроительный план земельного участка.", "проект межевания территории.", "проект планировки территории.", "разрешение на строительство", "задание на проектирование"], "type": "multi", "count": 3, "answer": [1, 2, 4], "source": "Градостроительный кодекс РФ, ст. 30 ч. 6 п. 2; ст. 57.3 ч. 3 п. 6; ст. 42 ч. 3 п. 2", "quote": "В градостроительном регламенте … указываются: … 2) … предельные параметры разрешенного строительства (ст. 30). Проект планировки: 2) положение о характеристиках планируемого развития территории, в том числе о плотности и параметрах застройки территории", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/7b81874f50ed9cd03230f753e5c5a4b03ef9092d/", "explanation": "Предельные параметры устанавливает градостроительный регламент в составе правил землепользования и застройки, и они переносятся в градостроительный план участка. В проекте планировки территории приводятся плотность и параметры застройки в этих пределах.", "confidence": "medium", "note": "ПЗЗ и ГПЗУ бесспорны (ст. 30 ч. 6, ст. 57.3 ч. 3 п. 6). Третий ответ, проект планировки, выбран потому, что ст. 42 говорит о «плотности и параметрах застройки», хотя слов «предельные параметры разрешенного строительства» там нет. В проекте межевания, разрешении на строительство (форма 446/пр) и задании на проектирование предельных параметров нет."}, {"id": 104, "text": "Укажите минимальную ширину маршей лестниц, ведущих на жилые этажи в многоквартирных секционных трёх-и более этажных жилых зданиях:", "instruction": "", "options": ["0,9", "1,0", "1,05", "1,15", "1,35"], "type": "single", "answer": [3], "source": "СП 54.13330.2022, п. 6.4.2, таблица 6.1 (ранее СП 54.13330.2016, табл. 8.1)", "quote": "Марши лестниц, ведущие на жилые этажи многоквартирных жилых зданий: - секционных двухэтажных | 1,05 | 1:1,5 | - секционных трех- и более этажных | 1,05 | 1:1,75 | - коридорных, галерейных | 1,2", "url": "https://meganorm.ru/mega_doc/norm/nomenklatura/0/sp_54_13330_2022_svod_pravil_zdaniya_zhilye_mnogokvartirnye.html", "explanation": "По таблице 6.1 СП 54.13330.2022 минимальная ширина марша лестницы на жилые этажи секционного дома в три этажа и выше — 1,05 м.", "confidence": "high", "note": "Задание дублирует № 69."}, {"id": 105, "text": "Какие структурные части зданий относятся к ограждающим?", "instruction": "Выберите 1 вариант ответа", "options": ["крыши, окна, двери, световые фонари", "перемычки, пилястры", "полы, перегородки, парапеты", "стены, перекрытия, покрытия, кровли", "фундаменты, столбы"], "type": "single", "answer": [4], "source": "Большая советская энциклопедия, ст. «Ограждающие конструкции» (З. А. Казбек-Казиев); учебная классификация конструктивных элементов зданий", "quote": "Ограждающие конструкции зданий и сооружений, строительные конструкции (стены, перекрытия, покрытия, заполнения проёмов, перегородки и т.д.), ограничивающие объём здания (сооружения) и разделяющие его на отдельные помещения.", "url": "https://booksite.ru/fulltext/1/001/008/083/646.htm", "explanation": "Ограждающие конструкции отделяют помещения от внешней среды и друг от друга. Классический перечень — стены, перекрытия, покрытия и кровли. Фундаменты, столбы, перемычки и пилястры относятся к несущим элементам.", "confidence": "medium", "note": "Ответ учебный, нормы с таким перечнем нет. Окна, двери и фонари из варианта 1 по БСЭ тоже ограждающие («заполнения проёмов»), но в варианте 1 есть «крыши», у которых есть несущая часть. Вариант 4 точнее всего совпадает с классическим перечнем «стены, перекрытия, покрытия»."}, {"id": 106, "text": "Площади каких помещений не включаются в полезную площадь общественного здания?", "instruction": "Выберите два варианта правильных ответов", "options": ["лестничных клеток", "коридоров", "тамбуров", "лифтовых шахт", "помещений, предназначенных для размещения инженерного оборудования"], "type": "multi", "count": 2, "answer": [1, 4], "source": "СП 118.13330.2022, приложение А, п. А.5", "quote": "Полезная площадь общественного здания определяется как сумма площадей всех размещаемых в нем помещений, а также балконов и антресолей в залах, фойе и т. п., за исключением лестничных клеток, лифтовых шахт, внутренних открытых лестниц и пандусов, шахт, пространств для инженерных коммуникаций.", "url": "https://tiflocentre.ru/download/sp-118-13330-2022.pdf", "explanation": "В полезную площадь общественного здания не включают лестничные клетки и лифтовые шахты. Коридоры, тамбуры и помещения инженерного оборудования не входят в расчётную площадь (п. А.6), но в полезную площадь включаются.", "confidence": "high", "note": ""}, {"id": 107, "text": "На каких объектах должны предусматриваться мероприятия по защите от шума?", "instruction": "Выберите четыре варианта правильных ответов", "options": ["в сооружениях гражданской обороны.", "в зрительных залах театров, кинотеатров, дворцов культуры.", "на рабочих местах промышленных предприятий.", "в помещениях жилых и общественных зданий.", "на территории жилой застройки."], "type": "multi", "count": 4, "answer": [2, 3, 4, 5], "source": "СП 51.13330.2011 «Защита от шума», п. 4.3 «а»–«г» (ранее СНиП 23-03-2003, п. 4.1–4.2)", "quote": "…мероприятия по защите от шума должны предусматривать: а) на рабочих местах промышленных предприятий … б) в помещениях жилых и общественных зданий … в) на территории жилой застройки … г) в помещениях, требующих акустического благоустройства … (аудитории, зрительные залы театров, кинотеатров…)", "url": "https://meganorm.ru/mega_doc/norm/pravila/0/sp_51_13330_2011_svod_pravil_zashchita_ot_shuma.html", "explanation": "В п. 4.3 СП 51.13330 перечислены четыре группы объектов, где обязательна защита от шума: рабочие места предприятий, помещения жилых и общественных зданий, жилая застройка и зрительные залы. Сооружений гражданской обороны в этом списке нет.", "confidence": "high", "note": ""}, {"id": 108, "text": "Укажите минимальную ширину проема в жилом здании для проезда пожарной техники:", "instruction": "", "options": ["3,0м", "3,5м", "3,75м", "4,0м", "4,4м"], "type": "single", "answer": [2], "source": "СП 4.13130.2013, п. 8.1.10", "quote": "Сквозные проезды (арки) в зданиях и сооружениях должны быть шириной не менее 3,5 м, высотой не менее 4,5 м и располагаться не более чем через каждые 300 м", "url": "https://meganorm.ru/mega_doc/norm/metodika/0/sp_4_13130_2013_svod_pravil_sistemy_protivopozharnoy.html", "explanation": "Сквозной проезд (арка) в здании для пожарных машин должен иметь ширину не менее 3,5 м и высоту не менее 4,5 м.", "confidence": "high", "note": "СП 54.13330.2022 (п. 4.8) отсылает за этими параметрами к СП 4.13130."}, {"id": 109, "text": "Какое из нижеперечисленных обозначений марок рабочих чертежей, используется при объединении рабочих чертежей генерального плана и сооружений транспорта?", "instruction": "", "options": ["ГП", "ГТ", "ПТ", "ТП"], "type": "single", "answer": [2], "source": "ГОСТ Р 21.101-2020, приложение Г, таблица Г.1 (ранее ГОСТ Р 21.1101-2013, табл. Б.1)", "quote": "Генеральный план и сооружения транспорта | ГТ | При объединении рабочих чертежей генерального плана и сооружений транспорта", "url": "https://meganorm.ru/Data2/1/4293720/4293720404.htm", "explanation": "Когда чертежи генерального плана и сооружений транспорта объединяют в один основной комплект, ему дают марку ГТ. Марка ГП означает только генеральный план.", "confidence": "high", "note": ""}, {"id": 110, "text": "Какие материалы могут включаться в состав рабочей документации, передаваемой заказчику?", "instruction": "Выберите один вариант правильного ответа", "options": ["пояснительная записка.", "рабочие чертежи.", "прилагаемые документы, разработанные в дополнение к рабочим чертежам основного комплекта.", "сметная документация.", "результаты инженерных изысканий."], "type": "single", "answer": [2, 3], "source": "ГОСТ Р 21.1101-2013, п. 4.2.1; действующий ГОСТ Р 21.101-2020, п. 4.2.1", "quote": "4.2.1 В состав рабочей документации, передаваемой заказчику, включают: - рабочие чертежи, объединенные в основные комплекты рабочих чертежей по маркам…; - прилагаемые документы, разработанные в дополнение к рабочим чертежам основного комплекта. (ГОСТ Р 21.1101-2013)", "url": "https://meganorm.ru/Data2/1/4293720/4293720404.htm", "explanation": "По ГОСТ в рабочую документацию, которую получает заказчик, входят рабочие чертежи и прилагаемые к ним документы. Пояснительная записка и результаты изысканий относятся к проектной документации.", "confidence": "low", "note": "В задании просят один вариант, но по ГОСТ Р 21.1101-2013 п. 4.2.1 в рабочую документацию входят и рабочие чертежи (2), и прилагаемые документы (3); по ГОСТ Р 21.101-2020 ещё и смета (4) при необходимости. Засчитывается 2 или 3. Какой один вариант ждёт составитель, неизвестно (вероятнее 3).", "accept_any": true}, {"id": 111, "text": "Какая из нижеперечисленных марок относится к комплекту рабочих чертежей «Архитектурно-строительные решения»?", "instruction": "", "options": ["ГП", "ТМ", "ГР", "АС", "АИ", "ВК"], "type": "single", "answer": [4], "source": "ГОСТ Р 21.101-2020, приложение Г, таблица Г.1 (ранее ГОСТ Р 21.1101-2013, табл. Б.1)", "quote": "Архитектурно-строительные решения | АС | При объединении рабочих чертежей архитектурных и конструктивных решений (кроме КМ)", "url": "https://meganorm.ru/Data2/1/4293720/4293720404.htm", "explanation": "Марка АС — это архитектурно-строительные решения. Остальные марки означают: ГП — генплан, ТМ — тепломеханические решения, ГР — гидротехнические решения, АИ — интерьеры, ВК — водопровод и канализация.", "confidence": "high", "note": ""}, {"id": 112, "text": "Какой термин характеризуется как «текстовые и графические материалы, отражающие фактическое исполнение проектных решений и фактическое положение объектов капитального строительства и их элементов в процессе строительства, реконструкции, капитального ремонта объектов капитального строительства по мере завершения определенных в проектной документации работ»?", "instruction": "", "options": ["ведомость материалов", "исполнительная документация", "план производства работ", "проектная документация", "рабочая документация"], "type": "single", "answer": [2], "source": "РД-11-02-2006 (приказ Ростехнадзора от 26.12.2006 № 1128), п. 3", "quote": "Исполнительная документация представляет собой текстовые и графические материалы, отражающие фактическое исполнение проектных решений и фактическое положение объектов капитального строительства и их элементов в процессе строительства…", "url": "https://files.stroyinf.ru/Data1/49/49282/", "explanation": "Именно так РД-11-02-2006 определяет исполнительную документацию: она фиксирует, как фактически выполнены проектные решения по мере завершения работ.", "confidence": "high", "note": "С 01.09.2023 РД-11-02-2006 заменён приказом Минстроя от 16.05.2023 № 344/пр. В нём определения нет, но состав исполнительной документации тот же, поэтому на ответ это не влияет."}, {"id": 113, "text": "Дайте определение термину \"основной комплект рабочих чертежей\":", "instruction": "", "options": ["графический документ, содержащий необходимую и достаточную информацию в виде чертежей и схем, предназначенный для производства строительных и монтажных работ определенного вида (марки).", "документация, содержащую материалы в графической форме и определяющую архитектурные, функционально-технологические, конструктивные и инженерно-технические решения для обеспечения строительства, реконструкции объектов капитального строительства, их частей, капитального ремонта.", "документация, содержащая материалы в графической форме, в соответствии с которой осуществляются строительство, реконструкция объекта капитального строительства, их частей.", "графический, содержащий изображение строительного объекта, его частей, сетей инженерно-технического обеспечения.", "графическая часть проектной документации."], "type": "single", "answer": [1], "source": "ГОСТ Р 21.101-2020, п. 3.1.10 (ранее ГОСТ Р 21.1101-2013, п. 3.1.2)", "quote": "основной комплект рабочих чертежей: Графический документ, содержащий необходимую и достаточную информацию в виде чертежей и схем, предназначенный для производства строительных и монтажных работ определенного вида (марки).", "url": "https://meganorm.ru/Data2/1/4293720/4293720404.htm", "explanation": "Вариант 1 дословно совпадает с определением из ГОСТ. Варианты 2 и 3 — это искажённые определения проектной и рабочей документации из Градостроительного кодекса.", "confidence": "high", "note": ""}, {"id": 114, "text": "В соответствии с каким видом документации осуществляются строительство, реконструкция объекта капитального строительства, их частей?", "instruction": "Выберите один вариант правильного ответа", "options": ["проектная.", "рабочая.", "исполнительная.", "проектно-сметная."], "type": "single", "answer": [2], "source": "Градостроительный кодекс РФ, ст. 48 ч. 2.1", "quote": "Рабочая документация представляет собой документацию, содержащую материалы в текстовой и графической формах и (или) в форме информационной модели, в соответствии с которой осуществляются строительство, реконструкция объекта капитального строительства, их частей.", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/b884020ea7453099ba8bc9ca021b84982cadea7d/", "explanation": "По Градостроительному кодексу строят по рабочей документации. Проектная документация определяет основные решения и нужна для экспертизы и разрешения на строительство.", "confidence": "high", "note": ""}, {"id": 115, "text": "В каких случаях не допускается отклонение от предельных параметров разрешенного строительства, реконструкции объектов капитального строительства в части предельного количества этажей, предельной высоты зданий, строений, сооружений и требований к архитектурным решениям объектов капитального строительства?", "instruction": "", "options": ["если объект находится в границах территорий исторических поселений федерального значения.", "если объект находится в границах территорий исторических поселений регионального значения.", "если объект находится общественно-деловой территориальной зоне.", "если объект находится рекреационной территориальной зоне.", "если объект находится зоне специального назначения."], "type": "multi", "count": "many", "answer": [1, 2], "source": "Градостроительный кодекс РФ, ст. 40 ч. 2", "quote": "Отклонение от предельных параметров … в части предельного количества этажей, предельной высоты зданий, строений, сооружений и требований к архитектурным решениям объектов капитального строительства в границах территорий исторических поселений федерального или регионального значения не допускается.", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/91122874bbcf628c0e5c6bceb7fe613ee682fc73/", "explanation": "Отклоняться от предельной этажности, высоты и требований к архитектуре нельзя на территории исторических поселений любого уровня — и федерального, и регионального. Территориальные зоны из других вариантов на это не влияют.", "confidence": "medium", "note": "В задании не сказано, сколько вариантов выбрать. По ст. 40 ч. 2 ГрК верны оба: и федерального, и регионального значения. В тренажёре нужно отметить оба."}, {"id": 116, "text": "Установите последовательность этапов процесса проектирования в соответствии с Градостроительным кодексом Российской Федерации.", "instruction": "Ответ запишите в виде последовательности цифр, соответствующих этапам. Этапы:", "options": ["авторский надзор за строительством", "выполнение инженерных изысканий на площадке строительства", "сбор исходно-разрешительной документации", "разработка рабочей документации", "разработка проектной документации для получения согласований", "экспертиза проектной документации"], "type": "sequence", "answer": [3, 2, 5, 6, 4, 1], "source": "Градостроительный кодекс РФ, ст. 47, ст. 48 ч. 2.1 и ч. 6, ст. 49; СП 246.1325800.2023 (авторский надзор)", "quote": "…обязаны предоставить … 1) градостроительный план земельного участка …; 2) результаты инженерных изысканий… (ст. 48 ч. 6). Рабочая документация разрабатывается на основании проектной документации (ст. 48 ч. 2.1).", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/b884020ea7453099ba8bc9ca021b84982cadea7d/", "explanation": "Порядок такой: сбор исходных данных (ГПЗУ, техусловия), инженерные изыскания, проектная документация, её экспертиза, рабочая документация на основе проектной и в конце авторский надзор во время строительства.", "confidence": "medium", "note": "Порядок логичный и стандартный, но ГрК прямо не нумерует этапы. ГрК (ст. 48 ч. 2.1) разрешает готовить рабочую документацию одновременно с проектной, а ИРД и изыскания на практике частично идут параллельно."}, {"id": 117, "text": "Максимальное расстояние в пределах зданий до уборных, курительных, помещений для обогрева или охлаждения, устройств питьевого водоснабжения от рабочих мест, предназначенных для инвалидов с поражением опорно-двигательного аппарата и нарушением зрения, должно быть, м, не более …", "instruction": "выберите один правильный вариант продолжения фразы", "options": ["50м", "60м", "70м", "80м", "100м"], "type": "single", "answer": [2], "source": "СП 59.13330.2020, п. 9.7 (так же в СП 59.13330.2016, п. 9.7; СП 59.13330.2012, п. 8.5)", "quote": "Расстояние до уборных, курительных, помещений для обогрева или охлаждения, устройств питьевого водоснабжения от рабочих мест, предназначенных для инвалидов с поражением опорно-двигательного аппарата и нарушением зрения, должно быть, м, не более: - в пределах зданий … 60", "url": "https://meganorm.ru/mega_doc/norm/klassifikaciya/0/sp_59_13330_2020_svod_pravil_dostupnost_zdaniy_i_sooruzheniy.html", "explanation": "Внутри здания от рабочего места такого инвалида до уборной и других перечисленных помещений должно быть не больше 60 м. По территории предприятия — не больше 150 м.", "confidence": "high", "note": ""}, {"id": 118, "text": "Какие условия должны обеспечивать проектные решения зданий и сооружений в целях обеспечения доступности зданий и сооружений для инвалидов и других групп населения с ограниченными возможностями передвижения?", "instruction": "Выберите четыре варианта правильных ответов", "options": ["досягаемость мест посещения.", "беспрепятственность перемещения внутри зданий и сооружений.", "безопасность путей движения (эвакуации).", "безопасность мест проживания, мест обслуживания и мест приложения труда.", "высокую скорость перемещения внутри зданий и сооружений.", "возможность соблюдение социальной дистанции не менее 1.5 м при перемещении внутри зданий и сооружений."], "type": "multi", "count": 4, "answer": [1, 2, 3, 4], "source": "СНиП 35-01-2001, п. 1.4; СП 59.13330.2016, п. 4.3 (СП 59.13330.2012, п. 1.5)", "quote": "Проектные решения объектов, доступных для МГН, должны обеспечивать: досягаемость мест целевого посещения и беспрепятственность перемещения внутри зданий и сооружений; безопасность путей движения (в том числе эвакуационных), а также мест проживания, обслуживания и приложения труда", "url": "https://files.stroyinf.ru/Data1/8/8630/index.htm", "explanation": "Норма требует досягаемости мест посещения, беспрепятственного перемещения, безопасности путей движения и эвакуации, а также безопасности мест проживания, обслуживания и работы. Ни «высокой скорости», ни «социальной дистанции» в норме нет.", "confidence": "high", "note": "В действующем СП 59.13330.2020 (п. 4.3) формулировка изменена («доступность с учетом расстояний и параметров путей движения…», «безопасность путей движения, в том числе эвакуационных, мест целевого посещения…»), но по смыслу ответ тот же. Задание дублирует № 122. Повтор задания № 118. В варианте 1 опечатка: «достигаемость» вместо «досягаемость» из нормы."}, {"id": 119, "text": "В каком случае при проектировании и строительстве жилого здания должны быть обеспечены условия для жизнедеятельности маломобильных групп населения?", "instruction": "выберите один вариант правильного ответа", "options": ["в любом случае.", "если размещение квартир для семей с инвалидами в данном жилом здании установлено в задании на проектирование.", "в случае отсутствия лифтов.", "для жилых зданий высотой более 3 этажей.", "если размещение квартир для семей с инвалидами в данном жилом здании установлено в региональных и местных нормах градостроительного проектирования."], "type": "single", "answer": [2], "source": "СП 54.13330.2016, п. 4.3; действующий СП 54.13330.2022, пп. 4.9–4.10", "quote": "При проектировании и строительстве жилого здания должны быть обеспечены условия для жизнедеятельности маломобильных групп населения, доступность участка, здания и квартир для инвалидов … если размещение квартир для семей с инвалидами в данном жилом доме установлено в задании на проектирование.", "url": "https://www.abok.ru/for_spec/norm_doc/norm/sp54.pdf", "explanation": "По СП 54.13330.2016 условия для маломобильных групп в жилом доме обязательны, если в задании на проектирование предусмотрены квартиры для семей с инвалидами. Вариант 2 повторяет норму дословно.", "confidence": "medium", "note": "В действующем СП 54.13330.2022 норма разделена надвое. По п. 4.9 доступность придомовой территории и входной группы для МГН нужна всегда, а по п. 4.10 доступность квартир — только если это установлено в задании на проектирование. По новой редакции можно спорить в пользу варианта 1, но формулировка вопроса взята из старой редакции, и составитель ждёт вариант 2."}, {"id": 120, "text": "Какое устройство рекомендуется применять на путях движения маломобильных групп населения исходя из требований СП 59.13330.2012 «Доступность зданий и сооружений для маломобильных групп населения»?", "instruction": "Выберите один вариант ответа.", "options": ["двери на петлях одностороннего действия с фиксаторами в положениях «открыто» или «закрыто»", "двери с вращающимися полотнами", "двери, обеспечивающие задержку автоматического закрывания дверей", "непрозрачные двери на навесных петлях двустороннего действия", "турникеты"], "type": "single", "answer": [1], "source": "СП 59.13330.2012, п. 5.1.6", "quote": "На путях движения МГН рекомендуется применять двери на петлях одностороннего действия с фиксаторами в положениях \"открыто\" или \"закрыто\". Следует также применять двери, обеспечивающие задержку автоматического закрывания дверей, продолжительностью не менее 5 секунд.", "url": "https://pozhproekt.ru/nsis/TexReg/sp/59_13330_2012.pdf", "explanation": "СП 59.13330.2012 рекомендует ставить на путях МГН двери одностороннего действия с фиксаторами «открыто» и «закрыто». Вращающиеся двери, турникеты и непрозрачные двери двустороннего действия на путях МГН применять нельзя.", "confidence": "medium", "note": "Двери с задержкой автоматического закрывания (вариант 3) в том же пункте тоже упомянуты, но со словом «следует», то есть как требование, а не рекомендация. В вопросе спрашивают именно, что «рекомендуется», поэтому ответ — 1. В действующем СП 59.13330.2020 (п. 6.1.5) рекомендации про двери одностороннего действия нет, зато осталось требование «Следует применять двери, обеспечивающие задержку автоматического закрывания… не менее 5 с»."}, {"id": 121, "text": "Каковы максимальные значения продольного и поперечного уклонов путей движения для проезда инвалидов на креслах-колясках в соответствии с требованиями СП 59.13330.2012 Свод правил. Доступность зданий и сооружений для маломобильных групп населения. Актуализированная редакция СНиП 35-01-2001?", "instruction": "Выберите один вариант ответа.", "options": ["продольный уклон 2% и поперечный 5%", "продольный уклон 5% и поперечный 2%", "продольный уклон 8% и поперечный 2%", "продольный уклон 8% и поперечный 5%", "продольный уклон 12% и поперечный 5%", "продольный уклон 12% и поперечный 8%"], "type": "single", "answer": [2], "source": "СП 59.13330.2012, п. 4.1.7; действующий СП 59.13330.2020, п. 5.1.7", "quote": "Продольный уклон путей движения, по которому возможен проезд инвалидов на креслах-колясках, не должен превышать 5%, поперечный - 2%.", "url": "https://pozhproekt.ru/nsis/TexReg/sp/59_13330_2012.pdf", "explanation": "По СП 59.13330.2012 продольный уклон пути для кресел-колясок — не более 5%, поперечный — не более 2%.", "confidence": "high", "note": "В СП 59.13330.2020 п. 5.1.7 нормы уточнены: продольный уклон не более 1:20 (5 %), а в климатических районах I и II — не более 4 % (1:25); поперечный — от 0,5 до 2 %. Верхние пределы 5 % и 2 % остались прежними. В СП 59.13330.2020 п. 5.1.7 уточнено: продольный уклон не более 5% (1:20), а в климатических районах I и II — не более 4% (1:25); поперечный — от 0,5 до 2%. Задание дублирует № 30."}, {"id": 122, "text": "Какие условия должны обеспечивать проектные решения зданий и сооружений в целях обеспечения доступности зданий и сооружений для инвалидов и других групп населения с ограниченными возможностями передвижения?", "instruction": "Выберите четыре варианта правильного ответа", "options": ["достигаемость мест посещения.", "беспрепятственность перемещения внутри зданий и сооружений.", "безопасность путей движения (эвакуации).", "безопасность мест проживания, мест обслуживания и мест приложения труда.", "высокую скорость перемещения внутри зданий и сооружений.", "возможность соблюдения социальной дистанции не менее 1.5 м при перемещении внутри зданий и сооружений."], "type": "multi", "count": 4, "answer": [1, 2, 3, 4], "source": "СНиП 35-01-2001, п. 1.4; СП 59.13330.2016, п. 4.3 (СП 59.13330.2012, п. 1.5)", "quote": "Проектные решения объектов, доступных для МГН, должны обеспечивать: досягаемость мест целевого посещения и беспрепятственность перемещения внутри зданий и сооружений; безопасность путей движения (в том числе эвакуационных), а также мест проживания, обслуживания и приложения труда", "url": "https://files.stroyinf.ru/Data1/8/8630/index.htm", "explanation": "Норма требует досягаемости мест посещения, беспрепятственного перемещения, безопасности путей движения и эвакуации, а также безопасности мест проживания, обслуживания и работы. Ни «высокой скорости», ни «социальной дистанции» в норме нет.", "confidence": "high", "note": "В действующем СП 59.13330.2020 (п. 4.3) формулировка изменена («доступность с учетом расстояний и параметров путей движения…», «безопасность путей движения, в том числе эвакуационных, мест целевого посещения…»), но по смыслу ответ тот же. Задание дублирует № 122. Повтор задания № 118. В варианте 1 опечатка: «достигаемость» вместо «досягаемость» из нормы."}, {"id": 123, "text": "Какой минимальный размер жилого помещения для инвалида, передвигающегося на кресле-коляске, определен СП 59.13330.2016 «Доступность зданий и сооружений для маломобильных групп населения. Актуализированная редакция СНиП 35-01-2001»?", "instruction": "Выберите один вариант ответа.", "options": ["9 м2", "12 м2", "14 м2", "16 м2", "18 м2"], "type": "single", "answer": [4], "source": "СП 59.13330.2016, п. 7.2.5 (так же СП 59.13330.2020, п. 7.2.5; СП 59.13330.2012, п. 6.2.6)", "quote": "Минимальный размер жилого помещения для инвалида, передвигающегося на кресле-коляске, должен составлять не менее 16 м2.", "url": "https://meganorm.ru/mega_doc/norm/pravila/2/sp_59_13330_2016_svod_pravil_dostupnost_zdaniy_i_sooruzheniy.html", "explanation": "СП 59.13330.2016 прямо устанавливает: жилое помещение для инвалида на кресле-коляске — не менее 16 м².", "confidence": "high", "note": ""}, {"id": 124, "text": "Какая должна быть ширина тротуара (пути движения) на участке при встречном движении инвалидов на креслах-колясках с учетом габаритных размеров кресел-колясок по ГОСТ Р 50602-93 «Кресла-коляски. Максимальные габаритные размеры»?", "instruction": "", "options": ["1,8 м", "2,3.м", "1,0 м", "1,5 м", "2,0 м"], "type": "single", "answer": [1], "source": "СНиП 35-01-2001, п. 3.3; действующий СП 59.13330.2020, п. 5.1.7", "quote": "Ширина пути движения на участке при встречном движении инвалидов на креслах-колясках должна быть не менее 1,8 м с учетом габаритных размеров кресел-колясок по ГОСТ Р 50602. (СНиП 35-01-2001, п. 3.3)", "url": "https://files.stroyinf.ru/Data1/8/8630/index.htm", "explanation": "Формулировка вопроса, вместе со ссылкой на ГОСТ Р 50602, дословно взята из СНиП 35-01-2001, а там ширина пути при встречном движении колясок — не менее 1,8 м.", "confidence": "medium", "note": "Расхождение редакций. Уже в СП 59.13330.2012 (п. 4.1.7), а также в СП 59.13330.2016 и действующем СП 59.13330.2020 (п. 5.1.7) ширина пешеходного пути для встречного движения колясок — не менее 2,0 м (вариант 5). Ответ 1,8 м выбран потому, что текст вопроса дословно совпадает со СНиП 35-01-2001. Если ключ обновляли по действующему СП, верным будет 2,0 м."}, {"id": 125, "text": "Какие возможности должны обеспечивать средства программного обеспечения, реализующие просмотр 3D графика информационной модели?", "instruction": "Выберите 2 варианта правильных ответов", "options": ["применение цветовой идентификации элементов и групп элементов по функциональному назначению.", "измерение геометрических параметров.", "внесение замечания и комментариев.", "обеспечение совместного доступа к 3D графику информационной модели.", "просмотр истории изменений 3D графику информационной модели."], "type": "multi", "count": 2, "answer": [1, 2], "source": "СП 333.1325800.2020, п. 4.4", "quote": "Средства программного обеспечения, реализующие просмотр ЦИМ, должны обеспечивать возможность применения цветовой идентификации элементов и групп элементов по функциональному назначению, а также возможность измерения геометрических параметров.", "url": "https://meganorm.ru/mega_doc/norm/pravila/0/sp_333_1325800_2020_svod_pravil_informatsionnoe.html", "explanation": "СП 333.1325800.2020 требует от программ просмотра информационной модели двух возможностей: цветовой идентификации элементов по назначению и измерения геометрических параметров.", "confidence": "high", "note": "«3D график информационной модели» в вопросе — это цифровая информационная модель (ЦИМ) в терминах СП. Близкое задание — № 41."}, {"id": 126, "text": "Что из перечисленного НЕ входит в жизненный цикл здания или сооружения согласно ФЗ Технический регламент о безопасности зданий и сооружений ?", "instruction": "выберите один вариант правильного ответа", "options": ["технико-экономическое обоснование строительства.", "инженерные изыскания.", "проектирование.", "строительство.", "эксплуатация.", "реконструкция.", "снос здания или сооружения"], "type": "single", "answer": [1], "source": "384-ФЗ «Технический регламент о безопасности зданий и сооружений», ст. 2 ч. 2 п. 5 (в ред. 653-ФЗ от 25.12.2023; в первоначальной редакции — п. 4)", "quote": "жизненный цикл здания или сооружения - период, в течение которого выполняются инженерные изыскания, осуществляются архитектурно-строительное проектирование, строительство (в том числе консервация), эксплуатация (в том числе текущие ремонты), реконструкция, капитальный ремонт, снос...", "url": "https://www.consultant.ru/document/cons_doc_LAW_95720/4ceedc6beeab98acfcffe6b042e41a8319e1c922/", "explanation": "В законе жизненный цикл — это изыскания, проектирование, строительство, эксплуатация, реконструкция, капремонт и снос. Технико-экономического обоснования в этом перечне нет.", "confidence": "high", "note": "В действующей редакции определение стоит в п. 5 (раньше было в п. 4), «проектирование» там названо «архитектурно-строительным проектированием». На ответ это не влияет."}, {"id": 127, "text": "Какое установлено количество времени пребывания людей в помещениях, определяемых как помещения с постоянным пребыванием людей согласно ФЗ Технический регламент о безопасности зданий и сооружений ?", "instruction": "выберите один вариант правильного ответа", "options": ["непрерывно в течение более двух часов.", "непрерывно в течение более четырех часов.", "непрерывно в течение более шести часов.", "непрерывно в течение более восьми часов.", "непрерывно в течение более двенадцати часов."], "type": "single", "answer": [1], "source": "384-ФЗ, ст. 2 ч. 2 п. 15 (в ред. 653-ФЗ; в первоначальной редакции — п. 13)", "quote": "помещение с постоянным пребыванием людей - помещение, в котором предусмотрено пребывание людей непрерывно в течение более двух часов", "url": "https://www.consultant.ru/document/cons_doc_LAW_95720/4ceedc6beeab98acfcffe6b042e41a8319e1c922/", "explanation": "По закону помещение с постоянным пребыванием людей — то, где люди находятся непрерывно более двух часов.", "confidence": "high", "note": ""}, {"id": 128, "text": "Какими мерами обеспечивается выполнение требований к инсоляции и солнцезащиты зданий?", "instruction": "Выберите три варианта правильных ответов)?", "options": ["мерами по ориентации жилых помещений по сторонам света.", "мерами по ориентации вспомогательных помещений по сторонам света.", "мерами конструктивного характера.", "мерами планировочного характера.", "мерами безопасности нахождения в помещении."], "type": "multi", "count": 3, "answer": [1, 3, 4], "source": "384-ФЗ, ст. 22 ч. 2", "quote": "Выполнение требований, предусмотренных частью 1 настоящей статьи, должно быть обеспечено мерами по ориентации жилых помещений по сторонам света, а также мерами конструктивного и планировочного характера, в том числе по благоустройству прилегающей территории.", "url": "https://www.consultant.ru/document/cons_doc_LAW_95720/b8d103c4f19bdb0439f7a3a6f412b882758b4bdf/", "explanation": "Закон называет три вида мер: ориентация жилых помещений по сторонам света, конструктивные меры и планировочные меры. Вспомогательные помещения и «меры безопасности» там не упоминаются.", "confidence": "high", "note": ""}, {"id": 129, "text": "Объектно-ориентированная модель строительного объекта или комплекса строительных объектов, как правило, в трёхмерном виде, с элементами которой связаны данные геометрических, физических и функциональных характеристик строительного объекта называется…", "instruction": "", "options": ["DIM", "ИМ", "CDM", "ADC"], "type": "single", "answer": [2], "source": "СП 333.1325800.2020, п. 3.1.3–3.1.6 (сокращения ИМ / ИМ ОКС, ЦИМ); Градостроительный кодекс РФ, ст. 1 п. 10.3", "quote": "информационная модель объекта капитального строительства: Совокупность взаимосвязанных сведений, документов и материалов об объекте капитального строительства, формируемых в электронном виде... (СП 333.1325800.2020, п. 3.1.3; сокращение — ИМ ОКС)", "url": "https://docs.cntd.ru/document/573514520", "explanation": "Модель объекта, обычно трёхмерная, к элементам которой привязаны геометрические, физические и функциональные данные, — это информационная модель (ИМ). Остальные варианты — не принятые в нормах сокращения.", "confidence": "medium", "note": "Норму с формулировкой из вопроса («объектно-ориентированная модель... как правило, в трёхмерном виде») найти не удалось. В действующих СП и ГрК ИМ определяется иначе: как совокупность сведений, документов и материалов. Трёхмерную модель СП 333.1325800.2020 называет ЦИМ, но такого варианта нет. ИМ — единственный осмысленный вариант, остальные (DIM, CDM, ADC) — отвлекающие."}, {"id": 130, "text": "В каком случае в проектной документации здания допускается устройство на ограждениях лестниц перил, которые прерываются на каждом этаже ?", "instruction": "выберите один вариант правильного ответа", "options": ["не допускается в любом случае.", "допускается в любом случае.", "допускается в случае, если здание является общественным.", "допускается в случае, если здание является жилым.", "допускается в случае, если здание является производственным."], "type": "single", "answer": [1], "source": "СП 59.13330.2020 «Доступность зданий и сооружений для маломобильных групп населения», п. 6.2.11", "quote": "Поручень ограждений с внутренней стороны лестницы должен быть непрерывным по всей ее высоте.", "url": "https://tiflocentre.ru/documents/sp59-13330-2020.php", "explanation": "Поручень с внутренней стороны лестницы должен идти без разрывов по всей высоте лестницы. Поэтому перила, которые прерываются на каждом этаже, не допускаются — ни в жилых, ни в общественных, ни в производственных зданиях.", "confidence": "high", "note": "Требование взято из СП 59 о доступности для МГН (в спецификации задание тоже отнесено к безбарьерной среде). Текст сверен по копии СП 59.13330.2020 с изменениями. Официальная копия — docs.cntd.ru/document/573514524."}, {"id": 131, "text": "Что предлагает использование ТИМ?", "instruction": "Выберите четыре варианта правильных ответов", "options": ["улучшенную визуализацию", "повышение производительности благодаря простому поиску информации", "усиление согласованности строительных документов", "высокую скорость логистики", "упрощение бухгалтерского учета", "снижение транспортных затрат"], "type": "multi", "count": 4, "answer": [1, 2, 3, 4], "source": "Учебный материал Инженерно-строительного института СПбПУ «BIM: эффективное проектирование и строительство» (перечень «BIM предлагает»); нормы на этот вопрос нет", "quote": "BIM предлагает: 1. Улучшенную визуализацию 2. Повышение производительности благодаря простому поиску информации 3. Усиление согласованности строительных документов ... 5. Высокую скорость логистики 6. Снижение затрат", "url": "https://ido.spbstu.ru/print/news/bim_effektivnoe_proektirovanie_i_stroitelstvo.pdf", "explanation": "ТИМ (BIM) даёт лучшую визуализацию, быстрый поиск информации, согласованность документации и ускорение логистики. Бухгалтерия и транспортные расходы к возможностям ТИМ не относятся.", "confidence": "medium", "note": "Вопрос почти дословно взят из перечня СПбПУ (это перевод известного англоязычного списка преимуществ BIM). В источнике сказано «снижение затрат», а в варианте 6 — «снижение транспортных затрат»: слово изменено, значит это отвлекающий вариант. Нормативного источника нет."}, {"id": 132, "text": "В каких из перечисленных документах содержится информация о границах публичных сервитутов?", "instruction": "Выберите два варианта правильных ответов", "options": ["градостроительный план земельного участка.", "проект планировки территории.", "правила землепользования и застройки.", "проект межевания территории.", "градостроительный регламент."], "type": "multi", "count": 2, "answer": [1, 4], "source": "Градостроительный кодекс РФ, ст. 57.3 ч. 3 п. 11 (ГПЗУ); ст. 43 ч. 6 п. 5 (проект межевания территории)", "quote": "3. В градостроительном плане земельного участка содержится информация: ... 11) о границах публичных сервитутов; (ст. 57.3). 6. На чертежах межевания территории отображаются: ... 5) границы публичных сервитутов. (ст. 43)", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/fb76ce1fdb5356574b298a9dcdafcfc8fc6c937b/", "explanation": "Границы публичных сервитутов по ГрК указываются в градостроительном плане земельного участка и на чертежах проекта межевания территории. В проекте планировки, ПЗЗ и градостроительном регламенте этого нет.", "confidence": "high", "note": "Ст. 43: https://www.consultant.ru/document/cons_doc_LAW_51040/f111b9e03a38b2b3937951a4e8401a29754eeb8d/"}, {"id": 133, "type": "open", "text": "Выполните подстановку двух пропущенных слов ( первое слово с маленькой буквы): По договору подряда на выполнение проектных и изыскательских работ заказчик обязан передать подрядчику _______________, а также иные исходные данные, необходимые для составления технической документации.", "answer": ["задание на проектирование"], "source": "Гражданский кодекс РФ, ст. 759 п. 1", "quote": "По договору подряда на выполнение проектных и изыскательских работ заказчик обязан передать подрядчику задание на проектирование, а также иные исходные данные, необходимые для составления технической документации.", "url": "https://www.consultant.ru/document/cons_doc_LAW_9027/99a6ace4a6434e03f0e24a98cab08620c05eb7ff/", "explanation": "По ст. 759 ГК заказчик передаёт подрядчику задание на проектирование и другие исходные данные.", "confidence": "high", "note": "В задании сказано «двух слов», но ответ состоит из трёх: «задание на проектирование». Составитель, видимо, не считал предлог."}, {"id": 134, "text": "Что из перечисленного относится к основным функциям технологий информационного моделирования?", "instruction": "Выберите один вариант правильного ответа", "options": ["3D-моделирование", "управление данными", "координация разделов проектной документации", "автоматизация сметной документации", "все вышеперечисленное."], "type": "single", "answer": [5], "source": "СП 333.1325800.2020, приложение Ж, п. Ж.9 (задачи информационного моделирования при изысканиях и проектировании)", "quote": "К задачам применения информационного моделирования ... могут быть отнесены: 1) Выпуск чертежей и спецификаций... 3) Пространственная междисциплинарная координация и выявление коллизий. 4) Подсчет объемов работ и оценка сметной стоимости.", "url": "https://docs.cntd.ru/document/573514520", "explanation": "ТИМ включает трёхмерное моделирование, управление данными модели, координацию разделов и подсчёт объёмов для смет. Поэтому верно «все вышеперечисленное».", "confidence": "medium", "note": "Готового перечня «основных функций ТИМ» в нормах нет, ответ основан на логике составителя («все вышеперечисленное»). Задачи из приложения Ж СП 333 подтверждают координацию и сметы, 3D-модель и данные следуют из определений ЦИМ (п. 3.1.6–3.1.10)."}, {"id": 135, "text": "Как называются данные, определяющие размеры, форму и пространственное расположение элемента 3D графика информационной модели?", "instruction": "Выберите один вариант правильного ответа", "options": ["атрибутивные данные.", "геометрические данные.", "физические данные.", "цифровые данные.", "организационно-технологические данные."], "type": "single", "answer": [2], "source": "СП 333.1325800.2020, п. 3.1.10", "quote": "3.1.10 геометрические данные: Данные, определяющие размеры, форму и пространственное расположение элемента цифровой информационной модели.", "url": "https://docs.cntd.ru/document/573514520", "explanation": "По СП 333 размеры, форму и положение элемента модели задают геометрические данные. Атрибутивные данные — это свойства элемента, записанные буквами и цифрами.", "confidence": "high", "note": "В вопросе сказано «элемента 3D графика», а в СП — «элемента цифровой информационной модели». Смысл тот же."}, {"id": 136, "text": "Какие уровни детализации информационной модели (LOD) обычно используются на стадии концептуального проектирования?", "instruction": "Выберите два варианта правильных ответов", "options": ["LOD 100", "LOD 200", "LOD 300", "LOD 400."], "type": "multi", "count": 2, "answer": [1, 2], "source": "AIA E202-2008 / BIMForum Level of Development Specification (LOD 100 — Concept Design, LOD 200 — Schematic Design); в российских СП уровни LOD не применяются", "quote": "LOD 100: Concept Design — elements are represented as basic conceptual ideas... LOD 200: Schematic Design — elements are modelled as generic systems, objects, or assemblies with approximate quantities, size, shape, location, and orientation.", "url": "https://www.designingbuildings.co.uk/wiki/Level_of_Development_(LOD)_in_Building_Information_Modelling", "explanation": "На ранних (концептуальных) стадиях используют низкую проработку: LOD 100 — концепция, LOD 200 — приблизительные размеры и форма. LOD 300 и 400 — это рабочая документация и изготовление.", "confidence": "medium", "note": "LOD — зарубежная шкала. В СП 333.1325800.2020 свои обозначения уровней проработки (A, B, C1, C2, D). В разных источниках LOD 200 относят к эскизному проекту (schematic design), а не к концепции, но в паре «два ответа» это LOD 100 и LOD 200."}, {"id": 137, "text": "Какие требования к зданиям и сооружениям, а также к связанным со зданиями и с сооружениями процессам проектирования, строительства, монтажа, наладки, эксплуатации и утилизации устанавливает ФЗ Технический регламент о безопасности зданий и сооружений?", "instruction": "Выберите один вариант правильного ответа", "options": ["минимально необходимые.", "максимально необходимые.", "рекомендуемые.", "специальные.", "вариативные."], "type": "single", "answer": [1], "source": "384-ФЗ, ст. 3 ч. 6", "quote": "6. Настоящий Федеральный закон устанавливает минимально необходимые требования к зданиям, сооружениям, процессам, осуществляемым на всех этапах их жизненного цикла, в том числе требования: ...", "url": "https://www.consultant.ru/document/cons_doc_LAW_95720/a2fdedbff7fae1cd2491c6346de37561cfb9c7db/", "explanation": "Технический регламент устанавливает минимально необходимые требования безопасности к зданиям и связанным с ними процессам.", "confidence": "high", "note": "Вопрос цитирует старую редакцию ч. 6 ст. 3 («процессам проектирования, строительства, монтажа, наладки, эксплуатации и утилизации»). С 653-ФЗ от 25.12.2023 там сказано «процессам, осуществляемым на всех этапах их жизненного цикла». Слова «минимально необходимые» остались. В тексте задания в PDF есть лишний номер «12.»."}, {"id": 138, "text": "В каких целях выдается градостроительный план земельного участка субъектам градостроительной деятельности ?", "instruction": "выберите несколько вариантов правильных ответов", "options": ["в целях обеспечения информацией, необходимой для архитектурно-строительного проектирования объектов капитального строительства в границах земельного участка", "в целях обеспечения информацией, необходимой для строительства объектов капитального строительства в границах земельного участка", "в целях обеспечения информацией, необходимой для реконструкции объектов капитального строительства в границах земельного участка", "в целях обеспечения информацией, необходимой для капитального ремонта объектов капитального строительства в границах земельного участка", "в целях обеспечения информацией, необходимой для технико-экономического обоснования строительства в границах земельного участка"], "type": "multi", "count": "many", "answer": [1, 2, 3], "source": "Градостроительный кодекс РФ, ст. 57.3 ч. 1", "quote": "1. Градостроительный план земельного участка выдается в целях обеспечения субъектов градостроительной деятельности информацией, необходимой для архитектурно-строительного проектирования, строительства, реконструкции объектов капитального строительства в границах земельного участка.", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/fb76ce1fdb5356574b298a9dcdafcfc8fc6c937b/", "explanation": "ГПЗУ выдают для проектирования, строительства и реконструкции. Капитальный ремонт и ТЭО в этой статье не названы.", "confidence": "high", "note": "Число правильных не указано («несколько»). По норме верных три."}, {"id": 139, "text": "Как ИМ помогает в управлении жизненным циклом здания?", "instruction": "Выберите один вариант ответа", "options": ["обеспечивает структурированный доступ к информации", "облегчает обслуживание и эксплуатацию", "упрощает реконструкцию и демонтаж", "все вышеперечисленное."], "type": "single", "answer": [4], "source": "Градостроительный кодекс РФ, ст. 1 п. 10.3; СП 333.1325800.2020, приложение Ж, пп. Ж.9–Ж.12", "quote": "информационная модель - совокупность взаимосвязанных сведений, документов и материалов..., формируемых в электронном виде на этапах выполнения инженерных изысканий, ... строительства, реконструкции, капитального ремонта, эксплуатации и (или) сноса (ГрК, ст. 1 п. 10.3)", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/cdec16ec747f11f3a7a39c7303d03373e0ef91c4/", "explanation": "ИМ ведётся на всех этапах жизни здания: даёт упорядоченный доступ к информации, помогает при эксплуатации, реконструкции и сносе. Поэтому верно «все вышеперечисленное».", "confidence": "medium", "note": "Ответ основан на логике составителя («все вышеперечисленное»). Его подтверждают определение ИМ в ГрК (все этапы жизненного цикла) и задачи эксплуатации в п. Ж.12 СП 333."}, {"id": 140, "text": "Можно ли использовать чужой архитектурный проект в качестве основы для своего?", "instruction": "", "options": ["только с согласия автора", "можно, если изменить проект более чем на 30%", "нельзя", "можно после его смерти", "можно, если изменить проект на 50%"], "type": "single", "answer": [1], "source": "Гражданский кодекс РФ, ст. 1229 п. 1; ст. 1270 п. 2 пп. 9–10; ст. 1294 п. 1", "quote": "Другие лица не могут использовать ... результат интеллектуальной деятельности ... без согласия правообладателя (ст. 1229). Проект и выполненная на его основе документация для строительства могут быть использованы повторно только с согласия автора проекта (ст. 1294)", "url": "https://www.consultant.ru/document/cons_doc_LAW_64629/dd1e8277fe5ac97eb90061a4b17c2cce12c9025d/", "explanation": "Переработка и повторное использование архитектурного проекта возможны только с согласия автора (правообладателя). «Правил 30 % или 50 %» в законе нет.", "confidence": "high", "note": "Точнее, нужно согласие правообладателя исключительного права. Обычно это автор, но им может быть и работодатель или заказчик по договору. Вариант 1 — единственный верный."}, {"id": 141, "text": "Какие требования по энергоэффективности зданий установлены в СП 50.13330.2012?", "instruction": "Выберите три варианта правильных ответов", "options": ["требования к теплозащите ограждающих конструкций", "требования к системам отопления и вентиляции", "требования к освещению", "требования к конструктивным решениям", "требования к звукоизоляции"], "type": "multi", "count": 3, "answer": [1, 2, 4], "source": "СП 50.13330.2012 «Тепловая защита зданий», п. 4.1–4.2, разделы 5–10", "quote": "4.2 В нормах устанавливают требования к: приведенному сопротивлению теплопередаче ограждающих конструкций здания; ... теплоустойчивости ограждающих конструкций...; воздухопроницаемости ограждающих конструкций; ... расходу тепловой энергии на отопление и вентиляцию зданий.", "url": "https://docs.cntd.ru/document/1200095525", "explanation": "СП 50 нормирует теплозащиту ограждающих конструкций, расход тепла на отопление и вентиляцию и свойства самих конструкций (теплоустойчивость, воздухопроницаемость, защита от влаги). Освещение (СП 52) и звукоизоляция (СП 51) — в других сводах правил.", "confidence": "medium", "note": "Вариант 2 в СП звучит не как «требования к системам отопления и вентиляции», а как «требования к расходу тепловой энергии на отопление и вентиляцию» (раздел 10). Вариант 4 («конструктивные решения») прямо в СП не назван, но СП задаёт требования к ограждающим конструкциям (разделы 6–8). Ответ выбран исключением: освещение и звукоизоляция к СП 50 точно не относятся. Задание полностью совпадает с № 146. Дубль задания № 141 (текст и варианты совпадают). Оговорки те же: вариант 2 в СП сформулирован как «расход тепловой энергии на отопление и вентиляцию», вариант 4 выбран исключением."}, {"id": 142, "text": "Какие материалы рекомендуется использовать для отделки интерьеров с точки зрения экологической безопасности?", "instruction": "Выберите три варианта правильных ответов", "options": ["материалы с низким содержанием летучих органических соединений (VOC)", "натуральные краски", "обои на бумажной основе.", "обои на флизелиновой основе", "полимерные материалы"], "type": "multi", "count": 3, "answer": [1, 2, 3], "source": "Нормативного источника нет; общие рекомендации по экологичной отделке (низкоэмиссионные материалы с малым содержанием ЛОС, натуральные краски, бумажные обои)", "quote": "", "url": "", "explanation": "Для здоровья в помещении советуют материалы с низким выделением летучих органических веществ, натуральные краски и бумажные обои, которые «дышат». Полимерные материалы считаются менее экологичными.", "confidence": "low", "note": "Ответ основан на логике составителя, норма не найдена. Флизелиновые обои тоже часто называют экологичными, и их можно поставить вместо бумажных. Выбор «бумажные» сделан как самый очевидный для составителя. В спецификации задание по ошибке отнесено к календарно-сетевому планированию."}, {"id": 143, "text": "Какие нормативные - правовые документы регламентируют информационное моделирование в России?", "instruction": "Выберите три варианта правильных ответов", "options": ["ГОСТ Р 10.0.02-2023", "СП 333.1325800.2020", "Постановление Правительства РФ №331 от 05.03.2021", "Градостроительный кодекс", "ГОСТ Р 21.1101—2013 «Система проектной документации. Основные требования к проектной и рабочей документации».", "ПП РФ № 614 от 17.05.2024"], "type": "multi", "count": 3, "answer": [3, 4, 6], "source": "Градостроительный кодекс РФ, ст. 1 п. 10.3 и ст. 57.5; Постановление Правительства РФ от 05.03.2021 № 331; Постановление Правительства РФ от 17.05.2024 № 614", "quote": "Правила формирования и ведения информационной модели, состав сведений, документов и материалов, включаемых в информационную модель ..., требования к форматам указанных электронных документов устанавливаются Правительством Российской Федерации (ГрК, ст. 57.5 ч. 2)", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/06616d8bc3e2a55716e03b389946a91b9c4554b6/", "explanation": "Нормативные правовые акты по ТИМ — это ГрК (ст. 57.5), ПП № 331 (когда ИМ обязательна) и ПП № 614 (правила ведения ИМ). ГОСТ и СП — нормативно-технические документы, а ГОСТ Р 21.1101 вообще про оформление документации.", "confidence": "medium", "note": "Спорное задание. Ключ построен на различии «нормативные правовые акты» (ГрК, постановления Правительства) и «нормативно-технические документы» (ГОСТ, СП). Если составитель понимал вопрос широко, он мог считать верными и СП 333.1325800.2020, и ГОСТ. ГОСТ Р 10.0.02 существует только в редакции 2019 г. (ИСО 16739-1, IFC), «2023» в варианте — ошибка. ГОСТ Р 21.1101-2013 заменён ГОСТ Р 21.101-2020 и к ТИМ не относится."}, {"id": 144, "text": "Что такое среда общих данных?", "instruction": "Выберите один вариант правильного ответа", "options": ["общая среда данных для хранения и обмена информацией", "программа для создания 3D моделей", "инструмент для визуализации проекта", "все вышеперечисленное"], "type": "single", "answer": [1], "source": "СП 301.1325800.2017, п. 3.9; ГОСТ Р 57311-2016, п. 2.3", "quote": "3.9 среда общих данных; СОД (здесь): Комплекс программно-технических средств, представляющих единый источник данных, обеспечивающий совместное использование информации всеми участниками процесса строительства.", "url": "https://mrspro.ru/2018/02/informatsionnoe-modelirovanie-v-stroitelstve-pravila-organizatsii-rabot-proizvodstvenno-tehnicheskimi-otdelami/", "explanation": "Среда общих данных — единое хранилище, через которое участники проекта хранят информацию и обмениваются ею. Это не программа для 3D-моделирования и не инструмент визуализации.", "confidence": "high", "note": "Текст СП 301 сверен по копии на стороннем сайте."}, {"id": 145, "text": "Каковы последствия нарушения авторских прав архитектора?", "instruction": "Выберите один вариант правильного ответа", "options": ["гражданская", "административная", "уголовная ответственность", "все вышеперечисленное"], "type": "single", "answer": [4], "source": "Гражданский кодекс РФ, ст. 1301 (гражданская); КоАП РФ, ст. 7.12 (административная); УК РФ, ст. 146 (уголовная)", "quote": "В случаях нарушения исключительного права на произведение автор или иной правообладатель ... вправе ... требовать от нарушителя ... выплаты компенсации (ГК, ст. 1301); КоАП ст. 7.12 «Нарушение авторских и смежных прав...»; УК ст. 146 «Нарушение авторских и смежных прав»", "url": "https://www.consultant.ru/document/cons_doc_LAW_10699/b683408102681707f2702cff05f0a3025daab7ab/", "explanation": "За нарушение авторских прав возможна гражданская ответственность (компенсация, убытки), административная (КоАП 7.12) и уголовная (УК 146, например плагиат с крупным ущербом).", "confidence": "high", "note": "КоАП 7.12: https://www.consultant.ru/document/cons_doc_LAW_34661/38ae39c9c4f9501e2c080d13ff20587d2b8f5837/ ; ГК 1301: https://www.consultant.ru/document/cons_doc_LAW_64629/c2f79b53ce582e92680379e2ebd23eeb9fb7855a/"}, {"id": 146, "text": "Какие требования по энергоэффективности зданий установлены в СП 50.13330.2012?", "instruction": "Выберите три варианта правильных ответов", "options": ["требования к теплозащите ограждающих конструкций", "требования к системам отопления и вентиляции", "требования к освещению", "требования к конструктивным решениям", "требования к звукоизоляции"], "type": "multi", "count": 3, "answer": [1, 2, 4], "source": "СП 50.13330.2012 «Тепловая защита зданий», п. 4.1–4.2, разделы 5–10", "quote": "4.2 В нормах устанавливают требования к: приведенному сопротивлению теплопередаче ограждающих конструкций здания; ... теплоустойчивости ограждающих конструкций...; воздухопроницаемости ограждающих конструкций; ... расходу тепловой энергии на отопление и вентиляцию зданий.", "url": "https://docs.cntd.ru/document/1200095525", "explanation": "СП 50 нормирует теплозащиту ограждающих конструкций, расход тепла на отопление и вентиляцию и свойства самих конструкций. Освещение (СП 52) и звукоизоляция (СП 51) — в других сводах правил.", "confidence": "medium", "note": "Вариант 2 в СП звучит не как «требования к системам отопления и вентиляции», а как «требования к расходу тепловой энергии на отопление и вентиляцию» (раздел 10). Вариант 4 («конструктивные решения») прямо в СП не назван, но СП задаёт требования к ограждающим конструкциям (разделы 6–8). Ответ выбран исключением: освещение и звукоизоляция к СП 50 точно не относятся. Задание полностью совпадает с № 146. Дубль задания № 141 (текст и варианты совпадают). Оговорки те же: вариант 2 в СП сформулирован как «расход тепловой энергии на отопление и вентиляцию», вариант 4 выбран исключением."}, {"id": 147, "type": "open", "text": "Вставьте пропущенное слово (с большой буквы) ____________ деятельность – это деятельность по развитию территорий, в том числе городов и иных поселений, осуществляемая в виде территориального планирования, градостроительного зонирования, планировки территории, архитектурно-строительного проектирования, строительства, капитального ремонта, реконструкции, сноса объектов капитального строительства, эксплуатации зданий, сооружений, благоустройства территории.", "answer": ["Градостроительная"], "source": "Градостроительный кодекс РФ, ст. 1 п. 1", "quote": "1) градостроительная деятельность - деятельность по развитию территорий, в том числе городов и иных поселений, осуществляемая в виде территориального планирования, градостроительного зонирования, планировки территории, архитектурно-строительного проектирования...", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/cdec16ec747f11f3a7a39c7303d03373e0ef91c4/", "explanation": "Так ГрК определяет градостроительную деятельность.", "confidence": "high", "note": "По заданию слово пишется с большой буквы. Вопрос цитирует старую редакцию. Сейчас определение заканчивается словами «эксплуатации зданий, сооружений, комплексного развития территорий и их благоустройства»."}];

const gk = id => groupOf[id] || ("q" + id);  // дубли считаются одним вопросом
const GROUPS = [...new Set(BANK.map(q => gk(q.id)))];
const N_DISP = BANK.filter(q => q.confidence !== "high").length;

let S = load();
let timerH = null, timerLast = 0;
let screen = null;  // текущий экран — чтобы «Помощь» возвращала туда же
const cur = () => S[S.active || "t"];

function load(){
  let s; try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ s = {}; }
  ["t", "all"].forEach(k => { if (s[k] && !s[k].rec){ s[k].rec = {}; s[k].kind = k === "t" ? "exam" : "all"; } });
  return s;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = s => String(s || "").toLowerCase().replace(/ё/g, "е").replace(/[«»"'“”„.,;:!?()\[\]…]/g, " ").replace(/[‐-―−-]/g, "-").replace(/\s*-\s*/g, "-").replace(/\s+/g, " ").trim();

// статистика по вопросам: сколько раз попадался и верен ли последний ответ
function record(id, ok){
  S.stats = S.stats || {};
  const st = S.stats[gk(id)] || {n: 0};
  st.n++; st.last = ok;
  S.stats[gk(id)] = st;
}

// ---------- вариант ----------
// Сначала вопросы, которые ещё не попадались, потом те, где была ошибка, потом решённые верно.
// Состав по типам — как на экзамене. Из группы дублей берётся одно задание.
function makeVariant(){
  const stats = S.stats || {};
  const tier = g => !stats[g] ? 0 : (stats[g].last === false ? 1 : 2);
  const ids = [];
  for (const k of Object.keys(QUOTA)){
    const groups = {};
    BANK.filter(q => kindOf(q) === k).forEach(q => (groups[gk(q.id)] = groups[gk(q.id)] || []).push(q.id));
    const order = shuffle(Object.keys(groups)).sort((a, b) => tier(a) - tier(b));
    order.slice(0, QUOTA[k]).forEach(g => ids.push(shuffle(groups[g].slice())[0]));
  }
  return shuffle(ids);
}
const newExam = () => ({kind: "exam", ids: makeVariant(), ans: {}, chk: {}, self: {}, rec: {}, cur: 0, mode: S.mode || "instant", started: Date.now(), elapsed: 0, done: false});
const newAll = () => ({kind: "all", ids: BANK.map(q => q.id), ans: {}, chk: {}, self: {}, rec: {}, cur: 0, mode: "instant", started: Date.now(), elapsed: 0, done: false});
// засчитать ответ в статистику один раз за сессию
function recordOnce(t, id){
  if (t.rec[id] != null) return;
  const ok = isCorrect(byId[id], t.ans[id], t.self[id]);
  record(id, ok); t.rec[id] = ok;
}
function setSelf(t, id, val){
  t.self[id] = val;
  if (t.rec[id] != null){ const ok = isCorrect(byId[id], t.ans[id], val); t.rec[id] = ok; if (S.stats && S.stats[gk(id)]) S.stats[gk(id)].last = ok; }
  if (t.kind === "exam" && t.done && S.history && S.history.length) S.history[S.history.length - 1].score = t.ids.filter(x => isCorrect(byId[x], t.ans[x], t.self[x])).length;
  save();
}

// ---------- проверка ----------
function isAnswered(q, v){
  if (v == null) return false;
  if (q.type === "open") return norm(v).length > 0;
  if (q.type === "match") return q.left.every((_, i) => v[i + 1]);
  if (q.type === "sequence") return v.length === q.options.length;
  if (q.type === "multi") return q.count === "many" ? v.length > 0 : v.length === q.count;
  return v.length === 1;
}
function isCorrect(q, v, selfOk){
  if (!isAnswered(q, v)) return false;
  const a = q.answer;
  if (q.type === "open") return !!selfOk || a.some(x => norm(x) === norm(v));
  if (q.type === "match") return Object.keys(a).every(k => v[k] === a[k]) && Object.keys(v).every(k => v[k] === a[k]);
  if (q.type === "sequence") return a.length === v.length && a.every((x, i) => x === v[i]);
  if (q.accept_any) return v.length === 1 && a.includes(v[0]);  // в задании «один ответ», а по норме верны несколько
  const s1 = [...v].sort((x, y) => x - y).join(","), s2 = [...a].sort((x, y) => x - y).join(",");
  return s1 === s2;
}
function answerText(q, v){
  if (v == null || (Array.isArray(v) && !v.length) || (typeof v === "object" && !Array.isArray(v) && !Object.keys(v).length) || (typeof v === "string" && !v.trim())) return "—";
  if (q.type === "open") return v;
  if (q.type === "match") return q.left.map((_, i) => (i + 1) + " – " + (v[i + 1] || "?")).join(", ");
  if (q.type === "sequence") return v.map(n => q.options[n - 1]).join(" → ");
  if (q.option_images) return v.map(n => "рисунок " + n).join(", ");
  return v.map(n => n + ") " + q.options[n - 1]).join("; ");
}

// ---------- общие куски ----------
function setBar(html){ const b = $("bar"); if (!html){ b.hidden = true; return; } b.hidden = false; $("barIn").innerHTML = html; }
function stopTimer(){
  if (timerH){
    clearInterval(timerH); timerH = null;
    const t = cur();
    if (t && document.visibilityState === "visible") t.elapsed = (t.elapsed || 0) + Math.min(Date.now() - timerLast, 5000);
    save();
  }
  $("timer").textContent = "";
}
// таймер — только в экзаменационном режиме; считает время, проведённое на экране теста
function startTimer(){
  stopTimer();
  const t = cur();
  if (t.kind !== "exam" || t.mode !== "end") return;
  let n = 0;
  timerLast = Date.now();
  const tick = () => {
    const now = Date.now();
    if (document.visibilityState === "visible") t.elapsed = (t.elapsed || 0) + Math.min(now - timerLast, 5000);
    timerLast = now;
    const left = MINUTES * 60000 - t.elapsed;
    const el = $("timer"), a = Math.abs(left), m = Math.floor(a / 60000), s = Math.floor(a % 60000 / 1000);
    el.textContent = (left < 0 ? "−" : "") + m + ":" + String(s).padStart(2, "0");
    el.classList.toggle("over", left < 0);
    el.title = left < 0 ? "Время экзамена (90 минут) вышло" : "Осталось из 90 минут";
    if (++n % 10 === 0) save();
  };
  tick(); timerH = setInterval(tick, 1000);
}
function bindZoom(root){
  (root || document).querySelectorAll("[data-zoom]").forEach(el => el.onclick = e => { e.stopPropagation(); zoom(el.dataset.zoom); });
}
function zoom(name){
  const z = document.createElement("div");
  z.className = "zoom";
  z.innerHTML = `<button class="x" aria-label="Закрыть">×</button><img src="${IMG[name]}" alt=""><div class="zh">Двигайте рисунок пальцем. Закрыть — × или «Назад»</div>`;
  z.querySelector(".x").onclick = () => history.back();
  document.body.appendChild(z);
  history.pushState({app: 1, zoom: 1}, "");
}
const imgBlock = name => `<img class="qimg" src="${IMG[name]}" alt="Рисунок к заданию" data-zoom="${name}"><div class="hint-zoom">Нажмите на рисунок, чтобы увеличить</div>`;

// ---------- экран задания ----------
function qStatus(t, id){
  const q = byId[id], v = t.ans[id];
  if (t.mode === "instant" && t.chk[id]) return isCorrect(q, v, t.self[id]) ? "ok" : "bad";
  return isAnswered(q, v) ? "ans" : "";
}

// scroll: "top" — новое задание, "keep" — та же прокрутка, "fb" — показать разбор
function showQ(scroll){
  screen = () => showQ("keep");
  enter();
  const y = window.scrollY;
  const t = cur(), id = t.ids[t.cur], q = byId[id], N = t.ids.length;
  const locked = t.mode === "instant" && t.chk[id];
  const v = t.ans[id];
  $("homeBtn").hidden = false;
  $("title").textContent = `Задание ${t.cur + 1} из ${N}`;
  $("prog").style.width = (Object.keys(t.ans).filter(k => isAnswered(byId[k], t.ans[k])).length / N * 100) + "%";
  startTimer();

  let body = `<div class="qmeta"><span>${TYPE_NAME[q.type]}</span><span>№&nbsp;${q.id} в банке</span></div>`;
  body += `<p class="qtext">${esc(q.text)}</p>`;
  if (q.image) body += imgBlock(q.image);
  let instr = q.instruction || "";
  if (q.type === "multi" && (!instr || q.count === "many")) instr = q.count === "many" ? "Выберите все верные варианты (сколько — в задании не сказано)" : "Выберите несколько вариантов ответа";
  if (q.type === "sequence") instr = "Нажимайте варианты по порядку: первый, второй и т. д. Повторное нажатие снимает номер с этого варианта и всех после него.";
  if (q.type === "match") instr = "Для каждой строки колонки А выберите букву из колонки Б. Некоторые буквы лишние.";
  if (q.type === "open") instr = "Впишите пропущенное слово или словосочетание.";
  if (q.type === "single" && !instr) instr = "Выберите один вариант ответа";
  body += `<div class="instr">${esc(instr)}</div>`;

  if (q.type === "single" || q.type === "multi"){
    const sel = v || [];
    const cls = n => {
      if (!locked) return sel.includes(n) ? "on" : "";
      const right = q.answer.includes(n), mine = sel.includes(n);
      return right && mine ? "ok" : (!right && mine ? "bad" : (right ? "ok miss" : ""));
    };
    if (q.option_images){
      body += `<div class="optgrid">` + q.options.map((o, i) => `<button class="opt optimg ${cls(i + 1)}" data-n="${i + 1}" ${locked ? "disabled" : ""}><img src="${IMG[q.option_images[i]]}" alt="${esc(o)}"><span class="cap">${esc(o)}</span><span class="zbtn" data-zoom="${q.option_images[i]}" role="button" aria-label="Увеличить">⤢</span></button>`).join("") + `</div>`;
    } else {
      body += `<div class="opts">` + q.options.map((o, i) => `<button class="opt ${q.type === "multi" ? "multi" : ""} ${cls(i + 1)}" data-n="${i + 1}" ${locked ? "disabled" : ""}><span class="mk">${i + 1}</span><span>${esc(o)}</span></button>`).join("") + `</div>`;
    }
    if (q.type === "multi" && q.count !== "many" && !locked) body += `<div class="counter" id="counter">Выбрано ${sel.length} из ${q.count}</div>`;
  }
  if (q.type === "sequence"){
    const sel = v || [];
    body += `<div class="opts">` + q.options.map((o, i) => {
      const pos = sel.indexOf(i + 1);
      let c = pos >= 0 ? "on" : "";
      if (locked) c = pos >= 0 && q.answer[pos] === i + 1 ? "ok" : "bad";
      return `<button class="opt ${c}" data-n="${i + 1}" ${locked ? "disabled" : ""}><span class="seqnum">${pos >= 0 ? pos + 1 : ""}</span><span>${esc(o)}</span></button>`;
    }).join("") + `</div>`;
    if (!locked) body += `<div class="counter">Расставлено ${sel.length} из ${q.options.length}</div>`;
  }
  if (q.type === "match"){
    const sel = v || {};
    body += `<div class="coltitle">${esc(q.right_title || "Колонка Б")}</div><div class="rlist">` + q.right.map((r, i) => `<div><b>${LET[i]})</b> ${esc(r)}</div>`).join("") + `</div>`;
    body += `<div class="coltitle">${esc(q.left_title || "Колонка А")}</div>`;
    body += q.left.map((l, i) => {
      const k = String(i + 1), mine = sel[k] || "";

      return `<div class="mrow ${c}"><div class="l"><b>${i + 1})</b> ${esc(l)}</div><select data-k="${k}" ${locked ? "disabled" : ""} aria-label="Ответ для строки ${i + 1}"><option value="">— выберите букву —</option>${q.right.map((r, j) => `<option value="${LET[j]}" ${mine === LET[j] ? "selected" : ""}>${LET[j]}) ${esc(r.length > 60 ? r.slice(0, 58) + "…" : r)}</option>`).join("")}</select></div>`;
    }).join("");
    if (!locked) body += `<div class="counter" id="counter">Заполнено ${Object.keys(sel).length} из ${q.left.length}</div>`;
  }
  if (q.type === "open"){
    const c = locked ? (isCorrect(q, v, t.self[id]) ? "ok" : "bad") : "";
    body += `<input class="open ${c}" id="openIn" type="text" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ваш ответ" value="${esc(v || "")}" ${locked ? "disabled" : ""}>`;
