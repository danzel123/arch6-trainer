ериалов. Текстовые и графические материалы:", "options": ["ведомость «Состав проектной документации»", "графическая часть (чертежи и схемы)", "обложка", "содержание тома", "текстовая часть", "титульный лист"], "type": "sequence", "answer": [3, 6, 4, 1, 5, 2], "source": "ГОСТ Р 21.1101-2013, п. 4.1.4", "quote": "4.1.4 Текстовые и графические материалы, включаемые в том, в общем случае комплектуют в следующем порядке: - обложка; - титульный лист; - содержание тома; - ведомость \"Состав проектной документации\"...; - текстовая часть; - графическая часть (чертежи и схемы).", "url": "https://meganorm.ru/Data2/1/4293777/4293777893.htm", "explanation": "Том комплектуют так: обложка, титульный лист, содержание тома, ведомость «Состав проектной документации», текстовая часть, затем чертежи и схемы.", "confidence": "high", "note": "В действующем ГОСТ Р 21.101-2020, п. 8.1.2, обложки в перечне нет, он начинается с титульного листа. Остальной порядок тот же. Ведомость «Состав проектной документации» допускается выпускать отдельным томом."}, {"id": 48, "text": "Установите последовательность выполнения акустического расчета в соответствии со СНиП 23.03.2003 Защита от шума.", "instruction": "Ответ запишите в виде последовательности действий. Действия:", "options": ["выбор точек в помещениях и на территориях, для которых необходимо провести расчет (расчетных точек)", "выявление источников шума и определение их шумовых характеристик", "определение ожидаемых уровней шума в расчетных точках", "определение путей распространения шума от его источника (источников) до расчетных точек и потерь звуковой энергии по каждому из путей (снижение за счет расстояния, экранирования, звукоизоляции ограждающих конструкций, звукопоглощения и др.)", "определение требуемого снижения уровней шума на основе сопоставления ожидаемых уровней шума с допустимыми уровнями шума", "проверочный расчет достаточности выбранных шумозащитных мероприятий для обеспечения защиты объекта или территории от шума", "разработка мероприятий по обеспечению требуемого снижения уровней шума"], "type": "sequence", "answer": [2, 1, 4, 3, 5, 7, 6], "source": "СНиП 23-03-2003, п. 4.5; действующий СП 51.13330.2011, п. 4.4", "quote": "4.4 Акустический расчет должен производиться в следующей последовательности: выявление источников шума...; выбор... расчетных точек; выявление путей распространения шума...; определение ожидаемых уровней шума...; определение требуемого снижения...; разработка мероприятий...; проверочный расчет...", "url": "https://meganorm.ru/mega_doc/norm/pravila/0/sp_51_13330_2011_svod_pravil_zashchita_ot_shuma.html", "explanation": "Сначала находят источники шума, потом выбирают расчётные точки, прослеживают пути шума и потери на них, считают ожидаемый уровень, сравнивают с допустимым, разрабатывают мероприятия и в конце проверяют, хватает ли их.", "confidence": "high", "note": "Формулировки вариантов взяты из СП 51.13330.2011 (актуализированный СНиП 23-03-2003). Порядок шагов в СНиП 23-03-2003 тот же."}, {"id": 49, "type": "match", "text": "Установите соответствие между определением архитектурно-конструктивного элемента (из колонки А) и его наименованием (из колонки Б).", "left_title": "А. Определение архитектурно-конструктивного элемента", "right_title": "Б. Наименование архитектурно-конструктивного элемента", "left": ["выступающая из плоскости фасада огражденная площадка (в летнее время)", "выступающий из плоскости скатной крыши объем с вертикальным светопропускающим ограждением", "выходящая из плоскости фасада часть помещения, частично или полностью остекленная, улучшающая его освещенность и инсоляцию", "остекленная часть покрытия для освещения лестничной клетки или внутреннего дворика", "перекрытое и огражденное в плане с трех сторон помещение, открытое во внешнее пространство, служащее для отдыха и солнцезащиты", "часть здания в виде многосветного пространства (3 и более этажей), развитого по вертикали, смежного с поэтажными частями здания (галереями, коридорами, помещениями и пр.), как правило, имеющего верхнее освещение"], "right": ["атриум", "балкон", "лоджия", "люкарна", "окно", "световой фонарь", "эркер"], "instruction": "Каждый элемент из колонки Б может быть использован один раз или не использован вообще. Ответ запишите в виде последовательности пар «цифра – буква».", "answer": {"1": "б", "2": "г", "3": "ж", "4": "е", "5": "в", "6": "а"}, "source": "СНиП 2.08.01-89* «Жилые здания», прил. 1 (балкон, лоджия, эркер); СП 118.13330.2012, п. 3.3 (атриум); люкарна — энциклопедия «Знание.Вики» (по БРЭ)", "quote": "Балкон - выступающая из плоскости стены фасада огражденная площадка, служащая для отдыха в летнее время. ... Эркер - выходящая из плоскости фасада часть помещения, частично или полностью остекленная, улучшающая его освещенность и инсоляцию.", "url": "https://meganorm.ru/Data2/1/4294854/4294854790.htm", "explanation": "Балкон — выступающая площадка; люкарна — окно в скате крыши с вертикальной рамой; эркер — выступающая остеклённая часть помещения; световой фонарь — остеклённая часть покрытия; лоджия — помещение, огороженное с трёх сторон и открытое наружу; атриум — многосветное пространство высотой от трёх этажей.", "confidence": "high", "note": "Определения балкона, лоджии и эркера дословно взяты из СНиП 2.08.01-89*, атриума — из СП 118.13330.2012, п. 3.3. Для люкарны и светового фонаря нормативного определения нет: люкарна — по энциклопедии («оконный проём в скате крыши... с вертикальной рамой»), световой фонарь — по смыслу и методом исключения. Вариант «окно» лишний."}, {"id": 50, "type": "match", "text": "Установите соответствие между определениями (из колонки А) и терминами (из колонки Б).", "left_title": "А. Определения", "right_title": "Б. Термины", "left": ["замена и (или) восстановление строительных конструкций или элементов таких конструкций, за исключением несущих строительных конструкций, замена и (или) восстановление систем инженерно-технического обеспечения и сетей инженерно-технического обеспечения объектов капитального строительства или их элементов, замена отдельных элементов несущих строительных конструкций на аналогичные или иные улучшающие показатели таких конструкций", "изменение параметров объекта капитального строительства, его частей (высоты, количества этажей, площади, объема), в том числе надстройка, перестройка, расширение объекта капитального строительства, а также замена и (или) восстановление несущих строительных конструкций объекта капитального строительства", "изменение таких параметров объектов или их участков (частей), которое не влечет за собой изменение класса, категории и (или) первоначально установленных показателей функционирования таких объектов и при котором не требуется изменение границ полос отвода и (или) охранных зон таких объектов", "изменение таких параметров объектов или их частей, которое влечет за собой изменение класса, категории и (или) первоначально установленных показателей функционирования таких объектов (мощности, грузоподъемности и других) или при котором требуется изменение границ полос отвода и (или) охранных зон таких объектов", "создание зданий, строений, сооружений (в том числе на месте сносимых объектов капитального строительства)"], "right": ["капитальный ремонт линейных объектов", "капитальный ремонт объектов капитального строительства", "реконструкция линейных объектов", "реконструкция объектов капитального строительства", "реставрация зданий и сооружений", "строительство"], "instruction": "Каждый элемент из колонки Б может быть использован один раз или не использован вообще. Ответ запишите в виде последовательности пар «цифра – буква».", "answer": {"1": "б", "2": "г", "3": "а", "4": "в", "5": "е"}, "source": "Градостроительный кодекс РФ, ст. 1, п. 13, 14, 14.1, 14.2, 14.3", "quote": "14.3) капитальный ремонт линейных объектов - изменение параметров линейных объектов или их участков (частей), которое не влечет за собой изменение класса, категории и (или) первоначально установленных показателей функционирования таких объектов...", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/cdec16ec747f11f3a7a39c7303d03373e0ef91c4/", "explanation": "Замена ненесущих конструкций и инженерных систем — капремонт ОКС (п. 14.2). Изменение высоты, этажности и площади — реконструкция ОКС (п. 14). Изменение параметров линейного объекта без смены класса — капремонт линейного объекта (п. 14.3), со сменой класса — его реконструкция (п. 14.1). Создание новых зданий — строительство (п. 13).", "confidence": "high", "note": "Термин «реставрация» в ст. 1 ГрК РФ не определён — это лишний вариант. В действующей редакции определения 1 и 2 длиннее: туда добавлены оговорки о замене отдельных элементов несущих конструкций. Соответствие от этого не меняется."}, {"id": 51, "type": "match", "text": "Установите соответствие между определениями (из колонки А) и терминами (из колонки Б).", "left_title": "А. Определения", "right_title": "Б. Термины", "left": ["изделие (конструкция, устройство, монтажный блок) технологических систем, внутренних и наружных систем и сетей инженерно-технического обеспечения зданий и сооружений, впервые разработанное и изготовленное на месте монтажа", "изделие, предназначенное для применения в качестве элемента зданий, сооружений и строительных конструкций", "материал, в том числе штучный, предназначенный для изготовления строительных изделий и возведения строительных конструкций зданий и сооружений", "составная часть сборной или монолитной конструкции", "часть здания или сооружения, выполняющая определенные несущие, ограждающие и (или) эстетические функции"], "right": ["нетиповое изделие", "нетиповой узел", "строительная конструкция", "строительное изделие", "строительный материал", "элемент строительной конструкции"], "instruction": "Каждый элемент из колонки Б может быть использован один раз или не использован вообще. Ответ запишите в виде последовательности пар «цифра – буква».", "answer": {"1": "а", "2": "г", "3": "д", "4": "е", "5": "в"}, "source": "ГОСТ Р 21.101-2020, п. 3.1.6 (= ГОСТ 21.114-2013, п. 3.3); ГОСТ 21.501-2018, пп. 3.5–3.8; 384-ФЗ, ст. 2 ч. 2 п. 24", "quote": "3.6 строительное изделие: Изделие, предназначенное для применения в качестве элемента зданий, сооружений и строительных конструкций. 3.7 элемент строительной конструкции: Составная часть сборной или монолитной конструкции. 3.8 строительный материал: Материал, в т. ч. штучный… (ГОСТ 21.501-2018)", "url": "https://meganorm.ru/Data2/1/4293732/4293732743.htm", "explanation": "Определения взяты из стандартов СПДС: нетиповое изделие — ГОСТ 21.114/ГОСТ Р 21.101, строительное изделие, материал и элемент конструкции — ГОСТ 21.501-2018, строительная конструкция — 384-ФЗ и ГОСТ 21.501-2018 (п. 3.5).", "confidence": "high", "note": "В определении нетипового изделия в задании сокращено: в стандарте «изготовленное, как правило, на месте монтажа (в заготовительной мастерской монтажной организации)». Вариант «нетиповой узел» (б) лишний."}, {"id": 52, "type": "match", "text": "Установите соответствие между определением архитектурно-конструктивного элемента (из колонки А) и его наименованием (из колонки Б).", "left_title": "А. Определение архитектурно-конструктивного элемента", "right_title": "Б. Наименование архитектурно-конструктивного элемента", "left": ["горизонтальная несущая конструкция зданий и сооружений, имеющая призматическую форму, одно из измерений которой (длина) существенно больше двух других измерений", "криволинейная конструкция, перекрывающая пространство между двумя опорами", "несущая конструкция, состоящая из стержней, расположенных в одной плоскости и соединенных между собой в узлах таким образом, что они образуют геометрически неизменяемую решетчатую систему", "плоская стержневая конструкция, состоящая из вертикальных элементов (стоек) и горизонтальных (ригелей), жестко соединенных между собой во всех или некоторых узлах", "пространственное покрытие, имеющее геометрическую форму, образованную выпуклой криволинейной поверхностью", "пространственное покрытие, ограниченное двумя криволинейными поверхностями, расстояние между которыми (толщина) мало по сравнению с остальными размерами конструкции", "элемент покрытия, образованный жестко соединенными под некоторыми углами плоскими плитами"], "right": ["арка", "балка", "купол", "оболочка", "рама", "свод", "складка", "ферма"], "instruction": "Каждый элемент из колонки Б может быть использован один раз или не использован вообще. Ответ запишите в виде последовательности пар «цифра – буква».", "answer": {"1": "б", "2": "а", "3": "з", "4": "д", "5": "е", "6": "г", "7": "ж"}, "source": "СП 304.1325800.2017 «Конструкции большепролетных зданий и сооружений. Правила эксплуатации», пп. 3.4–3.12", "quote": "3.7 арка: Криволинейная конструкция, перекрывающая пространство между двумя опорами. … 3.11 свод: Пространственное покрытие, имеющее геометрическую форму, образованную выпуклой криволинейной поверхностью. 3.12 купол: Пространственное покрытие, образованное поверхностью вращения…", "url": "https://meganorm.ru/mega_doc/norm/perechen/0/sp_304_1325800_2017_svod_pravil_konstruktsii.html", "explanation": "Все семь определений дословно взяты из раздела 3 СП 304.1325800.2017. Определение 5 («выпуклая криволинейная поверхность») — это свод; у купола в том же СП своё определение («поверхность вращения»), поэтому купол здесь лишний.", "confidence": "high", "note": "Ловушка: определение 5 легко принять за купол, но по СП 304 это свод (п. 3.11); купол (в) не используется."}, {"id": 53, "text": "Какое соотношение между шагом человека (Ш) и размерами ступени (h – высота подступенка; b – ширина проступи) используется при проектировании лестниц?", "instruction": "", "options": ["2 b + h = Ш", "2h + b = Ш", "b + h = ½ Ш", "h + ½ b = Ш", "h + b = Ш"], "type": "single", "answer": [2], "source": "Эмпирическое правило шага (формула Блонделя), приводится в учебниках по архитектурным конструкциям: 2h + b = 600–640 мм", "quote": "Формула Блонделя для лестницы — 2h + b = 600–640 мм, где h — высота ступени (подступёнка), b — ширина проступи.", "url": "https://buildingclub.ru/formula-rascheta-lestnicy/", "explanation": "Удвоенная высота подступенка плюс ширина проступи примерно равны длине шага человека (около 600–640 мм) — так подбирают удобные размеры ступеней.", "confidence": "high", "note": "Это не норма СП, а классическое учебное правило; в нормах (СП 1.13130, СП 54.13330) заданы только предельные h и b. Остальные варианты заведомо неверны."}, {"id": 54, "type": "match", "text": "Установите соответствие между характеристикой планировочного решения (из колонки А) и наименованием планировочного решения (из колонки Б).", "left_title": "А. Характеристика планировочного решения", "right_title": "Б. Наименование планировочного решения", "left": ["здание, в котором вспомогательные помещения группируются вокруг главного", "здание, в котором помещения имеют выходы через протяженное горизонтальное внутреннее пространство вдоль наружной стены не менее чем на две лестницы", "здание, в котором протяженное горизонтальное внутреннее пространство, связывает главные и вспомогательные помещения", "здание, квартирного типа, состоящее из двух и более квартир, каждая из которых имеет непосредственный выход на приквартирный участок", "здание, с последовательно расположенными помещениями с дверными проёмами по одной оси", "здание, состоящее из автономных отсеков с самостоятельным входом в каждый отсек"], "right": ["блокированный жилой дом", "здание анфиладного типа", "здание галерейного типа", "здание коридорного типа", "здание с зальной композиционной схемой", "здание с центральной композиционной схемой", "здание секционного типа"], "instruction": "Каждый элемент из колонки Б может быть использован один раз или не использован вообще. Ответ запишите в виде последовательности пар «цифра – буква».", "answer": {"1": "е", "2": "в", "3": "г", "4": "а", "5": "б", "6": "ж"}, "source": "СНиП 2.08.01-89* «Жилые здания», прил. 1 (блокированный, галерейный, коридорный дом); Синянский И.А., Манешина Н.И. «Типология зданий», п. 2.2 (центрическая, анфиладная, секционная схемы)", "quote": "Блокированный жилой дом - здание квартирного типа, состоящее из двух и более квартир, каждая из которых имеет непосредственный выход на приквартирный участок (СНиП). Центрическая схема: одно главное большое помещение, а вокруг него группируются второстепенные (Синянский)", "url": "https://zakonbase.ru/content/part/340496", "explanation": "Главное помещение с группой вспомогательных вокруг — центральная (центрическая) схема; общий проход вдоль наружной стены к двум лестницам — галерея; внутренний проход, связывающий помещения, — коридор; выход каждой квартиры на свой участок — блокированный дом; двери по одной оси — анфилада; автономные отсеки со своими входами — секции.", "confidence": "medium", "note": "Формулировки задания — пересказ, а не цитаты. Вариант «зальная схема» (д) лишний: в учебниках зальная схема — одно большое помещение на этаже, а «главное + вспомогательные вокруг» — центрическая. Строки 2 и 3 различаются только словами «вдоль наружной стены» (галерея) — в СНиП и коридорный, и галерейный дом определены через выход «не менее чем на две лестницы»."}, {"id": 55, "type": "match", "text": "Установите соответствие между определением (из колонки А) и термином (из колонки Б).", "left_title": "А. Определение", "right_title": "Б. Термин", "left": ["состояние объекта, характеризуемое возможностью возникновения взрыва и развития пожара или возникновения пожара и последующего взрыва", "характеристика зданий, сооружений и пожарных отсеков, определяемая пределами огнестойкости конструкций, применяемых для строительства указанных зданий, сооружений и отсеков", "характеристика зданий, сооружений и пожарных отсеков, определяемая степенью участия строительных конструкций в развитии пожара и образовании опасных факторов пожара", "характеристика строительных объектов, определяемая назначением и особенностями эксплуатации указанных строительных объектов, в том числе особенностями осуществления в них технологических процессов производства"], "right": ["степень огнестойкости зданий, сооружений и пожарных отсеков", "предел огнестойкости зданий, сооружений и пожарных отсеков", "класс функциональной пожарной опасности зданий, сооружений и пожарных отсеков", "класс пожарной опасности строительных конструкций", "класс конструктивной пожарной опасности зданий, сооружений и пожарных отсеков", "группа зданий, сооружений и пожарных отсеков по распространению пламени", "взрывопожароопасность объекта защиты"], "instruction": "Каждый элемент из колонки Б может быть использован один раз или не использован вообще. Ответ запишите в виде последовательности пар «цифра – буква».", "answer": {"1": "ж", "2": "а", "3": "д", "4": "в"}, "source": "123-ФЗ «Технический регламент о требованиях пожарной безопасности», ст. 2, пп. 5, 11, 12, 44", "quote": "5) взрывопожароопасность объекта защиты - состояние объекта защиты, характеризуемое возможностью возникновения взрыва и развития пожара или возникновения пожара и последующего взрыва; … 44) степень огнестойкости зданий… определяемая пределами огнестойкости конструкций…", "url": "https://www.consultant.ru/document/cons_doc_LAW_78699/faceb5076dc3bfec940ab70185591f70543d6240/", "explanation": "Это определения из ст. 2 123-ФЗ: участие конструкций в развитии пожара — класс конструктивной пожарной опасности, назначение и особенности эксплуатации — класс функциональной пожарной опасности, пределы огнестойкости конструкций — степень огнестойкости.", "confidence": "high", "note": "В строке 4 задания написано «характеристика строительных объектов», в законе — «классификационная характеристика зданий, сооружений и пожарных отсеков»; смысл тот же."}, {"id": 56, "type": "open", "text": "Вставьте пропущенное слово в данное ниже определение части здания или сооружения в соответствии со Строительными нормами и правилами СНиП 2.08.01-89* Жилые здания. Перекрытое и огражденное в плане с трех сторон помещение, открытое во внешнее пространство, служащее для отдыха в летнее время и солнцезащиты, – это ________…", "answer": ["лоджия"], "source": "СНиП 2.08.01-89* «Жилые здания», прил. 1 «Термины и определения»", "quote": "Лоджия - перекрытое и огражденное в плане с трех сторон помещение, открытое во внешнее пространство, служащее для отдыха в летнее время и солнцезащиты.", "url": "https://zakonbase.ru/content/part/340496", "explanation": "По СНиП 2.08.01-89* так определяется лоджия: помещение с перекрытием, огороженное с трёх сторон и открытое наружу.", "confidence": "high", "note": "СНиП 2.08.01-89* давно утратил силу; формулировку определения лоджии в действующих нормах (СП 54.13330.2022) я не сверял, но сам термин тот же."}, {"id": 57, "type": "open", "text": "Вставьте пропущенный термин. _____________________ – это висячие покрытия, основанные на сочетании работы жестких опор и растяжении тросов, стержней.", "answer": ["вантовые конструкции", "вантовые покрытия", "вантовые системы", "вантовые"], "source": "СП 304.1325800.2017, п. 3.14", "quote": "3.14 вантовые конструкции: Висячие покрытия, основанные на сочетании работы жестких опор и растяжении тросов, стержней.", "url": "https://meganorm.ru/mega_doc/norm/perechen/0/sp_304_1325800_2017_svod_pravil_konstruktsii.html", "explanation": "Висячие покрытия, где жёсткие опоры работают вместе с растянутыми тросами (вантами), называются вантовыми конструкциями.", "confidence": "high", "note": "Основной ответ по СП — «вантовые конструкции»; «вантовые покрытия/системы» — допустимые синонимы. Такое же определение есть в «Толковом строительно-архитектурном словаре» (2012)."}, {"id": 58, "type": "open", "text": "Вставьте пропущенный термин. _______________– это пространственное покрытие, образованное поверхностью вращения или близкое по форме к такой поверхности.", "answer": ["купол"], "source": "СП 304.1325800.2017, п. 3.12", "quote": "3.12 купол: Пространственное покрытие, образованное поверхностью вращения или близкое по форме к такой поверхности.", "url": "https://meganorm.ru/mega_doc/norm/perechen/0/sp_304_1325800_2017_svod_pravil_konstruktsii.html", "explanation": "Покрытие в форме поверхности вращения (или близкой к ней) — это купол.", "confidence": "high", "note": ""}, {"id": 59, "type": "open", "text": "Вставьте пропущенное слово в определение цели архитектурной деятельности. Архитектурная деятельность – профессиональная деятельность граждан (архитекторов), имеющая целью ______________________ и включающая в себя творческий процесс создания архитектурного проекта, координацию разработки всех разделов проектной документации для строительства или для реконструкции, авторский надзор за строительством архитектурного объекта, а также деятельность юридических лиц по организации профессиональной деятельности архитекторов.", "answer": ["создание архитектурного объекта"], "source": "Федеральный закон от 17.11.1995 № 169-ФЗ «Об архитектурной деятельности в Российской Федерации», ст. 2", "quote": "архитектурная деятельность - профессиональная деятельность граждан (архитекторов), имеющая целью создание архитектурного объекта и включающая в себя творческий процесс создания архитектурного проекта…", "url": "https://legalacts.ru/doc/federalnyi-zakon-ot-17111995-n-169-fz-ob/", "explanation": "По ст. 2 закона № 169-ФЗ цель архитектурной деятельности — создание архитектурного объекта.", "confidence": "high", "note": ""}, {"id": 60, "type": "open", "text": "Дополните предложение. Виды инженерных изысканий, порядок их выполнения для подготовки проектной документации, строительства, реконструкции объектов капитального строительства, состав, форма материалов и результатов инженерных изысканий, порядок их представления для размещения в государственных информационных системах обеспечения градостроительной деятельности устанавливаются ____________.", "answer": ["Правительством Российской Федерации", "Правительством РФ", "Правительство Российской Федерации"], "source": "Градостроительный кодекс РФ, ст. 47, ч. 6", "quote": "6. Виды инженерных изысканий, порядок их выполнения для подготовки проектной документации, строительства, реконструкции объектов капитального строительства, состав, форма материалов и результатов инженерных изысканий… устанавливаются Правительством Российской Федерации.", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/f651879e0acd4680a6fdc29f983536624055cbcc/", "explanation": "Ч. 6 ст. 47 ГрК РФ относит установление видов, порядка и состава инженерных изысканий к полномочиям Правительства РФ (сейчас это постановление Правительства РФ).", "confidence": "high", "note": "В действующей редакции (после 541-ФЗ от 19.12.2022) — «государственных информационных системах обеспечения градостроительной деятельности субъектов Российской Федерации»; на ответ не влияет. «Правительство» — с прописной буквы."}, {"id": 61, "type": "open", "text": "Дополните предложение наименованием документа, который выдается на объект в соответствии с Федеральным законом «Об объектах культурного наследия (памятниках истории и культуры) народов Российской Федерации» от 25.06.2002 № 73-ФЗ (статья 21). На объект культурного наследия, включенный в реестр, собственнику или иному законному владельцу указанного объекта культурного наследия, земельного участка в границах территории объекта культурного наследия, включенного в реестр, либо земельного участка, в границах которого располагается объект археологического наследия, соответствующим органом охраны объектов культурного наследия на основании сведений об объекте культурного наследия, содержащихся в реестре, выдается ________________.", "answer": ["паспорт объекта культурного наследия", "паспорт"], "source": "Федеральный закон от 25.06.2002 № 73-ФЗ, ст. 21, п. 1", "quote": "…соответствующим органом охраны объектов культурного наследия на основании сведений об объекте культурного наследия, содержащихся в реестре, выдается паспорт объекта культурного наследия.", "url": "https://www.consultant.ru/document/cons_doc_LAW_37318/ea91e7f832c6284ba7f632c53f12c94447e21cf4/", "explanation": "Ст. 21 закона № 73-ФЗ так и называется: «Паспорт объекта культурного наследия»; его выдаёт орган охраны по данным реестра.", "confidence": "high", "note": ""}, {"id": 62, "type": "open", "text": "Вставьте пропущенные слова в данное ниже определение части здания или сооружения в соответствии с Федеральным законом «Технический регламент о требованиях пожарной безопасности» от 22.07.2008 № 123-ФЗ (в редакции, актуальной с 31.07.2018). _______________ – это часть здания, сооружения и строения, выделенная противопожарными стенами и противопожарными перекрытиями или покрытиями, с пределами огнестойкости конструкции, обеспечивающими нераспространение пожара за границы пожарного отсека в течение всей продолжительности пожара.", "answer": ["пожарный отсек"], "source": "123-ФЗ, ст. 2, п. 27 (редакция до Федерального закона от 14.07.2022 № 276-ФЗ)", "quote": "пожарный отсек — часть здания и сооружения, выделенная противопожарными стенами и противопожарными перекрытиями или покрытиями, с пределами огнестойкости конструкции, обеспечивающими нераспространение пожара за границы пожарного отсека…", "url": "https://www.consultant.ru/document/cons_doc_LAW_78699/faceb5076dc3bfec940ab70185591f70543d6240/", "explanation": "Часть здания, отделённая противопожарными стенами и перекрытиями так, чтобы пожар не вышел за её пределы, называется пожарным отсеком.", "confidence": "high", "note": "Определение в задании — старая редакция. С 2022 г. (276-ФЗ) п. 27 звучит так: «часть здания или сооружения, выделенная противопожарными стенами и (или) противопожарными перекрытиями 1-го типа». Термин тот же."}, {"id": 63, "type": "open", "text": "Вставьте пропущенное словосочетание в данное ниже определение части здания или сооружения в соответствии с Федеральным законом «Технический регламент о требованиях пожарной безопасности» от 22.07.2008 № 123-ФЗ (в редакции, актуальной с 31.07.2018). _________________ преграда – это строительная конструкция с нормированными пределом огнестойкости и классом конструктивной пожарной опасности конструкции, объемный элемент здания или иное инженерное решение, предназначенные для предотвращения распространения пожара из одной части здания, сооружения, строения в другую или между зданиями, сооружениями, строениями, зелеными насаждениями.", "answer": ["противопожарная"], "source": "123-ФЗ, ст. 2, п. 35", "quote": "35) противопожарная преграда - строительная конструкция с нормированными пределом огнестойкости и классом конструктивной пожарной опасности конструкции, объемный элемент здания или иное инженерное решение, предназначенные для предотвращения распространения пожара…", "url": "https://www.consultant.ru/document/cons_doc_LAW_78699/faceb5076dc3bfec940ab70185591f70543d6240/", "explanation": "Конструкция или решение, которые не дают пожару перейти из одной части здания в другую, называются противопожарной преградой.", "confidence": "high", "note": "В задании сказано «словосочетание», но пропущено одно слово перед «преграда» — «противопожарная». В тексте задания есть слово «строения», которого в действующей редакции (после 117-ФЗ от 10.07.2012) уже нет; на ответ это не влияет."}, {"id": 64, "type": "open", "text": "Вставьте пропущенное слово в данное ниже определение части здания в соответствии со Строительными нормами и правилами СНиП 2.08.01-89* Жилые здания. ___________ – это проходное пространство между дверями, служащее для защиты от проникания холодного воздуха, дыма и запахов при входе в здание, лестничную клетку или другие помещения.", "answer": ["тамбур"], "source": "СНиП 2.08.01-89* «Жилые здания», прил. 1 «Термины и определения»", "quote": "Тамбур - проходное пространство между дверями, служащее для защиты от проникания холодного воздуха, дыма и запахов при входе в здание, лестничную клетку или другие помещения.", "url": "https://zakonbase.ru/content/part/340496", "explanation": "Проходное пространство между двумя дверями, которое защищает от холода, дыма и запахов, — это тамбур.", "confidence": "high", "note": "СНиП 2.08.01-89* утратил силу; задание прямо ссылается на него."}, {"id": 65, "type": "open", "text": "Вставьте пропущенный термин. ______________ – это ухудшение технических и связанных с ними эксплуатационных показателей здания, вызванное объективными причинами.", "answer": ["физический износ здания", "физический износ"], "source": "ГОСТ 31937-2011, п. 3.25 (то же — СП 13-102-2003; в ГОСТ 31937-2024 — п. 3.28)", "quote": "3.25 физический износ здания: Ухудшение технических и связанных с ними эксплуатационных показателей здания, вызванное объективными причинами.", "url": "https://meganorm.ru/Data2/1/4293781/4293781963.htm", "explanation": "Ухудшение технических и эксплуатационных показателей здания по объективным причинам (старение, воздействие среды) называется физическим износом.", "confidence": "high", "note": "Номер пункта в ГОСТ 31937-2024 (п. 3.28) взят из справочника терминов, сам текст ГОСТ 2024 не открывал. В ВСН 58-88(р) физический износ определён по-другому («величина, характеризующая степень ухудшения…»), но термин тот же."}, {"id": 66, "type": "open", "text": "Вставьте пропущенный термин. _______________ – это способность конструкции сохранять равновесие при внешних и внутренних нагрузках.", "answer": ["устойчивость", "устойчивость конструкции"], "source": "Терминологический словарь по строительству на 12 языках (ВНИИИС Госстроя СССР), статья «устойчивость конструкций»; курс строительной механики", "quote": "устойчивость конструкций — Способность конструкций противостоять внешним силам, стремящимся вывести её из исходного состояния статического или динамического равновесия", "url": "https://dic.academic.ru/dic.nsf/stroitel/5223", "explanation": "Способность конструкции сохранять равновесие под нагрузкой — это устойчивость (в отличие от прочности — способности не разрушаться, и жёсткости — способности не деформироваться сверх нормы).", "confidence": "medium", "note": "Дословного источника формулировки «сохранять равновесие при внешних и внутренних нагрузках» не нашёл; ответ подтверждён по смыслу словарными и учебными определениями."}, {"id": 67, "type": "open", "text": "Вставьте пропущенный термин (в соответствии с СП 246.1325800.2016 Положение об авторском надзоре за строительством зданий и сооружений). _____________ – это дефект, при наличии которого здание, сооружение, его часть или конструктивный элемент функционально непригодны, дальнейшее ведение работ по условиям прочности и устойчивости небезопасно или может повлечь снижение указанных характеристик в процессе эксплуатации.", "answer": ["критический дефект"], "source": "СП 246.1325800.2016, п. 3.10", "quote": "3.10 критический дефект: Дефект, при наличии которого здание, сооружение, его часть или конструктивный элемент функционально непригодны, дальнейшее ведение работ по условиям прочности и устойчивости небезопасно или может повлечь снижение указанных характеристик в процессе эксплуатации.", "url": "https://www.tdesant.ru/info/item/284", "explanation": "По СП 246 дефект, из-за которого конструкция непригодна, а продолжать работы опасно, называется критическим (его устраняют до начала следующих работ).", "confidence": "high", "note": "СП 246.1325800.2016 заменён: сначала на СП 246.1325800.2023 (приказ Минстроя № 5/пр от 09.01.2024), затем на СП 246.1325800.2026 (действует с 04.07.2026). Есть ли этот термин в новых редакциях, не сверял; задание прямо ссылается на редакцию 2016 г. То же определение есть в Классификаторе основных видов дефектов в строительстве (1993)."}, {"id": 68, "type": "open", "text": "Вставьте пропущенный термин (в соответствии с СП 246.1325800.2016 Положение об авторском надзоре за строительством зданий и сооружений). _________________– это контроль лица, осуществившего строительство (подрядчика), застройщика, заказчика или организации, осуществившей разработку проектной документации и на её основе рабочей документации и привлеченной заказчиком (застройщиком) по договору для осуществления строительного контроля (в части проверки соответствия выполняемых работ проектной и рабочей документации).", "answer": ["строительный контроль"], "source": "СП 246.1325800.2016, п. 3.2", "quote": "3.2 строительный контроль: Контроль лица, осуществившего строительство (подрядчика), застройщика, заказчика или организации, осуществившей разработку проектной документации и на её основе рабочей документации и привлеченной заказчиком (застройщиком) по договору…", "url": "https://www.tdesant.ru/info/item/284", "explanation": "Контроль подрядчика, застройщика или заказчика (или привлечённой ими организации) за соответствием работ проекту — это строительный контроль (ст. 53 ГрК РФ). Авторский надзор — это контроль со стороны проектировщика.", "confidence": "high", "note": "СП 246.1325800.2016 заменён редакциями 2023 и 2026 гг.; задание ссылается на редакцию 2016 г."}, {"id": 69, "text": "Укажите минимальную ширину маршей лестниц, ведущих на жилые этажи в многоквартирных секционных трёх-и более этажных жилых зданиях:", "instruction": "", "options": ["0,9", "1,0", "1,05", "1,15", "1,35"], "type": "single", "answer": [3], "source": "СП 1.13130.2020, п. 6.1.16, табл. 4", "quote": "Таблица 4 … Марши лестниц, ведущие на жилые этажи зданий: а) секционных: - двухэтажных 1,05 1:1,5 - трехэтажных и более 1,05 1:1,75 б) коридорных 1,2 1:1,75", "url": "https://meganorm.ru/Data2/1/4293722/4293722520.htm", "explanation": "В секционных жилых домах высотой три этажа и больше минимальная ширина марша — 1,05 м (в коридорных — 1,2 м, во внутриквартирных и подвальных — 0,9 м).", "confidence": "high", "note": "Задание дублирует № 69."}, {"id": 70, "type": "open", "text": "Дополните утверждение. В проектной документации здания или сооружения в соответствии с федеральными законами и другими нормативными правовыми актами Российской Федерации должны быть предусмотрены мероприятия по ________________, которые должны обеспечивать предотвращение или минимизацию оказания негативного воздействия на окружающую среду.", "answer": ["охране окружающей среды", "охрана окружающей среды"], "source": "384-ФЗ «Технический регламент о безопасности зданий и сооружений», ст. 32", "quote": "Мероприятия по охране окружающей среды, предусмотренные в проектной документации здания или сооружения в соответствии с федеральными законами и другими нормативными правовыми актами Российской Федерации, должны обеспечивать предотвращение или минимизацию оказания негативного воздействия…", "url": "https://www.consultant.ru/document/cons_doc_LAW_95720/9a1de7c4da6d55da74f00a655b9d86f5649750ea/", "explanation": "Ст. 32 384-ФЗ требует, чтобы мероприятия по охране окружающей среды в проекте предотвращали или снижали вред природе.", "confidence": "high", "note": "Задание — пересказ ст. 32 с переставленными словами; правильная форма после «мероприятия по» — «охране окружающей среды»."}, {"id": 71, "text": "Что понимается под функциональной схемой зданий?", "instruction": "Выберите один вариант ответа.", "options": ["объёмно-пространственная композиция зданий", "пространственная материальная оболочка, ограничивающая здание", "схема размещения помещений в пространстве этажа", "условная схема коммуникаций", "условная схема размещения помещений с обозначением их технологических взаимосвязей"], "type": "single", "answer": [5], "source": "Учебник «Основы архитектуры и строительных конструкций», гл. 12 «Функциональные основы проектирования зданий»", "quote": "Для правильного расположения помещений в здании необходимо составить функциональную, или технологическую, схему. Она представляет собой условное изображение помещений в виде прямоугольников, их группировку и связи между ними.", "url": "https://studme.org/1713111027009/tovarovedenie/funktsionalnye_osnovy_proektirovaniya_zdaniy", "explanation": "Функциональная (технологическая) схема — это условная схема: помещения показаны прямоугольниками, а их технологические связи — стрелками. Это ещё не план этажа.", "confidence": "medium", "note": "Вариант 3 («схема размещения помещений в пространстве этажа») — это по сути план этажа, а не функциональная схема. Учебниковое определение. Формулировка варианта 5 близка к учебнику, но дословно не совпадает."}, {"id": 72, "type": "single", "text": "На каком рисунке показана ячейковая планировочная композиция здания?", "instruction": "Выберите один вариант ответа", "options": ["Рисунок 1", "Рисунок 2", "Рисунок 3", "Рисунок 4", "Рисунок 5"], "option_images": ["q72_1.png", "q72_2.png", "q72_3.png", "q72_4.png", "q72_5.png"], "answer": [3], "source": "Следы исходного ключа в PDF оценочного средства (у варианта «3)» оставлено жирное начертание, как и у правильных ответов заданий 15, 30, 102, 142); типология композиционных схем — Синянский И.А., Манешина Н.И. «Типология зданий»", "quote": "", "url": "", "explanation": "Ячейковая схема — здание из отдельных объёмов-ячеек, сгруппированных вокруг общего узла связи (как на рисунке 3). Рисунок 1 — центрическая схема (помещения вокруг холла), 2 — анфиладная, 4 — зальная, 5 — секционная (лестничные клетки со своими входами).", "confidence": "medium", "note": "Источник рисунков не найден. В PDF подпись «3)» выделена жирным — в других заданиях такие следы совпадают с правильными ответами по нормам. Исследователь по учебнику Синянского–Манешиной склонялся к рисунку 1 (низкая уверенность), в части пособий ячейковую схему приравнивают к секционной (рисунок 5)."}, {"id": 73, "text": "Какие виды объемно-пространственной композиции созданы по признаку пространственного расположения форм?", "instruction": "Выберите один вариант правильного ответа", "options": ["горизонтальная, вертикальная, наклонная", "объемная, фронтальная, пространственная", "открытая, замкнутая, сложная", "стоечно-балочная, ордерная, каркасная", "цилиндрическая, кубическая, плоскостная"], "type": "single", "answer": [2], "source": "Курс «Объемно-пространственная композиция» (по учебнику Степанова А.В. и др.); лекция 2.3 «Виды композиции», Полоцкий гос. университет", "quote": "Различают три основных вида композиции: фронтальную, объемную и глубинно-пространственную.", "url": "https://elib.psu.by/bitstream/123456789/3672/3/%D0%9B%D0%B5%D0%BA%D1%86%D0%B8%D1%8F%202.3.pdf", "explanation": "По тому, как формы расположены в пространстве, композицию делят на фронтальную (развита в плоскости), объёмную (воспринимается со всех сторон) и глубинно-пространственную.", "confidence": "high", "note": "В варианте ответа «пространственная» означает глубинно-пространственную композицию. Источник — учебная лекция; дословно учебник Степанова не сверял."}, {"id": 74, "text": "Что называют масштабностью в архитектуре?", "instruction": "", "options": ["закономерное чередование элементов с убыванием или возрастанием их размеров или шага", "соотношение между размерами сооружения и человека, а также между всем сооружением и его частями и деталями", "соотношение размеров частей, членений и деталей сооружения", "соразмерность сооружения человеку и окружающей среде, восприятие человеком величины и значимости сооружения.", "физическая величина сооружения"], "type": "single", "answer": [4], "source": "Средства архитектурной гармонизации (учебная статья tatlin.ru по учебнику архитектурной композиции); см. также Терминологический словарь по строительству (ВНИИИС), статья «масштабность»", "quote": "Масштабность в архитектуре — это восприятие человеком величины и значительности сооружения, это «подходящая предмету мера», приданная ему человеком, это, следовательно, соразмерность сооружения человеку и окружающей среде…", "url": "https://tatlin.ru/articles/sredstva_garmonizacii", "explanation": "Масштабность — это то, насколько сооружение соразмерно человеку и окружению и каким по величине и значимости оно воспринимается. Это не физический размер и не пропорции частей.", "confidence": "medium", "note": "Вариант 2 («соотношение между размерами сооружения и человека, а также между всем сооружением и его частями и деталями») в одних пособиях — определение «архитектурного масштаба», в других — «архитектурной масштабности». Вариант 4 почти дословно повторяет классическое определение масштабности, поэтому выбран он. Вариант 3 — пропорции, вариант 1 — ритмический ряд, вариант 5 — величина."}, {"id": 75, "text": "Как называется изображение людей, животных, транспортных средств и других элементов предметной среды, позволяющее судить о масштабах архитектурного сооружения?", "instruction": "", "options": ["стаффаж", "энтазис", "оммаж", "анфилада", "аккорд"], "type": "single", "answer": [1], "source": "Термин «стаффаж» (нем. Staffage) в изобразительном искусстве и архитектурной графике; определение по словарю изобразительного искусства (Власов В.Г.), приведено в статье «Стаффаж» Википедии", "quote": "Стаффаж (нем. Staffage от staffieren — ‘украшать картины фигурами’) — «второстепенные элементы композиции, создающие фон, окружение, среду для основных фигур…» … в жанрах путевых зарисовок и архитектурной графики…", "url": "https://ru.wikipedia.org/wiki/%D0%A1%D1%82%D0%B0%D1%84%D1%84%D0%B0%D0%B6", "explanation": "Фигуры людей, животных, машин и других предметов на архитектурном рисунке называют стаффажем; по ним видно масштаб сооружения. Энтазис — утолщение ствола колонны, анфилада — ряд комнат по одной оси, оммаж и аккорд к архитектурной графике не относятся.", "confidence": "high", "note": "Нормативного определения нет. В пособиях по архитектурной графике стаффаж — изображения людей, автомобилей, животных и т. п., которые показывают масштаб и назначение объекта (раздел «Антураж и стаффаж»). Остальные варианты заведомо не подходят."}, {"id": 76, "text": "Какие задачи определяют функциональные требования, предъявляемые к зданиям?", "instruction": "Выберите один вариант ответа.", "options": ["обеспечение прочности и устойчивости здания", "обеспечение условий рациональной планировки", "подбор класса здания, соответствующего производственному процессу", "удовлетворение условиям долговечности и огнестойкости", "удовлетворение условиям нормального микроклимата"], "type": "single", "answer": [2], "source": "Учебник по архитектуре/конструкциям гражданских зданий, раздел «Требования к зданиям и их классификация» (п. 1.2; формулировка как у Т.Г. Маклаковой, С.М. Нанасовой «Конструкции гражданских зданий»); Тишков В.А., Рыскулова М.Н. «Архитектура. Общий курс», ННГАСУ, 2010, п. 2.1", "quote": "«функциональной целесообразности, т. е. здание должно полностью отвечать тому процессу, для которого оно предназначено (удобство проживания, труда, отдыха и т. д.); технической целесообразности, т. е. здание должно надежно защищать людей от внешних воздействий (низких или высоких температур...»", "url": "https://studfile.net/preview/4497543/", "explanation": "Функциональные требования — это удобство здания для процесса, ради которого его строят, то есть рациональная планировка. Прочность, устойчивость, долговечность, огнестойкость и защита от температур (микроклимат) относятся к техническим требованиям.", "confidence": "medium", "note": "Нормы на этот вопрос нет, ответ по учебнику. В некоторых конспектах к функциональным требованиям относят и санитарно-гигиенические условия (микроклимат, вариант 5), но в классической схеме (функциональные / технические / художественные / экономические) защита от температурных воздействий отнесена к техническим требованиям."}, {"id": 77, "text": "При определении каких параметров здания учитываются размеры человека?", "instruction": "Выберите один вариант ответа.", "options": ["при определении площади помещения", "при определении размеров окон и дверей", "при определении размеров дверных проёмов, мебели", "при определении соотношения площадей помещений", "при определении площади светопроемов"], "type": "single", "answer": [3], "source": "Эргономика и антропометрия в архитектуре: Э. Нойферт «Строительное проектирование», раздел «Человек: размеры и потребность в пространстве»; J. Panero, M. Zelnik «Human Dimension and Interior Space»", "quote": "Рост стоя нужен «при определении минимальной высоты дверных проёмов и дверей, располагаемых над головой конструкций»; высота бедра сидя — «при дизайне прилавков... письменных столов... или других предметов мебели» (ТПУ, «Антропометрические основы проектирования»).", "url": "https://portal.tpu.ru/SHARED/f/FEHAI/for_students/Tab2/Tab/2.pdf", "explanation": "Размеры тела человека прямо задают размеры дверных проёмов, мебели и оборудования. Площади помещений и их соотношения задаются функциональными нормами, а размеры окон и световых проёмов — требованиями к освещённости (КЕО).", "confidence": "medium", "note": "Учебниковый вопрос, нормы нет. Вариант 2 («окон и дверей») верен только наполовину: размеры окон определяются освещённостью, а не размерами человека."}, {"id": 78, "text": "Какие характеристики определяют функциональные качества зданий, обеспечивающие их нормальную эксплуатацию?", "instruction": "Выберите пять вариантов правильных ответов.", "options": ["жесткость здания", "надежность здания", "оборудование", "организация внутреннего пространства", "параметры микроклимата в помещении", "пожарная безопасность", "световой режим", "условия видимости"], "type": "multi", "count": 5, "answer": [3, 4, 5, 7, 8], "source": "Тишков В.А., Рыскулова М.Н. «Архитектура. Общий курс», ННГАСУ, 2010, п. 2.1.1 «Факторы, от которых зависит качество жизненной среды», п. 2.2.2–2.2.3 (технические требования)", "quote": "«Качество среды зависит от ряда факторов... – пространство, необходимое для деятельности человека, размещения оборудования и перемещения людей; – состояние воздушной среды (микроклимат)...; – световой режим...; – видимость и зрительное восприятие»", "url": "https://bibl.nngasu.ru/electronicresources/uch-metod/architecture/4842.pdf", "explanation": "Функциональные качества здания — это организация внутреннего пространства, оборудование, микроклимат, световой режим и условия видимости. Жёсткость и надёжность относятся к техническим требованиям, пожарная безопасность — к требованиям безопасности (техническим).", "confidence": "low", "note": "Нормы на этот вопрос нет — это учебниковый вопрос. Точную фразу «функциональные качества зданий, обеспечивающие их нормальную эксплуатацию» найти не удалось. Ответ опирается на деление требований к зданию на функциональные и технические (надёжность, прочность, огнестойкость) и на перечень факторов среды в учебнике ННГАСУ. Нормы нет, точного первоисточника формулировки «функциональные качества..., обеспечивающие нормальную эксплуатацию» найти не удалось. Ответ по разделению функциональных и технических требований в учебнике ННГАСУ. Там пожарные требования названы «техническими (и отчасти функциональными)». Если составитель считает пожарную безопасность функциональной, спорным становится вариант 3 «оборудование»."}, {"id": 79, "text": "Какие из представленных положений относятся к Афинской хартии 1933 года?", "instruction": "Выберите три правильных варианта ответа.", "options": ["повышение компактности городов и плотности их застройки", "пространственное удаление промышленных зон от жилья", "процессы развития городов направлены на усиление взаимосвязей между городами", "смешанное использование и разнообразие", "солнце, зеленые насаждения, пространство – важные составляющие градостроительства", "строительство нового социального жилья", "чёткое градостроительное зонирование городской территории"], "type": "multi", "count": 3, "answer": [2, 5, 7], "source": "Афинская хартия (IV конгресс CIAM, 1933; рекомендации пп. 23, 26, 29, 35, 47, 76–77, 80); издание Ле Корбюзье «La Charte d'Athènes», 1943", "quote": "«47. Industrial sectors should be separated from residential sectors by an area of green open space.» «76. The four keys to urban planning are the four functions of the city: dwelling, work, recreation..., transportation.»", "url": "https://portal.uur.cz/pdf/charty-deklarace/charter-of-athens-1933.pdf", "explanation": "Афинская хартия — манифест функционального города: чёткое зонирование по четырём функциям (жильё, труд, отдых, транспорт), отделение промышленности от жилья зелёными зонами, а солнце, зелень и пространство названы основой градостроительства. Компактность, смешанное использование и связи между городами — идеи более поздних хартий (Лейпцигская хартия, «новый урбанизм»).", "confidence": "high", "note": "Формула «солнце, зелень, пространство» дословно связана с изданием хартии Ле Корбюзье (1943). В тексте 1933 г. та же мысль выражена в пп. 23, 26, 29, 35 (инсоляция, озеленённые открытые пространства)."}, {"id": 80, "text": "Какой из перечисленных композиционных вариантов характеризуется расположением элементов планировочной структуры функциональных зон (жилых, общественно-деловых, производственных зон и др.) в границах красных линий, естественных границах природных объектов и иных границах?", "instruction": "", "options": ["Квартальная планировка", "Микрорайонная планировка", "Районная планировка", "Свободная планировка"], "type": "single", "answer": [1], "source": "СП 42.13330.2016 «Градостроительство. Планировка и застройка городских и сельских поселений», п. 3.16а (введён Изм. № 1), п. 3.20, п. 4.10", "quote": "«3.16а квартал: Элемент планировочной структуры территории (единица застройки различного функционального назначения), не расчлененный улично-дорожной сетью, в границах красных линий улично-дорожной сети, полос отвода линейных объектов..., территорий общего пользования»", "url": "https://meganorm.ru/Data2/1/4293747/4293747628.htm", "explanation": "Квартал — элемент планировочной структуры застройки любого функционального назначения, ограниченный красными линиями и другими границами. Поэтому такая схема размещения — это квартальная планировка.", "confidence": "medium", "note": "Дословно формулировки вопроса в нормах нет. Ответ по смыслу определения квартала в СП 42.13330.2016. Микрорайон тоже ограничен красными линиями, но это элемент преимущественно жилых зон (СП 42.13330.2016, п. 3.20; СП 42.13330.2026, п. 3.1.10). Слова «естественные границы природных объектов, иные границы» взяты из п. 4.10 того же СП, где они относятся к границам территориальных зон."}, {"id": 81, "text": "Что понимается под функциональной схемой зданий?", "instruction": "", "options": ["объёмно-пространственная композиция зданий", "пространственная материальная оболочка, ограничивающая здание", "схема размещения помещений в пространстве этажа", "условная схема коммуникаций", "условная схема размещения помещений с обозначением их технологических взаимосвязей"], "type": "single", "answer": [5], "source": "Тишков В.А., Рыскулова М.Н. «Архитектура. Общий курс», ННГАСУ, 2010, п. 4.1.2 «Схемы планировки зданий»", "quote": "«Для правильного расположения помещений в здании целесообразно предварительно составить функциональную или технологическую схему. Она представляет собой условное графическое изображение группировки помещений и связей между ними.»", "url": "https://bibl.nngasu.ru/electronicresources/uch-metod/architecture/4842.pdf", "explanation": "Функциональная схема — условный рисунок, на котором показаны группы помещений и связи между ними по ходу функционального (технологического) процесса. Это ещё не план этажа и не объёмная композиция.", "confidence": "medium", "note": "Вариант 3 («схема размещения помещений в пространстве этажа») — это по сути план этажа, а не функциональная схема. Учебниковое определение. Формулировка варианта 5 близка к учебнику, но дословно не совпадает."}, {"id": 82, "text": "Снижение в проекте нормы площадей, установленной для отдельных помещений или групп помещений общественных зданий, встроенных в жилые дома принимается не более …", "instruction": "", "options": ["5%", "10%", "15%", "20%", "25%"], "type": "single", "answer": [3], "source": "СП 118.13330.2022 «Общественные здания и сооружения», п. 4.11 (ранее СНиП 2.08.02-89*, п. 1.2*; СНиП 31-06-2009, п. 4.2)", "quote": "«4.11 Уменьшение параметров площадей, установленных для отдельных помещений или групп помещений, не должно влиять на функциональные процессы... Допускается уменьшать площади: ... на 15 % – для помещений, встроенных в жилые здания.»", "url": "https://tiflocentre.ru/documents/sp-118-13330-2022.php", "explanation": "Для помещений общественного назначения, встроенных в жилые дома, норма площади может быть уменьшена не более чем на 15 %.", "confidence": "high", "note": "Для обычных помещений предел в разных редакциях разный: 5 % (СНиП 2.08.02-89*), 10 % (СНиП 31-06-2009), а по СП 118.13330.2022 10 % — только при реконструкции и приспособлении. Для встроенных в жилые дома везде 15 %."}, {"id": 83, "text": "Ширина площадок перед лифтами в многоквартирных жилых зданиях должна…", "instruction": "", "options": ["обеспечить зону безопасности при пожаре для МГН", "позволять использование лифта для транспортирования больного на носилках скорой помощи", "обеспечить достаточное пространство для деятельности пожарных подразделений", "иметь площадь не менее 2м.кв. на один рабочий лифт", "быть не менее 1,2м"], "type": "single", "answer": [2], "source": "СП 54.13330.2022 «Здания жилые многоквартирные», п. 5.13", "quote": "«5.13 Ширина площадок перед лифтами должна позволять использование лифта для транспортирования больного на носилках скорой помощи и быть, м, не менее: 1,5 - перед лифтами грузоподъемностью 630 кг при ширине кабины 2100 мм; 2,1 - ... при глубине кабины 2100 мм.»", "url": "https://meganorm.ru/mega_doc/norm/nomenklatura/0/sp_54_13330_2022_svod_pravil_zdaniya_zhilye_mnogokvartirnye.html", "explanation": "Ширина площадки перед лифтом в жилом доме должна позволять занести в лифт больного на носилках скорой помощи (не менее 1,5 или 2,1 м в зависимости от кабины). 1,2 м — неверная цифра.", "confidence": "high", "note": ""}, {"id": 84, "text": "В каком разделе проектной документации объектов капитального строительства производственного и непроизводственного назначения приводится описание архитектурно-строительных мероприятий, обеспечивающих защиту помещений от шума и вибрации?", "instruction": "", "options": ["«Схема планировочной организации земельного участка».", "«Объемно-планировочные и архитектурные решения».", "«Конструктивные решения».", "«Проект организации строительства».", "«Мероприятия по обеспечению пожарной безопасности».", "«Мероприятия по охране окружающей среды»."], "type": "single", "answer": [2], "source": "Положение о составе разделов проектной документации (ПП РФ от 16.02.2008 № 87), п. 13, подп. «е» — раздел 3 «Объемно-планировочные и архитектурные решения»", "quote": "«13. Раздел 3 \"Объемно-планировочные и архитектурные решения\" содержит: ... е) описание архитектурно-строительных мероприятий, обеспечивающих защиту помещений от шума, вибрации и другого воздействия»", "url": "https://www.consultant.ru/document/cons_doc_LAW_75048/cae383069aa05e04750eb0df525a6c535460cc1a/", "explanation": "Архитектурно-строительные меры защиты помещений от шума и вибрации описывают в разделе 3 «Объемно-планировочные и архитектурные решения». Раздел 8 «Охрана окружающей среды» говорит о шуме на прилегающей территории, а не о защите помещений.", "confidence": "high", "note": ""}, {"id": 85, "text": "В графической части какого раздела проектной документации на объекты капитального строительства производственного и непроизводственного назначения содержится сводный план сетей инженерно-технического обеспечения с обозначением мест подключения проектируемого объекта капитального строительства к существующим сетям инженерно-технического обеспечения?", "instruction": "Выберите один вариант правильного ответа", "options": ["Раздел 2 \"Схема планировочной организации земельного участка\".", "Раздел 3 \"Объемно-планировочные и архитектурные решения \".", "Раздел 4 \"Конструктивные решения\".", "Раздел 7 \"Проект организации строительства\".", "Раздел 9 \"Мероприятия по обеспечению пожарной безопасности\"."], "type": "single", "answer": [1], "source": "ПП РФ от 16.02.2008 № 87, п. 12 (графическая часть), подп. «о» — раздел 2 «Схема планировочной организации земельного участка»", "quote": "«12. Раздел 2 \"Схема планировочной организации земельного участка\" содержит: ... в графической части ... о) сводный план сетей инженерно-технического обеспечения с обозначением мест подключения проектируемого объекта капитального строительства к существующим сетям...»", "url": "https://www.consultant.ru/document/cons_doc_LAW_75048/cae383069aa05e04750eb0df525a6c535460cc1a/", "explanation": "Сводный план инженерных сетей с точками подключения входит в графическую часть раздела 2 «Схема планировочной организации земельного участка».", "confidence": "high", "note": "В ранних редакциях ПП № 87 это был подпункт «м», в действующей — «о». Раздел тот же."}, {"id": 86, "text": "В каком случае не требуется подготовка проектной документации?", "instruction": "Выберите один вариант правильного ответа", "options": ["При строительстве, реконструкции сооружения класса КС-3.", "В случае, если сметная стоимость строительства не подлежит оценке достоверности сметной стоимости.", "При строительстве, реконструкции объекта индивидуального жилищного строительства.", "При капитальном ремонте.", "По решению застройщика, технического заказчика, лица, ответственного за эксплуатацию здания, сооружения, регионального оператора."], "type": "single", "answer": [3], "source": "Градостроительный кодекс РФ, ст. 48, ч. 3 (и ч. 3.1, ч. 12.2)", "quote": "«3. Осуществление подготовки проектной документации не требуется при строительстве, реконструкции объекта индивидуального жилищного строительства, садового дома, гаража и хозяйственных построек... Застройщик по собственной инициативе вправе обеспечить подготовку проектной документации...»", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/b884020ea7453099ba8bc9ca021b84982cadea7d/", "explanation": "По Градостроительному кодексу для строительства и реконструкции индивидуального жилого дома (ИЖС) проектная документация не требуется. Застройщик может заказать её по желанию.", "confidence": "high", "note": "Исключение (ч. 3.1): если сметная стоимость ИЖС подлежит проверке достоверности, проект нужен. При капитальном ремонте (вариант 4) проект не обязателен только в части случаев (ч. 12.2: при бюджетном финансировании готовят смету по акту и заданию), поэтому вариант 4 не подходит как общее правило."}, {"id": 87, "text": "Каким образом наносят обозначение координационных осей?", "instruction": "", "options": ["по правой и нижней сторонам плана здания (сооружения).", "по левой и верхней сторонам плана здания (сооружения).", "по левой и нижней сторонам плана здания (сооружения).", "по правой и верхней сторонам плана здания (сооружения).", "произвольно."], "type": "single", "answer": [3], "source": "ГОСТ Р 21.101-2020 «СПДС. Основные требования к проектной и рабочей документации», п. 5.3.4 (ранее ГОСТ Р 21.1101-2013, раздел о координационных осях)", "quote": "«5.3.4 Обозначение координационных осей, как правило, наносят по левой и нижней сторонам плана здания (сооружения). При несовпадении координационных осей противоположных сторон плана... дополнительно наносят обозначения указанных осей по верхней и/или правой сторонам.»", "url": "https://meganorm.ru/Data2/1/4293720/4293720404.htm", "explanation": "Марки координационных осей, как правило, ставят слева и снизу плана. Сверху и справа их добавляют, только если оси противоположных сторон не совпадают.", "confidence": "high", "note": ""}, {"id": 88, "text": "Для какой категории объектов капитального строительства авторский надзор проводится в обязательном порядке?", "instruction": "Выберите два варианта правильного ответа", "options": ["объекты культурного наследия", "опасные производственные объекты", "многоквартирные жилые дома", "уникальные объекты", "объекты социальной инфраструктуры"], "type": "multi", "count": 2, "answer": [1, 2], "source": "СП 246.1325800.2016 «Положение об авторском надзоре за строительством зданий и сооружений», п. 4.3; Федеральный закон № 116-ФЗ «О промышленной безопасности опасных производственных объектов», ст. 8, п. 3; Федеральный закон № 73-ФЗ, ст. 45, пп. 1, 5", "quote": "СП 246.1325800.2016, п. 4.3: «Авторский надзор при строительстве опасного производственного объекта [3], а также при приспособлении объекта культурного наследия для современного использования [6] осуществляется в обязательном порядке.»", "url": "https://files.stroyinf.ru/Data2/1/4293755/4293755715.htm", "explanation": "Обязательность авторского надзора прямо установлена законами для опасных производственных объектов (116-ФЗ) и для работ по сохранению объектов культурного наследия (73-ФЗ). Для остальных объектов надзор ведут по решению застройщика.", "confidence": "high", "note": "СП 246.1325800.2016 заменён СП 246.1325800.2023, а с 04.07.2026 — СП 246.1325800.2026 (приказ Минстроя от 03.06.2026 № 351/пр). Текст редакции 2026 г. не проверен. В редакции 2023 г. эти же два случая выделены в пп. 4.2–4.3 со ссылками на 116-ФЗ ст. 8 и 73-ФЗ ст. 45."}, {"id": 89, "text": "Какое определение соответствует термину «критический дефект» при выполнении строительно-монтажных работ?", "instruction": "", "options": ["Дефект, при наличии которого существенно ухудшаются эксплуатационные характеристики строительной продукции", "Дефект, при наличии которого существенно ухудшается долговечность строительной продукции", "Дефект, выявленный при инструментальном контроле, и подлежащий проверке на условия прочности и устойчивости расчётными методами.", "Дефект, при наличии которого здание, сооружение, его часть или конструктивный элемент функционально непригодны, дальнейшее ведение работ по условиям прочности и устойчивости небезопасно либо может повлечь снижение указанных характеристик в процессе эксплуатации"], "type": "single", "answer": [4], "source": "Классификатор основных видов дефектов в строительстве и промышленности строительных материалов (Главгосархстройнадзор России, 17.11.1993), раздел II; СП 246.1325800.2016, п. 3.10", "quote": "«Критический дефект (при выполнении СМР) - дефект, при наличии которого здание, сооружение, его часть или конструктивный элемент функционально непригодны, дальнейшее ведение работ по условиям прочности и устойчивости небезопасно либо может повлечь снижение указанных характеристик...»", "url": "https://legalacts.ru/doc/klassifikator-osnovnykh-vidov-defektov-v-stroitelstve-i/", "explanation": "Критический дефект — такой, при котором конструкция функционально непригодна, а продолжать работы небезопасно по условиям прочности и устойчивости. Вариант 1 — это определение значительного дефекта.", "confidence": "high", "note": "В СП 246.1325800.2023 определения критического дефекта уже нет. Определение есть в Классификаторе 1993 г. и в СП 246.1325800.2016 (п. 3.10)."}, {"id": 90, "text": "В каких случаях специалисты авторского надзора имеют право приостанавливать своим решением производство строительно-монтажных работ?", "instruction": "Выберите один вариант правильного ответа", "options": ["Имеют право в случае выявленных отступлений от организационно-технологической документации", "При выявлении критических строительных дефектов", "Имеют право в случае выявленных отступлений от проектной или рабочей документации", "Имеют право в случае невыполнения предписаний, занесённых в журнал авторского надзора"], "type": "single", "answer": [2], "source": "СП 246.1325800.2016 «Положение об авторском надзоре за строительством зданий и сооружений», п. 7.2, перечисление «е»", "quote": "«е) оценку выявленных строительных дефектов (критический дефект, значительный дефект, малозначительный дефект). Критический дефект подлежит устранению до начала последующих работ с приостановлением начатых работ.»", "url": "https://files.stroyinf.ru/Data2/1/4293755/4293755715.htm", "explanation": "Работы приостанавливают при выявлении критического дефекта: его нужно устранить до продолжения работ. При других нарушениях авторский надзор фиксирует замечания в журнале и требует их устранить.", "confidence": "medium", "note": "Прямого права приостанавливать работы своим решением у авторского надзора ни в одном документе нет. По СП 11-110-99 (п. 6.1.4) надзор лишь вносит в органы госстройнадзора предложения о приостановлении работ. В СП 246.1325800.2023 такого права тоже нет. Ответ выбран как самый вероятный ключ составителя: только вариант 2 сформулирован не как «имеют право», и он совпадает с СП 246.1325800.2016 п. 7.2 «е»."}, {"id": 91, "text": "На какие группы возгораемости делятся строительные материалы, используемые при строительстве зданий?", "instruction": "Выберите один вариант ответа.", "options": ["сгораемые, тлеющие, воспламеняющиеся", "несгораемые и сгораемые", "сгораемые, несгораемые, тлеющие", "сгораемые, трудносгораемые, несгораемые", "несгораемые и тлеющие"], "type": "single", "answer": [4], "source": "СНиП 2.01.02-85* «Противопожарные нормы», п. 1.4* (отменён); действующий 123-ФЗ «Технический регламент о требованиях пожарной безопасности», ст. 13, ч. 3", "quote": "«1.4*. Строительные материалы по горючести (возгораемости) подразделяются на три группы: негорючие (несгораемые), трудногорючие (трудносгораемые) и горючие (сгораемые)»", "url": "https://meganorm.ru/Data2/1/4294854/4294854814.htm", "explanation": "По «возгораемости» (старый термин) материалы делили на три группы: несгораемые, трудносгораемые и сгораемые. Сейчас по 123-ФЗ материалы делят по горючести на негорючие (НГ) и горючие (Г1–Г4).", "confidence": "medium", "note": "Вопрос построен на устаревшей классификации (СНиП 2.01.02-85*, СНиП II-2-80). По действующему 123-ФЗ ст. 13 ч. 3 «по горючести строительные материалы подразделяются на негорючие (НГ) и горючие (Г1 - Г4)», то есть формально две группы, что ближе к варианту 2. Термин «возгораемость» и набор вариантов указывают на ответ 4."}, {"id": 92, "text": "Установите последовательность укладки слоев пола со сталефибробетонным покрытием по перекрытию в соответствии с техническими требованиями и правилами проектирования, устройства, приемки, эксплуатации и ремонта (СНиП 2.03.13-88 «Полы» и СНиП 3.04.01-87 «Изоляционные и отделочные покрытия»).", "instruction": "Ответ запишите в виде последовательности цифр, соответствующих слоям пола. Слои пола:", "options": ["гидроизоляция", "перекрытие", "фибробетонное покрытие", "стяжка из бетона", "теплозвукоизоляция"], "type": "sequence", "answer": [2, 5, 4, 1, 3], "source": "СП 29.13330.2011 «Полы» (актуализированная редакция СНиП 2.03.13-88), прил. Б, пп. Б.21, Б.33; пп. 7.1, 7.5, 8.2, 8.5", "quote": "Б.33: «стяжка...: Слой пола... для выравнивания поверхности нижерасположенного слоя..., а также распределения нагрузок по нежестким слоям пола на перекрытии». 7.5: «По поверхности гидроизоляции... перед укладкой на нее покрытий, материалов прослоек или стяжек, в состав которых входит цемент...»", "url": "https://meganorm.ru/mega_doc/norm/pravila/0/sp_29_13330_2011_svod_pravil_poly_aktualizirovannaya.html", "explanation": "Снизу вверх: плита перекрытия, тепло- и звукоизоляция, бетонная стяжка (она распределяет нагрузку по мягкому утеплителю), гидроизоляция (защищает пол от жидкостей сверху), затем сталефибробетонное покрытие.", "confidence": "medium", "note": "Ни СНиП 2.03.13-88, ни СП 29.13330 не дают готовой схемы именно этого пола. Порядок «перекрытие → теплозвукоизоляция → стяжка» прямо следует из норм (стяжка устраивается по тепло- и звукоизоляционному слою). Место гидроизоляции (между стяжкой и покрытием) выбрано по типовой схеме пола на перекрытии (покрытие – прослойка – гидроизоляция – стяжка – тепло-звукоизоляция – перекрытие) и по п. 7.5."}, {"id": 93, "text": "Установите последовательность выполнения земляных работ на строительной площадке в соответствии с технологическим процессом.", "instruction": "Ответ запишите в виде последовательности цифр, соответствующих действиям. Действия:", "options": ["рытье котлована (траншеи) под фундаменты", "засыпка пазух", "срезка растительного слоя", "устройство песчаного (щебеночного) основания", "вертикальная планировка площадки"], "type": "sequence", "answer": [3, 5, 1, 4, 2], "source": "СП 45.13330.2017 «Земляные сооружения, основания и фундаменты», пп. 10.2, 8.1, 11.30, 11.39", "quote": "10.2: «Плодородный слой почвы... на площади, занимаемой различными выемками, до начала основных земляных работ должен быть снят...» 8.1: «...вертикальную планировку площадки строительства; ...отрывку котлована...; уплотнение грунтов основания...; обратную засыпку котлованов и траншей»", "url": "https://meganorm.ru/mega_doc/norm/akt_forma/0/sp_45_13330_2017_svod_pravil_zemlyanye_sooruzheniya.html", "explanation": "Сначала снимают плодородный (растительный) слой, затем делают вертикальную планировку, роют котлован, устраивают песчаное или щебёночное основание под фундамент, а после возведения фундамента засыпают пазухи.", "confidence": "high", "note": ""}, {"id": 94, "text": "Установите последовательность размещения слоев в покрытии неэксплуатируемой плоской кровли в соответствии с СП 17.13330.2017 «Кровли». Актуализированная редакция СНиП II-26-76.", "instruction": "Ответ запишите в виде последовательности цифр, соответствующих слоям покрытия. Слои покрытия:", "options": ["грунтовка", "монолитная плита", "пароизоляция", "сборная стяжка", "теплоизоляция"], "type": "sequence", "answer": [2, 3, 5, 4, 1], "source": "СП 17.13330.2017 «Кровли», п. 5.1.4 (перечисление «д» и последний абзац), приложение Г, рисунок Г.1", "quote": "5.1.4 д): «сборных (сухих) стяжек из двух огрунтованных... листов... смонтированных на теплоизоляции...»; «Поверхность основания под водоизоляционный ковер перед приклейкой рулонного материала или перед нанесением мастичного слоя должна быть огрунтована...»", "url": "https://meganorm.ru/mega_doc/norm/normy/0/sp_17_13330_2017_svod_pravil_krovli_aktualizirovannaya.html", "explanation": "Снизу вверх: несущая монолитная плита, пароизоляция (защищает утеплитель от пара из помещения), теплоизоляция, сборная стяжка по утеплителю, грунтовка. На грунтовку потом наклеивают водоизоляционный ковёр.", "confidence": "high", "note": ""}, {"id": 95, "text": "Установите последовательность этапов строительства частного дома в соответствии с технологическим процессом возведения здания.", "instruction": "Ответ запишите в виде последовательности цифр, соответствующих этапам. Этапы:", "options": ["возведение стен", "выбор участка и его планировка", "монтаж систем отопления, водоснабжения и канализации", "создание внутренних перегородок", "установка фундамента", "установка окон и дверей", "устройство кровли"], "type": "sequence", "answer": [2, 5, 1, 7, 6, 4, 3], "source": "Технологическая последовательность возведения малоэтажного жилого дома (учебная логика: нулевой цикл → коробка → закрытие контура → внутренние работы); СП 45.13330.2017 и СП 70.13330 задают порядок «основание – фундамент – надземные конструкции»", "quote": "Норма с полной последовательностью этих этапов отсутствует.", "url": "", "explanation": "Порядок: выбрать и спланировать участок, сделать фундамент, возвести стены, устроить кровлю, поставить окна и двери (закрыть контур), сделать внутренние перегородки, затем смонтировать отопление, водопровод и канализацию.", "confidence": "low", "note": "Ответ по технологической логике, нормы с таким перечнем нет. Бесспорны первые четыре шага (участок → фундамент → стены → кровля). Порядок последних трёх может отличаться: перегородки иногда ставят до окон, инженерные системы частично монтируют до перегородок."}, {"id": 96, "text": "Какие документы входят в состав исходных данных и условий для подготовки проектной документации на объекты капитального строительства производственного и непроизводственного назначения?", "instruction": "Выберите четыре варианта правильных ответов", "options": ["градостроительный план земельного участка.", "проект планировки территории.", "отчетная документация по результатам инженерных изысканий.", "проект межевания территории.", "технические условия.", "разрешение на отклонения от предельных параметров разрешенного строительства объектов капитального строительства."], "type": "multi", "count": 4, "answer": [1, 3, 5, 6], "source": "ПП РФ от 16.02.2008 № 87, п. 10, подп. «б» (раздел 1 «Пояснительная записка»); ГрК РФ, ст. 48, ч. 6", "quote": "«б) исходные данные и условия для подготовки проектной документации...: ...отчетная документация по результатам инженерных изысканий; ...градостроительный план земельного участка...; технические условия...; разрешение на отклонение от предельных параметров разрешенного строительства...»", "url": "https://www.consultant.ru/document/cons_doc_LAW_75048/cae383069aa05e04750eb0df525a6c535460cc1a/", "explanation": "Для объектов производственного и непроизводственного назначения исходные данные — ГПЗУ, отчёт по инженерным изысканиям, технические условия и (если есть) разрешение на отклонение от предельных параметров. Проект планировки и проект межевания нужны вместо ГПЗУ только для линейных объектов.", "confidence": "high", "note": ""}, {"id": 97, "text": "Выберите из списка определение термина \"предпроектная подготовка в строительстве\":", "instruction": "", "options": ["комплекс работ, проводимых в целях обоснования градостроительной деятельности на территории и получение права на ее проведение.", "комплекс взаимосвязанных мероприятий, направленных на подготовку создания объекта (основных фондов), комплекса объектов производственного или непроизводственного назначения, линейных сооружений.", "комплекс мероприятий, направленных на привлечение, вложение и управление инвестициями (инвестирование) для целей строительства, реконструкции и капитального ремонта.", "комплекс мероприятий, направленных на подготовку ввода в действие объектов производственного и непроизводственного назначения, а также линейных сооружений.", "комплекс работ, проводимых в целях определения технико-экономических показателей и проектных значений основных параметров планируемого к строительству, реконструкции объекта капитального строительства."], "type": "single", "answer": [1], "source": "Распоряжение Мэра Москвы от 11.04.2000 № 378-РМ «О Положении о едином порядке предпроектной и проектной подготовки строительства в г. Москве», приложение 1 (термины)", "quote": "«Предпроектная подготовка строительства - комплекс работ, проводимых в целях обоснования градостроительной деятельности на территории и получения права на ее проведение.»", "url": "https://www.mos.ru/authority/documents/doc/14341220/", "explanation": "Предпроектная подготовка — работы, которые обосновывают возможность строительства на территории и дают право его вести (градостроительное обоснование, исходно-разрешительная документация).", "confidence": "high", "note": "Определение дословно совпадает с вариантом 1, но взято из московского акта 2000 г. В федеральном законодательстве (ГрК РФ) термин «предпроектная подготовка» не определён."}, {"id": 98, "text": "При каком условии допускается подготовка проектной документации, строительство, реконструкция объектов капитального строительства без выполнения инженерных изысканий?", "instruction": "Выберите один вариант правильного ответа", "options": ["не допускается ни при каком условии.", "допускается, при условии, что разрабатываемая проектная документация на объект капитального строительства является типовой.", "допускается, при условии, что разрабатываемая проектная документация на объект капитального строительства не относится к категории уникальных.", "допускается, при условии, что разрабатываемая проектная документация на объект капитального строительства является экономически эффективной проектной документацией повторного использования", "допускается, при условии, что объект капитального строительства не относится к категории особо опасных или технически сложных."], "type": "single", "answer": [1], "source": "Градостроительный кодекс РФ, ст. 47, ч. 1", "quote": "«Подготовка проектной документации, а также строительство, реконструкция объектов капитального строительства в соответствии с такой проектной документацией не допускаются без выполнения соответствующих инженерных изысканий.»", "url": "https://www.consultant.ru/document/cons_doc_LAW_51040/f651879e0acd4680a6fdc29f983536624055cbcc/", "explanation": "Кодекс прямо запрещает готовить проект и строить по нему без инженерных изысканий. Исключений для типовых, повторно применяемых или «не уникальных» проектов нет.", "confidence": "high", "note": ""}, {"id": 99, "text": "Какой из нижеперечисленных параметров НЕ относится к технико-экономическим показателям проектируемых объектов капитального строительства?", "instruction": "Выберите один вариант правильного ответа", "options": ["площадь застройки", "общая площадь", "строительный объём", "количество этажей", "класс энергетической эффективности."], "type": "single", "answer": [5], "source": "ПП РФ от 16.02.2008 № 87, п. 10, подп. «м» (раздел 1 «Пояснительная записка»)", "quote": "«м) технико-экономические показатели проектируемых объектов капитального строительства, в том числе площадь застройки, общая площадь, строительный объем (в том числе подземной части), количество этажей (в том числе подземных) и протяженность (для линейных объектов)»", "url": "https://www.consultant.ru/document/cons_doc_LAW_75048/cae383069aa05e04750eb0df525a6c535460cc1a/", "explanation": "Площадь застройки, общая площадь, строительный объём и количество этажей — это технико-экономические показатели объекта. Класс энергетической эффективности — характеристика энергоэффективности, её приводят в разделе о мерах по энергоэффективности.", "confidence": "high", "note": ""}, {"id": 100, "text": "В каком из перечисленных документов содержится информация о возможности подключения (технологического присоединения) объектов капитального строительства к сетям инженерно-технического обеспечения (за исключением сетей электроснабжения), определяемая с учетом программ комплексного развития систем коммунальной инфраструктуры поселения, муниципального округа, городского округа?", "instruction": "Выберите один вариант правильного ответа", "options": ["градостроительный план земельного участка.", "проект планировки территории.", "правила землепользования и застройки.", "проект межевания территории.", "разрешение на строительство.
